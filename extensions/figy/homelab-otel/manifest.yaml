manifestVersion: 1
name: "@figy/homelab-otel"
version: "2026.10.03.2"
description: >
  Site-specific OpenTelemetry bootstrap for the fi.gy homelab — my domains,
  meshes, and tiers, wired into one workflow.

  WHAT IT DOES

    The concrete, private half of an OpenTelemetry fleet setup. It supplies my
    observability contract — the dedicated `otel.fi.gy` sub-zone, the tailscale
    and wireguard gateway endpoints, home/sven attributes, and 14/90/7-day
    retention — to the generic @svendowideit models, and runs the whole publish
    path: render the contract, stage it versioned, serve it over HTTP(S) at
    `settings.otel.fi.gy` with Caddy (DNS-01 TLS via the Gandi driver), and
    verify the live document. Prefer it over hand-editing settings on each host:
    change the contract once and every agent fetches it. This is site-specific
    by design — it encodes my domains, meshes, and gear, so it is useless without
    them; the portable model types live in @svendowideit.

  INSTALL

      swamp extension pull @figy/homelab-otel

  DEPENDENCIES

    @svendowideit/otel-settings, @svendowideit/settings-server,
    @svendowideit/caddy, @svendowideit/otel-backend, @svendowideit/otel-gateway,
    and @svendowideit/openobserve — pulled separately. A `figy`-trusted swamp repo
    (`swamp extension trust add figy`) so the pull resolves.

    Docker, plus the store's admin login in a vault BEFORE running the backend
    bootstrap. The OpenObserve profile seeds its first admin user at first start,
    so both keys must exist or the container crash-loops:

      swamp vault create @svendowideit/systemd-creds otel-openobserve-admin
      swamp vault put otel-openobserve-admin ZO_ROOT_USER_EMAIL
      swamp vault put otel-openobserve-admin ZO_ROOT_USER_PASSWORD

  RUN

      # Store the store's admin login first (the backend seeds it on first start).
      swamp vault create @svendowideit/systemd-creds otel-openobserve-admin
      swamp vault put otel-openobserve-admin ZO_ROOT_USER_EMAIL
      swamp vault put otel-openobserve-admin ZO_ROOT_USER_PASSWORD

      # Render, stage, serve, and verify the fi.gy observability contract.
      swamp workflow run @figy/homelab-otel-bootstrap

      # Bring up the whole core node: store + gateway + DNS + round-trip verify.
      swamp workflow run @figy/bootstrap-otel-backend

      # Read the resolved contract for scripting.
      swamp data get otel resolved --json

      # Fetch the served machine contract.
      curl https://settings.otel.fi.gy/otel.json

  CONFIGURE

    Each workflow takes optional --input overrides, so the same definitions run
    in each environment:

      deploymentEnvironment   dev (this machine) | uat (T440s) | prod (Xeon)
      settingsHostname        defaults to settings.otel.fi.gy
      webroot                 directory Caddy serves the staged bundle from
      bindAddress             address the store/gateway bind to (127.0.0.1 or a mesh address)
      vaultName               vault holding the OpenObserve admin login

    The site values themselves (domain, endpoints, meshes, retention) are fixed
    in the workflows' step globalArgs, because they are the point of this
    extension.

  WHAT IT INSTALLS

    Nothing directly — it creates/updates swamp models and data, and (via
    @svendowideit/caddy) configures a Caddy route serving the settings webroot at
    `settings.otel.fi.gy`. No cron triggers or webhooks.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - homelab_otel.ts

workflows:
  - homelab-otel-bootstrap.yaml
  - bootstrap-otel-backend.yaml

dependencies:
  - "@svendowideit/otel-settings"
  - "@svendowideit/settings-server"
  - "@svendowideit/caddy"
  - "@svendowideit/otel-backend"
  - "@svendowideit/otel-gateway"
  - "@svendowideit/openobserve"

additionalFiles:
  - README.md
  - LICENSE.txt
  - homelab_otel_test.ts

platforms: []
