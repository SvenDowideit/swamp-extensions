id: 2299ea7a-de44-4425-a3cf-a39fa152ed28
name: '@figy/nanokvm-cert'
description: |
  fi.gy's NanoKVM TLS: install the Let's Encrypt certificate Caddy issued for
  <name>.fi.gy onto every NanoKVM swamp looks after, and keep each current.

  The NanoKVM has no certificate-upload endpoint, so this drives
  @svendowideit/nanokvm's `cert install`, which writes /etc/kvm/server.crt and
  .key on the device through its admin script API and restarts the web server.
  The certificate files are taken from Caddy's store
  (~/.local/share/caddy/certificates), where Caddy issued them and renews them
  automatically via DNS-01 (@figy/nanokvm-dns declares the device names as TLS
  subjects) — so this workflow only syncs the devices, it never obtains a cert
  itself.

  It discovers the devices the same way the health and DNS workflows do —
  @svendowideit/nanokvm's `devices` scan of the repo's model definitions — so
  adding a KVM is adding a model definition. On firmware that still serves plain
  HTTP (`scheme: http`, port 80) the install also enables HTTPS: `enableHttps`
  backs up /etc/kvm/server.yaml and points `proto` and the cert paths at the
  files just written, so the device comes up on 443 with the Caddy certificate
  instead of ignoring it.

  Run it on a schedule: Caddy renews roughly 30 days before expiry, and this
  re-installs onto each device whenever the installed certificate is older or
  missing (and after a firmware update, which can wipe /etc/kvm). It is
  idempotent — an unchanged certificate is a no-op that still verifies.

  Run it by hand after adding a device or a certificate subject:
    swamp workflow run @figy/nanokvm-cert
    swamp workflow run @figy/nanokvm-cert --input device=nanokvm2

tags:
  collective: figy
trigger:
  schedule: '30 4 * * *'
inputs:
  properties:
    scanModel:
      type: string
      default: nanokvm
      description: >-
        Name of the @svendowideit/nanokvm instance whose `devices` method scans
        the repo for the devices to sync. Its own address is irrelevant; only
        the scan runs.
    device:
      type: string
      default: ''
      description: >-
        Optional: sync only this model instance (e.g. nanokvm2). Empty syncs
        every NanoKVM the repo defines.
    zone:
      type: string
      default: fi.gy
      description: DNS zone each device's certificate name lives under.
    certDir:
      type: string
      default: ~/.local/share/caddy/certificates
      description: Caddy's certificate store, where the issued certificates live.
    vaultName:
      type: string
      default: nanokvm
      description: Vault holding the device login password (the script API needs admin).
    passwordRef:
      type: string
      default: NANOKVM_PASSWORD
      description: Vault key holding the login password.
    restart:
      type: boolean
      default: true
      description: Restart the NanoKVM web server after writing the files.
    enableHttps:
      type: boolean
      default: true
      description: >-
        Turn on HTTPS for a device the model still reaches over plain HTTP
        (`proto: https` in /etc/kvm/server.yaml, backed up first). Ignored for a
        device already served over HTTPS.
  required: []
jobs:
  - name: cert
    description: Install the Caddy-issued certificate onto each device and verify it.
    steps:
      - name: discover
        description: >-
          Scan the repo's model definitions for @svendowideit/nanokvm instances
          so each device's name, address, port, scheme and DNS name are known.
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ inputs.scanModel }}
          methodName: devices
          inputs:
            zone: ${{ inputs.zone }}
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: install-${{ self.d.name }}
        description: >-
          Locate the Caddy-issued certificate for ${{ self.d.dnsName }}, push it
          onto the device through the admin script API, restart the server and
          verify the device serves it. The model's own globals carry the host,
          port and scheme, so they are not repeated here.
        forEach:
          item: d
          in: ${{ data.latest(inputs.scanModel, "devices").attributes.devices }}
        guard: ${{ inputs.device != "" && inputs.device != self.d.name }}
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ self.d.name }}
          methodName: cert
          globalArgs:
            vaultName: ${{ inputs.vaultName }}
            passwordRef: ${{ inputs.passwordRef }}
          inputs:
            action: install
            name: ${{ self.d.dnsName }}
            certDir: ${{ inputs.certDir }}
            restart: ${{ inputs.restart }}
            enableHttps: ${{ inputs.enableHttps }}
        dependsOn:
          - step: discover
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: assert-${{ self.d.name }}
        description: >-
          Confirm ${{ self.d.name }} now serves a certificate carrying its name.
        forEach:
          item: d
          in: ${{ data.latest(inputs.scanModel, "devices").attributes.devices }}
        guard: ${{ inputs.device != "" && inputs.device != self.d.name }}
        task:
          type: assert
          expr: >-
            data.latest(self.d.name, "cert").attributes.installed == true &&
            data.latest(self.d.name, "cert").attributes.matchesName == true
          message: >-
            The device did not end up serving a certificate for ${{
            self.d.dnsName }}; the install did not verify.
          severity: high
        dependsOn:
          - step: install-${{ self.d.name }}
            condition:
              type: completed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
