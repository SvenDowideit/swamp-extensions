id: a314833d-0c2b-455f-86ab-24c26973a543
name: '@figy/nanokvm-health'
description: |
  fi.gy's scheduled NanoKVM health: check the out-of-band KVM at 10.10.12.230,
  forward its health to the swamp-managed OpenTelemetry collector, and publish a
  fleet health report.

  This is the concrete, site-specific half. The portable model that knows how to
  talk to a NanoKVM (self-signed TLS, AES login, cookie session, health verdict)
  lives in @svendowideit/nanokvm; this workflow pins it to my device and my
  collector. Every 15 minutes it runs `health`, asks the model to `emit` the
  latest verdict to the local OTLP receiver (http://127.0.0.1:4318) as a log
  record plus gauges, and requires @svendowideit/nanokvm-health-report so a
  failure or a warning is visible in `swamp report get`.

  The password is read from the `nanokvm` vault by the model; nothing secret is
  in this file. A device that is off or unreachable is not a workflow failure —
  it is recorded as a `fail` verdict and emitted like any other sample, so the
  report always has something to show and a flapping device leaves a trail.

  Run it now instead of waiting for the trigger (override any input):
    swamp workflow run @figy/nanokvm-health
    swamp workflow run @figy/nanokvm-health --input host=10.10.12.231

tags:
  collective: figy
trigger:
  schedule: '*/15 * * * *'
inputs:
  properties:
    device:
      type: string
      default: nanokvm
      description: Name of the @svendowideit/nanokvm model instance to drive.
    host:
      type: string
      default: '10.10.12.230'
      description: NanoKVM address (no scheme).
    port:
      type: integer
      default: 443
      description: HTTPS port of the NanoKVM web server.
    username:
      type: string
      default: admin
      description: NanoKVM web UI user.
    vaultName:
      type: string
      default: nanokvm
      description: Vault holding the NanoKVM login password.
    passwordRef:
      type: string
      default: NANOKVM_PASSWORD
      description: Vault key holding the login password.
    curlModel:
      type: string
      default: nanokvm-curl
      description: Name of the @svendowideit/curl instance that carries the session.
    otelModel:
      type: string
      default: otel
      description: 'The @svendowideit/otel-settings model supplying the OTLP contract.'
    otelEndpoint:
      type: string
      default: 'http://127.0.0.1:4318'
      description: >-
        OTLP/HTTP base URL for the local gateway receiver. Empty falls back to
        the settings contract's endpoint.
    otelMesh:
      type: string
      default: tailscale
      description: Settings-contract mesh to prefer when otelEndpoint is empty.
    otelVaultName:
      type: string
      default: ''
      description: Vault holding the OTLP gateway bearer token (empty = none).
    otelTokenRef:
      type: string
      default: OTEL_EXPORTER_OTLP_TOKEN
      description: Vault/environment key for the OTLP gateway bearer token.
reports:
  require:
    - '@svendowideit/nanokvm-health-report'
jobs:
  - name: health
    description: Check the device and forward its health to OTel.
    steps:
      - name: check
        description: Run the read-only NanoKVM health check (always records a verdict).
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ inputs.device }}
          methodName: health
          globalArgs:
            host: ${{ inputs.host }}
            port: ${{ inputs.port }}
            username: ${{ inputs.username }}
            vaultName: ${{ inputs.vaultName }}
            passwordRef: ${{ inputs.passwordRef }}
            curlModel: ${{ inputs.curlModel }}
            otelModel: ${{ inputs.otelModel }}
            otelEndpoint: ${{ inputs.otelEndpoint }}
            otelMesh: ${{ inputs.otelMesh }}
            otelVaultName: ${{ inputs.otelVaultName }}
            otelTokenRef: ${{ inputs.otelTokenRef }}
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: emit
        description: >-
          Push the latest health to the OTLP receiver. A no-op that records the
          reason when no collector is configured, so it is safe to leave enabled.
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ inputs.device }}
          methodName: emit
          inputs:
            health: >-
              ${{ data.latest(inputs.device, "health").?attributes.orValue({}) }}
        dependsOn:
          - step: check
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: assert-checked
        description: Confirm the health step produced a record (not that the device is up).
        task:
          type: assert
          expr: >-
            data.latest(inputs.device, "health").?attributes.?checkedAt.orValue("") != ""
          message: >-
            The health step wrote no health record for ${{
            inputs.device }}; the pipeline did not run.
          severity: high
        dependsOn:
          - step: check
            condition:
              type: completed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
