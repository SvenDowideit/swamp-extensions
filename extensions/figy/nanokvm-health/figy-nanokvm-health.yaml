id: a314833d-0c2b-455f-86ab-24c26973a543
name: '@figy/nanokvm-health'
description: |
  fi.gy's scheduled NanoKVM health: check every out-of-band KVM swamp looks
  after, forward each verdict to the swamp-managed OpenTelemetry collector, and
  publish one fleet health report.

  This is the concrete, site-specific half. The portable model that knows how to
  talk to a NanoKVM (TLS or plain HTTP, dual-firmware login, cookie or bearer
  session, health verdict) lives in @svendowideit/nanokvm; this workflow pins it
  to my devices and my collector. Every 15 minutes it discovers the devices from
  the repo (@svendowideit/nanokvm's `devices` scan of the model definitions — the
  same scan @figy/nanokvm-dns uses), runs `health` against each one, asks each
  model to `emit` the latest verdict to the local OTLP receiver
  (http://127.0.0.1:4318) as a log record plus gauges, and requires
  @svendowideit/nanokvm-health-report so a failure or a warning is visible in
  `swamp report get`.

  Adding a KVM is adding a model definition — no workflow edit. Each iteration
  uses its own model's host, port, scheme and curl instance, so an HTTP-only
  device and an HTTPS one run side by side. The password is read from the
  `nanokvm` vault by the model; nothing secret is in this file. A device that is
  off or unreachable is not a workflow failure — it is recorded as a `fail`
  verdict and emitted like any other sample, so the report always has something
  to show and a flapping device leaves a trail.

  Run it now instead of waiting for the trigger:
    swamp workflow run @figy/nanokvm-health
    swamp workflow run @figy/nanokvm-health --input device=nanokvm2

tags:
  collective: figy
trigger:
  schedule: '*/15 * * * *'
inputs:
  properties:
    scanModel:
      type: string
      default: nanokvm
      description: >-
        Name of the @svendowideit/nanokvm instance whose `devices` method scans
        the repo for the KVMs to check. Its own address is irrelevant; only the
        scan runs.
    device:
      type: string
      default: ''
      description: >-
        Optional: check only this model instance (e.g. nanokvm2). Empty checks
        every NanoKVM the repo defines.
    zone:
      type: string
      default: fi.gy
      description: DNS zone the devices' names live under (used by the scan).
    username:
      type: string
      default: admin
      description: NanoKVM web UI user.
    vaultName:
      type: string
      default: nanokvm
      description: Vault holding the NanoKVM login password.
    passwordRef:
      type: string
      default: NANOKVM_PASSWORD
      description: Vault key holding the login password.
    otelModel:
      type: string
      default: otel
      description: 'The @svendowideit/otel-settings model supplying the OTLP contract.'
    otelEndpoint:
      type: string
      default: 'http://127.0.0.1:4318'
      description: >-
        OTLP/HTTP base URL for the local gateway receiver. Empty falls back to
        the settings contract's endpoint.
    otelMesh:
      type: string
      default: tailscale
      description: Settings-contract mesh to prefer when otelEndpoint is empty.
    otelVaultName:
      type: string
      default: ''
      description: Vault holding the OTLP gateway bearer token (empty = none).
    otelTokenRef:
      type: string
      default: OTEL_EXPORTER_OTLP_TOKEN
      description: Vault/environment key for the OTLP gateway bearer token.
  required: []
reports:
  require:
    - '@svendowideit/nanokvm-health-report'
jobs:
  - name: health
    description: Check every discovered device and forward its health to OTel.
    steps:
      - name: discover
        description: >-
          Scan the repo's model definitions for @svendowideit/nanokvm instances
          and record each device's name, address, port, scheme and DNS name.
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ inputs.scanModel }}
          methodName: devices
          inputs:
            zone: ${{ inputs.zone }}
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: check-${{ self.d.name }}
        description: >-
          Run the read-only health check on ${{ self.d.name }}; it always records
          a verdict, reachable or not. The model's own globals carry the
          device's host, port and scheme (discovery reads them from the
          definition), so they are not repeated here.
        forEach:
          item: d
          in: ${{ data.latest(inputs.scanModel, "devices").attributes.devices }}
        guard: ${{ inputs.device != "" && inputs.device != self.d.name }}
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ self.d.name }}
          methodName: health
          globalArgs:
            username: ${{ inputs.username }}
            vaultName: ${{ inputs.vaultName }}
            passwordRef: ${{ inputs.passwordRef }}
            otelModel: ${{ inputs.otelModel }}
            otelEndpoint: ${{ inputs.otelEndpoint }}
            otelMesh: ${{ inputs.otelMesh }}
            otelVaultName: ${{ inputs.otelVaultName }}
            otelTokenRef: ${{ inputs.otelTokenRef }}
        dependsOn:
          - step: discover
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: emit-${{ self.d.name }}
        description: >-
          Push ${{ self.d.name }}'s latest health to the OTLP receiver. A no-op
          that records the reason when no collector is configured.
        forEach:
          item: d
          in: ${{ data.latest(inputs.scanModel, "devices").attributes.devices }}
        guard: ${{ inputs.device != "" && inputs.device != self.d.name }}
        task:
          type: model_method
          modelType: '@svendowideit/nanokvm'
          modelName: ${{ self.d.name }}
          methodName: emit
          inputs:
            health: >-
              ${{ data.latest(self.d.name, "health").?attributes.orValue({}) }}
        dependsOn:
          - step: check-${{ self.d.name }}
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: assert-${{ self.d.name }}
        description: >-
          Confirm ${{ self.d.name }} produced a health record (not that the
          device is up).
        forEach:
          item: d
          in: ${{ data.latest(inputs.scanModel, "devices").attributes.devices }}
        guard: ${{ inputs.device != "" && inputs.device != self.d.name }}
        task:
          type: assert
          expr: >-
            data.latest(self.d.name, "health").?attributes.?checkedAt.orValue("") != ""
          message: >-
            The health step wrote no health record for ${{ self.d.name }}; the
            pipeline did not run.
          severity: high
        dependsOn:
          - step: check-${{ self.d.name }}
            condition:
              type: completed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
