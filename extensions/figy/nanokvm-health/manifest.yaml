manifestVersion: 1
name: "@figy/nanokvm-health"
version: "2026.11.14.1"
description: >
  fi.gy's scheduled NanoKVM pipeline: check every out-of-band KVM swamp looks
  after every 15 minutes, forward each health verdict to the swamp-managed
  OpenTelemetry collector, publish a fleet health report, publish each device as
  a DNS record, and install its Let's Encrypt certificate.

  WHAT IT DOES

    The private, site-specific half of NanoKVM management, for a repo that may
    hold any number of KVMs. The portable model that talks to a Sipeed NanoKVM
    lives in @svendowideit/nanokvm; these workflows discover the devices from
    the repo's model definitions and drive each one. Health and emit run every
    15 minutes and require @svendowideit/nanokvm-health-report, so one fleet
    table shows every device; a device that is off is a `fail` verdict, not a
    workflow failure, so a flapping device leaves a trail. The DNS workflow
    publishes each device as a name under the zone (A records via the shared
    Caddy, which also renews a Let's Encrypt certificate for the name), and the
    certificate workflow installs that certificate onto each KVM — switching an
    HTTP-only device to HTTPS — so every web UI serves a trusted certificate.

  INSTALL

      swamp extension pull @figy/nanokvm-health

  DEPENDENCIES

    @svendowideit/nanokvm, @svendowideit/curl and @svendowideit/caddy (pulled
    automatically), a device reachable at the configured address, the login
    password stored in the `nanokvm` vault (`swamp vault create
    @svendowideit/systemd-creds nanokvm` then `swamp vault put nanokvm
    NANOKVM_PASSWORD`), and a running OTLP gateway listening on 127.0.0.1:4318
    (the @svendowideit/otel-gateway). Without the gateway the `emit` step still
    runs and records why it skipped. The DNS/certificate workflows additionally
    need the `nanokvm-caddy` repo model (created once; see the README).

  RUN

      # Run it now, once, instead of waiting for the 15-minute trigger.
      swamp workflow run @figy/nanokvm-health

      # Check one device only, when you have just added or moved it.
      swamp workflow run @figy/nanokvm-health --input device=nanokvm2

      # Read the fleet health report this run produced.
      swamp report get @svendowideit/nanokvm-health-report \
        --workflow @figy/nanokvm-health --markdown

      # Publish every NanoKVM swamp looks after as <name>.fi.gy A records and
      # declare the name for a Let's Encrypt certificate (run after adding or
      # moving a device). Caddy then issues and renews the certificate.
      swamp workflow run @figy/nanokvm-dns

      # Install the renewed certificate onto every device (scheduled daily; the
      # KVM has no cert-upload API, so it is written via the admin script API).
      # A device still serving plain HTTP is switched to HTTPS here.
      swamp workflow run @figy/nanokvm-cert

      # Sync just the device you just added.
      swamp workflow run @figy/nanokvm-cert --input device=nanokvm2

  CONFIGURE

    Devices are not workflow inputs: each workflow runs the model's `devices`
    scan, so a device's address, port and transport come from its model
    definition and adding a KVM is adding a definition. The inputs are the
    shared settings — scanModel (the instance whose scan runs), device (empty =
    every discovered device, a name = just that one), zone (default fi.gy),
    username, vaultName and passwordRef (the vault holding the login password),
    and the otel* inputs for the collector. `@figy/nanokvm-cert` adds certDir
    (Caddy's certificate store), restart and enableHttps (default true: turn on
    HTTPS for a device still reached over plain HTTP, ignored otherwise).
    `@figy/nanokvm-dns` takes caddy (the repo caddy model), nanokvmModel (the
    instance whose scan runs), zone and ttl. The trigger is read-only inside an
    extension; change the schedule from the host with
    `swamp workflow trigger set @figy/nanokvm-health --schedule "0 * * * *"`.
    See the README for the full tables.

  UPGRADE

    This extension installs nothing on the host, so an upgrade has nothing to
    rebuild or reconcile. Refresh the pulled workflow with one idempotent
    command:

        # Pull the newest published copy of the workflow.
        swamp extension update

    The device model it drives is upgraded by its own extension's `upgrades`
    entry on the next method run.

  WHAT IT INSTALLS

    Nothing on the host — no services, cron triggers, daemons or webhooks. The
    schedule is a swamp `trigger` evaluated by `swamp serve`; it runs the
    @svendowideit/nanokvm model, which talks to the device and the collector and
    writes swamp data.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

workflows:
  - figy-nanokvm-health.yaml
  - figy-nanokvm-dns.yaml
  - figy-nanokvm-cert.yaml

dependencies:
  - "@svendowideit/nanokvm"
  - "@svendowideit/caddy"

additionalFiles:
  - README.md
  - LICENSE.txt

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
