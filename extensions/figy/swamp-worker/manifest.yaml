manifestVersion: 1
name: "@figy/swamp-worker"
version: "2026.10.11.1"
description: >
  Site-specific: enlist an fi.gy host as a swamp worker for one serve instance,
  driving the generic @svendowideit/swamp-worker model through one workflow.

  WHAT IT DOES

    The concrete, private half of the worker setup. It fixes the fi.gy serve URL
    and the worker identity, then runs the whole deploy in order on the worker
    host: mint a long-duration enrollment token, render and reconcile the
    `swamp-worker-figy` systemd user unit (enable + linger), and report the live
    unit and enrollment status. Change the worker once on the orchestrator and
    every host that runs this workflow converges onto it. This is site-specific
    by design — it encodes the fi.gy serve endpoint and identity, so it is
    useless without them; the portable model lives in
    @svendowideit/swamp-worker. Prefer it over `swamp worker daemon enable`
    because that daemon hardcodes the unit name, so only one worker can exist per
    host — this workflow namespaces every artifact by identity and coexists with
    other repos' workers.

  INSTALL

      swamp extension pull @figy/swamp-worker

  DEPENDENCIES

    @svendowideit/swamp-worker (pulled separately), and a running fi.gy
    `swamp serve` the worker can reach. A `figy`-trusted swamp repo
    (`swamp extension trust add figy`) so the pull resolves.

  RUN

      # Create the generic worker model once (identity namespaces the worker),
      # then run the site workflow — it mints the token, reconciles the unit and
      # reports status.
      swamp model create @svendowideit/swamp-worker worker \
        --global-arg identity=figy
      swamp workflow run @figy/swamp-worker-bootstrap \
        --input serveUrl=wss://swamp.x1yoga.fi.gy

  CONFIGURE

    The workflow takes `serveUrl` (the fi.gy serve the worker dials, required),
    `identity` (default `figy`), and `duration` (token lifetime, default `30d`).
    The generic model's globals (binary path, dirs, concurrency) are set on the
    `worker` model instance as usual.

  WHAT IT INSTALLS

    Nothing itself — it drives @svendowideit/swamp-worker, which installs a
    systemd user unit `swamp-worker-<identity>.service`, the worker cache dir,
    and 0600 token/env files, and enables user lingering. No cron triggers or
    webhooks.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

workflows:
  - worker-bootstrap.yaml

dependencies:
  - "@svendowideit/swamp-worker"

additionalFiles:
  - README.md
  - LICENSE.txt
  - test-factory.yaml

platforms: []
