# Acceptance tests for @figy/swamp-worker — the site fan-out workflow that deploys
# workers to a set of hosts over SSH, driving @svendowideit/swamp-worker.
#
# Run it on a systemd host:
#   swamp model @svendowideit/test-factory method run test tf \
#     --input manifest=extensions/figy/swamp-worker/manifest.yaml \
#     --input scenario=ubuntu-systemd-standalone
#
# `harness.sshd: true` runs an SSH server inside the harness, so the one "host"
# the node set targets is the harness itself — the real @swamp/ssh transport, the
# real provisioning script, and the real systemd user unit, all in one container.
# `@swamp/ssh` (a declared dependency) is pulled by the harness before the phases.

harness:
  sshd: true

extensions:
  swamp-worker: extensions/models/swamp-worker

tests:
  - name: fan-out-deploys-a-worker-over-ssh
    confirms: >
      `@figy/swamp-worker-bootstrap` renders the per-node provisioning script,
      mints a token, copies it to the node over SSH with @swamp/ssh, runs the
      script on the node (installing the swamp binary, writing the systemd user
      unit and starting it), and the worker enrols on a real `swamp serve` — the
      whole remote deploy in one workflow run.
    cannot: >
      must not leave the worker unit inactive on the node, and must not fail to
      enrol.
    documents: README.md#examples
    variables:
      IDENTITY: figy
      SERVE_URL: ws://127.0.0.1:9090
      REPO: /work/repo
      BIN: /usr/local/bin/swamp
    steps:
      - name: systemd-user-manager-is-running
        run: systemctl --user is-system-running
        expect:
          stdoutContains: ["running"]
      - name: start-serve
        run: |
          cd "$REPO"
          nohup swamp serve --host 127.0.0.1 --port 9090 --auth-mode none >/tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9090/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9090/ready >/dev/null && echo SERVE_READY
        expect:
          exitCode: 0
          outputContains: ["SERVE_READY"]
          outputNotContains: ["SERVE_TIMEOUT"]
        timeoutSeconds: 120
      - name: the-ssh-remote-host-is-reachable
        run: >
          ssh -i "$TF_SSH_KEY" -o StrictHostKeyChecking=no
          -o UserKnownHostsFile="$TF_SSH_KNOWN_HOSTS" -o BatchMode=yes
          -p "$TF_SSH_PORT" "$TF_SSH_USER@$TF_SSH_HOST" 'echo REMOTE_OK'
        expect:
          exitCode: 0
          stdoutContains: ["REMOTE_OK"]
          stdoutNotContains: ["Permission denied", "Connection refused"]
      - name: create-generic-model
        run: |
          swamp model create @svendowideit/swamp-worker worker \
            --global-arg identity=$IDENTITY \
            --global-arg swampBinPath=$BIN \
            --global-arg repoDir=$REPO
        expect:
          exitCode: 0
          outputNotContains: ["error"]
      - name: run-the-fan-out
        run: >
          swamp workflow run @figy/swamp-worker-bootstrap
          --input serveUrl=$SERVE_URL
          --input 'hosts=[{"name":"node1","address":"127.0.0.1"}]'
          --input remoteHome=/root
          --input sshUser=$TF_SSH_USER --input sshPort=$TF_SSH_PORT
          --input sshKey=$TF_SSH_KEY
        expect:
          exitCode: 0
          outputContains: ["succeeded"]
          outputNotContains: ["panic", "failed"]
        timeoutSeconds: 400
      - name: worker-unit-is-active-on-the-node
        run: XDG_RUNTIME_DIR=/run/user/0 systemctl --user is-active swamp-worker-figy
        expect:
          stdoutContains: ["active"]
          stdoutNotContains: ["failed", "inactive"]
      - name: token-was-delivered-0600
        run: stat -c '%a' /root/.config/swamp-worker/figy.token
        expect:
          stdoutContains: ["600"]
          stdoutNotContains: ["644"]
      - name: worker-enrolled-with-labels
        run: |
          for i in $(seq 1 30); do
            swamp worker list --json 2>/dev/null \
              | jq -e '.workers[] | select(.labels.serve == "figy")' >/dev/null 2>&1 \
              && { echo ENROLLED; break; }
            sleep 2
          done
          swamp worker list
        expect:
          exitCode: 0
          outputContains: ["ENROLLED", "figy"]
          outputNotContains: ["error"]
        timeoutSeconds: 120

  - name: fan-out-teardown-removes-the-worker
    confirms: >
      `@figy/swamp-worker-teardown` runs the removal script on the node over SSH
      (stopping, disabling and deleting the unit, cache dir, token and env files)
      and revokes the node's token on the orchestrator — so the worker is
      completely gone and can never re-enrol.
    cannot: >
      must not leave the worker unit active on the node, and must not leave the
      token un-revoked.
    documents: README.md#examples
    variables:
      SERVE_URL: ws://127.0.0.1:9090
    steps:
      - name: run-the-teardown
        run: >
          swamp workflow run @figy/swamp-worker-teardown
          --input 'hosts=[{"name":"node1","address":"127.0.0.1"}]'
          --input sshUser=$TF_SSH_USER --input sshPort=$TF_SSH_PORT
          --input sshKey=$TF_SSH_KEY
        expect:
          exitCode: 0
          outputContains: ["succeeded"]
          outputNotContains: ["panic", "failed"]
        timeoutSeconds: 300
      - name: unit-and-files-are-gone-on-the-node
        run: |
          if systemctl --user is-active swamp-worker-figy >/dev/null 2>&1; then echo STILL_ACTIVE; else echo GONE; fi
          test -f /root/.config/systemd/user/swamp-worker-figy.service && echo UNIT_PRESENT || echo UNIT_REMOVED
          test -e /root/.config/swamp-worker/figy.token && echo TOKEN_PRESENT || echo TOKEN_REMOVED
          test -e /root/.local/share/swamp-worker/figy && echo CACHE_PRESENT || echo CACHE_REMOVED
        expect:
          stdoutContains: ["GONE", "UNIT_REMOVED", "TOKEN_REMOVED", "CACHE_REMOVED"]
          stdoutNotContains: ["STILL_ACTIVE", "UNIT_PRESENT", "TOKEN_PRESENT", "CACHE_PRESENT"]
      - name: token-is-revoked-on-the-orchestrator
        run: |
          state=$(swamp worker token list 2>/dev/null | awk '$1=="figy-node1"{print $2}')
          echo "figy-node1=$state"
          [ "$state" = "revoked" ] && echo TOKEN_REVOKED || echo TOKEN_NOT_REVOKED
        expect:
          stdoutContains: ["TOKEN_REVOKED"]
          stdoutNotContains: ["TOKEN_NOT_REVOKED"]
