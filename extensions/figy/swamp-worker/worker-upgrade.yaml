id: ee24e09a-b60f-4b71-a4ef-06b2b463099d
name: "@figy/swamp-worker-upgrade"
description: |
  Install or upgrade the fi.gy swamp workers in one idempotent run — the same
  command whether a node has no worker yet or already runs one.

  For each node it renders the per-node provisioning script, mints one enrollment
  token per node (`mintToken`, per-target, staged 0600 on the orchestrator, reused
  on re-run), copies each node its own token over SSH with @swamp/ssh, and runs the
  provisioning script on every node. The script installs the swamp binary when it
  is absent, or upgrades it to the requested release (`version`, default `latest`)
  when it differs, installs the token, writes the systemd user unit and starts it.
  The script gates on the unit being active, so no separate SSH verification step
  is needed, and re-running is always safe.

  The SSH fleet is defined inline from the `hosts` input, so only the generic
  model needs to pre-exist:

      swamp model create @svendowideit/swamp-worker worker \
        --global-arg identity=figy --global-arg swampBinPath=~/.local/bin/swamp

  Run:
      swamp workflow run @figy/swamp-worker-upgrade \
        --input serveUrl=wss://swamp.x1yoga.fi.gy \
        --input 'hosts=[{"name":"host1","address":"host1.lan"},{"name":"host2","address":"host2.lan"}]'
inputs:
  properties:
    serveUrl:
      type: string
      default: ""
      description: The serve URL the workers dial (wss:// for a TLS front). Required.
    identity:
      type: string
      default: figy
      description: >
        Worker identity — must match the generic `worker` model's `identity`
        global. The token name and staging file are `<identity>-<node>`.
    hosts:
      type: array
      items:
        type: object
      default: []
      description: >
        The node set, each {name, address, [user], [port]}. One worker — and one
        token — per node; `name` is the worker's node/token name.
    duration:
      type: string
      default: "30d"
      description: Enrollment token lifetime (a hard deadline).
    version:
      type: string
      default: latest
      description: >
        swamp release to install on each node; `latest` (the default) installs
        when absent and upgrades when the node's binary differs. Pin a tag to
        hold the fleet back.
    sshUser:
      type: string
      default: sven
      description: Fleet-default SSH user (a host may override it).
    sshPort:
      type: integer
      default: 22
      description: Fleet-default SSH port.
    sshKey:
      type: string
      default: ~/.ssh/id_ed25519
      description: Fleet-default SSH private key path.
    strictHostKeyChecking:
      type: string
      default: accept-new
      description: SSH StrictHostKeyChecking mode.
  required:
    - serveUrl
jobs:
  - name: deploy
    description: Render, stage tokens, deliver, provision (install or upgrade), verify.
    steps:
      - name: render
        description: >
          Render the per-node provisioning script (host label filled from each
          node's own hostname) into a `provision` resource.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-worker"
          modelName: worker
          methodName: renderProvision
          inputs:
            serveUrl: ${{ inputs.serveUrl }}
            version: ${{ inputs.version }}
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: mint-token
        description: >
          Mint one enrollment token per node on the orchestrator and stage that
          node's plaintext in its own 0600 file (never in swamp data). Per-target
          and idempotent: a slow node touches only its own token/file, and a
          re-run reuses an already-staged token instead of minting a fresh one.
          Serialised (`concurrency: 1`) so the calls never contend on the shared
          model lock.
        forEach:
          item: h
          in: ${{ inputs.hosts }}
        concurrency: 1
        task:
          type: model_method
          modelType: "@svendowideit/swamp-worker"
          modelName: worker
          methodName: mintToken
          inputs:
            name: ${{ inputs.identity + "-" + self.h.name }}
            duration: ${{ inputs.duration }}
        dependsOn:
          - step: render
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: deliver-tokens
        description: >
          Copy each node its own token over SSH (scp) to a fixed staging path on
          the node, so the secret never appears in a command line or swamp data.
          The provisioning script then installs it to its final 0600 location.
        forEach:
          item: h
          in: ${{ inputs.hosts }}
        concurrency: 1
        task:
          type: model_method
          modelType: "@swamp/ssh"
          modelName: figy-workers
          methodName: copy
          globalArgs:
            name: figy-workers
            transport:
              kind: ssh
              user: ${{ inputs.sshUser }}
              port: ${{ inputs.sshPort }}
              identityFile: ${{ inputs.sshKey }}
              strictHostKeyChecking: ${{ inputs.strictHostKeyChecking }}
            hosts: ${{ inputs.hosts }}
          inputs:
            hosts: ${{ self.h.name }}
            src: ${{ "/tmp/swamp-worker-staging/" + inputs.identity + "-" + self.h.name + ".token" }}
            dst: /tmp/swamp-worker-token
            direction: to
        dependsOn:
          - step: mint-token
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: provision
        description: >
          Run the provisioning script on every node: install or upgrade the swamp
          binary, lock the token, write the systemd user unit and start it.
        task:
          type: model_method
          modelType: "@swamp/ssh"
          modelName: figy-workers
          methodName: script
          globalArgs:
            name: figy-workers
            transport:
              kind: ssh
              user: ${{ inputs.sshUser }}
              port: ${{ inputs.sshPort }}
              identityFile: ${{ inputs.sshKey }}
              strictHostKeyChecking: ${{ inputs.strictHostKeyChecking }}
            hosts: ${{ inputs.hosts }}
          inputs:
            hosts: all
            script: ${{ data.latest("worker", "provision").attributes.script }}
        dependsOn:
          - step: deliver-tokens
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
