id: 4a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
name: "@svendowideit/gtd-daily-review"
description: |
  GTD daily review — surface today's calendar and top next actions, log the
  review, and re-render the board.

  Usage:
    swamp workflow run @svendowideit/gtd-daily-review
tags: {}
inputs:
  properties:
    boardPath:
      type: string
      default: ""
      description: Optional absolute path for the board HTML.
  required: []
jobs:
  - name: main
    description: Run the daily review, ensure the web UI server, and re-render the board.
    steps:
      - name: daily-review
        description: Log the daily review.
        task:
          type: model_method
          modelType: "@svendowideit/gtd"
          modelName: gtd
          methodName: dailyReview
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: ensure-server
        description: >-
          Idempotently ensure the GTD web UI server runs as a systemd user
          service (via @svendowideit/systemd-service). Skips with a log if that
          extension is not installed; no-ops if the service is already running.
        task:
          type: model_method
          modelType: "@svendowideit/gtd"
          modelName: gtd
          methodName: ensureServer
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: render
        description: Re-render the responsive board HTML.
        task:
          type: model_method
          modelType: "@svendowideit/gtd"
          modelName: gtd
          methodName: renderBoard
          inputs:
            path: ${{ inputs.boardPath }}
        dependsOn:
          - step: daily-review
            condition:
              type: succeeded
          - step: ensure-server
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
