id: 5b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
name: "@svendowideit/gtd-weekly-review"
description: |
  GTD weekly review — empty the inbox, review projects, next actions,
  someday-maybe, and waiting-for, log the review, and re-render the board.

  Usage:
    swamp workflow run @svendowideit/gtd-weekly-review
tags: {}
inputs:
  properties:
    boardPath:
      type: string
      default: ""
      description: Optional absolute path for the board HTML.
  required: []
jobs:
  - name: main
    description: Run the weekly review, ensure the web UI server, and re-render the board.
    steps:
      - name: weekly-review
        description: Log the weekly review.
        task:
          type: model_method
          modelType: "@svendowideit/gtd"
          modelName: gtd
          methodName: weeklyReview
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: ensure-server
        description: >-
          Idempotently ensure the GTD web UI server runs as a systemd user
          service (via @svendowideit/systemd-service). Skips with a log if that
          extension is not installed; no-ops if the service is already running.
        task:
          type: model_method
          modelType: "@svendowideit/gtd"
          modelName: gtd
          methodName: ensureServer
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: render
        description: Re-render the responsive board HTML.
        task:
          type: model_method
          modelType: "@svendowideit/gtd"
          modelName: gtd
          methodName: renderBoard
          inputs:
            path: ${{ inputs.boardPath }}
        dependsOn:
          - step: weekly-review
            condition:
              type: succeeded
          - step: ensure-server
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
