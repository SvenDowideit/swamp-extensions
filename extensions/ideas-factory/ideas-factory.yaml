id: 520b093e-c8b3-4c0c-857f-bf8369491007
name: "@svendowideit/ideas-factory"
description: |
  Idea factory — Phase 1: capture, classify, and cluster thoughts into common
  ideas. classifyThought (deterministic keyword) runs first, then clusterThoughts
  (LLM) groups related thoughts into ideas. Merge and refine are on-demand steps
  (via the web UI or CLI), not part of this automatic loop. The board is written
  to boardPath when set, otherwise to ~/.swamp/idea-factory/kanban.html. The
  ideas-factory model instance is auto-registered on first run.
tags: {}
inputs:
  properties:
    boardPath:
      type: string
      default: ""
      description: >
        Optional absolute path for the kanban board HTML (e.g. /srv/idea-factory/kanban.html).
        Leave empty to write to ~/.swamp/idea-factory/kanban.html.
  required: []
jobs:
  - name: main
    description: Classify, cluster, and render.
    steps:
      - name: classify
        description: Classify any unclassified thoughts in the inbox.
        task:
          type: model_method
          modelType: "@svendowideit/ideas-factory"
          modelName: ideas-factory
          methodName: classifyThought
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: cluster
        description: Group related thoughts into common ideas (LLM).
        task:
          type: model_method
          modelType: "@svendowideit/ideas-factory"
          modelName: ideas-factory
          methodName: clusterThoughts
        dependsOn:
          - step: classify
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: render
        description: Re-render the kanban board HTML.
        task:
          type: model_method
          modelType: "@svendowideit/ideas-factory"
          modelName: ideas-factory
          methodName: renderBoard
          inputs:
            path: ${{ inputs.boardPath }}
        dependsOn:
          - step: cluster
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 3
