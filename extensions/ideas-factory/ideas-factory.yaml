id: 520b093e-c8b3-4c0c-857f-bf8369491007
name: "@svendowideit/ideas-factory"
description: |
  Idea factory — Phase 0: capture and classify thoughts. A captured thought is
  classified (deterministic keyword matching in Phase 0, no LLM) and remains in
  the kanban Thoughts column. Ideas/Todos are NOT created in Phase 0 — turning
  classified thoughts into common ideas (clustering, routing, refinement) is
  Phase 1 and later. The board is written to boardPath when set, otherwise to
  ~/.swamp/idea-factory/kanban.html. The ideas-factory model instance is
  auto-registered on first run.
tags: {}
inputs:
  properties:
    boardPath:
      type: string
      default: ""
      description: >
        Optional absolute path for the kanban board HTML (e.g. /srv/idea-factory/kanban.html).
        Leave empty to write to ~/.swamp/idea-factory/kanban.html.
  required: []
jobs:
  - name: main
    description: Classify and render the kanban board.
    steps:
      - name: classify
        description: Classify any unclassified thoughts in the inbox. Thoughts stay in the inbox.
        task:
          type: model_method
          modelType: "@svendowideit/ideas-factory"
          modelName: ideas-factory
          methodName: classifyThought
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: render
        description: Re-render the kanban board HTML.
        task:
          type: model_method
          modelType: "@svendowideit/ideas-factory"
          modelName: ideas-factory
          methodName: renderBoard
          inputs:
            path: ${{ inputs.boardPath }}
        dependsOn:
          - step: classify
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 2
