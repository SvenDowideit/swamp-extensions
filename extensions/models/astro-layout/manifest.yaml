manifestVersion: 1
name: '@svendowideit/astro-layout'
version: '2026.07.28.1'
description: >-
  Generates an Astro static site layout from markdown files with automatic page
  generation, layouts, and placeholder components for dynamic islands.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - astro_layout.ts

additionalFiles:
  - README.md
  - LICENSE.txt

# Non-allowlisted filenames (Dockerfile.serve, Makefile.serve) — exempt under binaries per swamp manifest spec.
binaries:
  - docker/Dockerfile.serve
  - docker/Makefile.serve
  - docker/resolve-serve-dir.sh

platforms: []