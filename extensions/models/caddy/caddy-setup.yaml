id: 6f3a1c2e-9b47-4d2e-8a51-0c9d2f4e7a10
name: '@svendowideit/caddy-setup'
description: |
  Set up the Caddy this repo manages, idempotently, in one command.

  Run it after `swamp extension pull @svendowideit/caddy` and `swamp model create
  @svendowideit/caddy <name> --global-arg baseDomain=… --global-arg
  letsEncryptEmail=…`. It reads the @svendowideit/caddy models this repo defines
  (so a never-run model is found and the auto-created scratch instance never is).
  Models with the same (target, serviceName) are additive peers for ONE Caddy and
  are set up together; models for different Caddy instances require
  `--input model=<name>`, and the run fails with the list otherwise.

  In order it: installs the binary (granting CAP_NET_BIND_SERVICE through
  @svendowideit/sudo), (re)creates and starts the systemd user service,
  configures TLS (the DNS provider is inferred from the model's plugins and its
  credential mapping from environmentFile, so --input dnsProvider is optional),
  applies any declared DNS records, installs the status page, and prints a gap
  report of anything still missing. Every step is idempotent — re-running is safe.

    swamp workflow run @svendowideit/caddy-setup
    swamp workflow run @svendowideit/caddy-setup --input model=my-caddy

  For a wildcard cert (DNS-01), name the provider explicitly if you prefer:
    swamp workflow run @svendowideit/caddy-setup --input model=my-caddy \
      --input dnsProvider=gandi \
      --input 'providerConfig:json={"bearer_token":"GANDI_BEARER_TOKEN"}'
inputs:
  properties:
    model:
      type: string
      default: ''
      description: |
        The @svendowideit/caddy model to set up. Empty (the default) uses the one Caddy the repo defines; several models for that same (target, serviceName) are additive peers and are set up together. Name one only when the repo has models for different Caddy instances.
    email:
      type: string
      default: ''
      description: |
        ACME email. Empty uses the model's letsEncryptEmail global.
    dnsProvider:
      type: string
      default: ''
      description: |
        DNS provider for DNS-01 (e.g. gandi, cloudflare). Empty infers it from the model's plugins.
    providerConfig:
      type: object
      default: {}
      description: |
        Provider credential field -> environment variable map, for multi-field providers, e.g. {"bearer_token":"GANDI_BEARER_TOKEN"}. Empty infers it from the model's environmentFile.
    subjects:
      type: array
      default: []
      description: |
        TLS subjects to issue certificates for (e.g. ["*.example.com"]). Empty keeps the subjects already configured.
  required: []
tags:
  swamp: caddy
  kind: setup
jobs:
- name: discover
  description: Find every @svendowideit/caddy model this repo defines, group the models that manage the same Caddy, and select one model to drive the setup. Several models for the same (target, serviceName) are additive and set up together; a repo with different Caddy instances and no model named fails with the list and the exact command.
  steps:
  - name: scan
    description: Discover and print the caddy model(s) in this repo.
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: caddy-setup-scan
      methodName: upgradeTargets
      inputs:
        model: ${{ inputs.model }}
        requireSingle: ${{ inputs.model == "" }}
      globalArgs:
        serviceName: caddy-setup-scan
        target: caddy-setup-scan
    dependsOn: []
    weight: 0
    allowFailure: false
  dependsOn: []
  weight: 0
- name: setup
  description: Install, service, TLS, DNS and status page for the selected model, in the order that works. Every step is idempotent and each depends on the previous, so nothing contends on the model lock; additive peer models for the same Caddy are merged by every method.
  steps:
  - name: install
    description: Download the Caddy binary (with the model's module packages). The capability is granted by the following step, never by the method.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: installCaddy
      inputs:
        setCapabilities: false
        configureStatusPage: false
        restart: false
    dependsOn: []
    weight: 0
    allowFailure: false
  - name: check-capability
    description: 'Read-only: report the raw host `sudo setcap` command that grants CAP_NET_BIND_SERVICE; the approval prompt repeats it exactly if the next step cannot elevate.'
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: setCapabilities
    dependsOn:
    - step: install
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: grant-capability
    description: 'Grant CAP_NET_BIND_SERVICE to the Caddy binary so the unprivileged systemd user service can bind 80/443. This is its own placed step that drives the @svendowideit/sudo model''s `run` method (operation `setcap`) with allowedOperations ["setcap"], NOT a context.runModel call inside installCaddy: runModel is unavailable under swamp worker remote execution, whereas a placed model step dispatches to the worker — so when this workflow runs on a worker the elevation happens on that same worker. Skipped when the capability is already on the binary. check-capability above prints the exact manual command if this step cannot elevate.'
    guard: '${{ (inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1) || data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")), "capability-command").?attributes.?applied.orValue(false) == true }}'
    task:
      type: model_method
      modelType: '@svendowideit/sudo'
      modelName: '${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")), "capability-command").?attributes.?sudoModel.orValue("") }}'
      methodName: run
      inputs:
        operation: setcap
        allowedOperations:
        - setcap
        requireSuccess: true
        args:
          path: '${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")), "capability-command").?attributes.?binPath.orValue("") }}'
          capabilities: cap_net_bind_service=+ep
    dependsOn:
    - step: check-capability
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: pause-if-capability-missing
    description: 'Interactive gate: the sudo grant failed, so CAP_NET_BIND_SERVICE is not host-usable on the binary. Pause, print the raw `sudo setcap` command and the reason from the failed grant step, and let the user run it and decide to resume or reject. Nothing has been changed on the running service yet.'
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: manual_approval
      prompt: |
        The sudo grant failed, so CAP_NET_BIND_SERVICE is not host-usable on the
        Caddy binary. Run this exact command on the host:

            sudo setcap cap_net_bind_service=+ep ${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")), "capability-command").?attributes.?binPath.orValue("<the Caddy binary path>") }}

        Then approve and resume. The failed grant step above shows the route and
        reason. Rejecting leaves the running service untouched. The workflow
        never moves Caddy to 8080/8443.
    dependsOn:
    - step: grant-capability
      condition:
        type: failed
    weight: 0
    allowFailure: false
  - name: retry-capability
    description: Hard re-check after the user has run the grant command. Fails with the exact command if the capability is still not applied, so the run cannot proceed into a service that cannot bind 80/443.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: setCapabilities
      inputs:
        require: true
    dependsOn:
    - step: pause-if-capability-missing
      condition:
        type: always
    weight: 0
    allowFailure: false
  - name: create-service
    description: Write the systemd user unit from the model's current globals.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: createService
    dependsOn:
    - step: retry-capability
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: start-service
    description: Start and enable the service, waiting for the admin API so the status page can be installed.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: startService
      inputs:
        configureStatusPage: false
    dependsOn:
    - step: create-service
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: restart
    description: Restart so the running process loads the freshly written unit (its EnvironmentFile) and, above all, the CAP_NET_BIND_SERVICE capability that installCaddy just set on the binary — a file capability only takes effect at exec() time, so without this Caddy keeps failing to bind 80/443 with "permission denied".
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: restartService
    dependsOn:
    - step: start-service
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: status-page
    description: 'Re-install the default status page and apply the desired server/routes. This is the config apply: if the running process cannot bind the configured ports, it fails here with the journal, the getcap state and the running-process diagnosis (CapEff, unit NoNewPrivileges/AmbientCapabilities/CapabilityBoundingSet, autosave).'
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: configureStatusPage
    dependsOn:
    - step: restart
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: verify-serving
    description: 'Read-only serving check after the restart: measures whether the running process is actually on 80/443, not the 8080/8443 fallback, and records every gap with its exact fix command. It never degrades the service.'
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: upgradeCheck
      inputs:
        requireServing: true
    dependsOn:
    - step: status-page
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: tls
    description: Configure the TLS app. The DNS provider is inferred from the model's plugins (and the credential mapping from environmentFile) unless passed explicitly.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: configureTls
      inputs:
        email: ${{ inputs.email }}
        dnsProvider: ${{ inputs.dnsProvider }}
        providerConfig: ${{ inputs.providerConfig }}
        subjects: ${{ inputs.subjects }}
    dependsOn:
    - step: verify-serving
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: dns
    description: Apply the model's declared static DNS records, through the provider configured above.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: applyDnsRecords
    dependsOn:
    - step: tls
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: check
    description: Print the gap report so the run ends by telling you exactly what is still missing (if anything) and how to fix it.
    guard: ${{ inputs.model == "" && data.latest("caddy-setup-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-setup-scan", "targets").?attributes.?upgradeModel.orValue(data.latest("caddy-setup-scan", "targets").?attributes.?firstModel.orValue("")) }}'
      methodName: upgradeCheck
    dependsOn:
    - step: dns
      condition:
        type: always
    weight: 0
    allowFailure: true
  dependsOn:
  - job: discover
    condition:
      type: succeeded
  weight: 0
version: 1
