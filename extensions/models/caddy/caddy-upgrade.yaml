id: 5add36ac-50d1-4042-b5c5-5af5e4820b8b
name: '@svendowideit/caddy-upgrade'
description: |
  Upgrade the Caddy managed by @svendowideit/caddy — with no model name to
  remember — and repair what it can automatically.

  Run it after updating the extension (`swamp extension update`). Caddy global
  arguments only take effect on the next method run, and a replaced binary drops
  its capability, so a version bump alone is not enough.

  It first discovers every @svendowideit/caddy model this repo defines (read from
  the model definitions on disk, so a never-run model is found and the
  auto-created scratch instance never is). Models with the same (target,
  serviceName) are additive peers for ONE Caddy — their routes, listen addresses
  and TLS settings are merged — so a repo with several such models is upgraded
  as one Caddy with no model name. Only when the models point at different
  Caddy instances does the run fail with the list and the exact
  `--input model=<name>` command; it never reports success after skipping the
  work:

    swamp workflow run @svendowideit/caddy-upgrade
    swamp workflow run @svendowideit/caddy-upgrade --input model=otel-caddy

  It then prints the configuration it found for that model (baseDomain, ACME
  email, TLS subjects, DNS provider, records) and a gap report: every setting
  that stops Caddy serving — the capability to bind 80/443, a baseDomain, an ACME
  email, TLS, a DNS provider and records, a stale binary, service health — each
  with the exact command to fix it. It then performs the repair automatically:
  rebuilds the binary if stale, re-grants CAP_NET_BIND_SERVICE through the placed
  @svendowideit/sudo step, recovers a stale autosave that replays the local-CA
  root-trust failure, regenerates the unit, restarts, and applies TLS/DNS. There
  is no approval gate and no manual recovery step for the default run. Every step
  runs in order (no parallel calls against one model), and is idempotent —
  re-running is safe.

  To (re)configure TLS as part of the same run, name the provider:
    swamp workflow run @svendowideit/caddy-upgrade \
      --input model=otel-caddy --input dnsProvider=gandi \
      --input 'providerConfig:json={"bearer_token":"GANDI_TOKEN"}'
inputs:
  properties:
    model:
      type: string
      default: ''
      description: |
        The @svendowideit/caddy model to upgrade. Leave empty (the default) to upgrade the one Caddy the repo defines; several models for that same (target, serviceName) are additive peers and are upgraded together. Only a repo with models for different Caddy instances needs this. The workflow fails with the list and the exact commands when a choice is required, instead of finishing without doing the work.
    dnsProvider:
      type: string
      default: ''
      description: |
        Optional DNS provider (e.g. gandi, cloudflare) to (re)configure TLS with after the upgrade. Empty leaves the existing TLS configuration alone.
    providerConfig:
      type: object
      default: {}
      description: |
        Optional provider credential field -> environment variable map, for multi-field providers, e.g. {"bearer_token":"GANDI_TOKEN"} for Gandi.
    force:
      type: boolean
      default: false
      description: |
        Force a fresh Caddy binary build even when all wanted modules are already present. Use this to pick up newer commits of bundled modules (for example caddy-host-dns) when the installed binary is stale.
  required: []
tags:
  swamp: caddy
  kind: upgrade
jobs:
- name: discover
  description: List every @svendowideit/caddy model this repo defines, group the models that manage the same Caddy, and select the one model that drives the upgrade. Models with the same (target, serviceName) are additive peers and are upgraded together; when the repo has several distinct Caddy instances and no model was named, this step fails with the list and the exact --input model=command instead of skipping the repair. Reads model definitions on disk, so it finds a model that has never been run and never mistakes the auto-created scratch instance for a real one.
  steps:
  - name: scan
    description: Discover and print the caddy model(s) in this repo.
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: caddy-upgrade-scan
      methodName: upgradeTargets
      inputs:
        model: ${{ inputs.model }}
        requireSingle: ${{ inputs.model == "" }}
      globalArgs:
        serviceName: caddy-upgrade-scan
        target: caddy-upgrade-scan
    dependsOn: []
    weight: 0
    allowFailure: false
  dependsOn: []
  weight: 0
- name: upgrade
  description: Report the configuration and gaps, then rebuild/re-unit/restart and re-report automatically. The steps target the representative model and run strictly in order (each depends on the previous), so nothing contends on the model lock; every method merges all models for the same Caddy, so additive peers are upgraded together.
  steps:
  - name: check-before
    description: Print the configuration found for this model and every gap that stops it serving — capability to bind 80/443, baseDomain, ACME email, TLS, DNS provider/records, stale binary, service health — each with the exact command to fix it.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: upgradeCheck
    dependsOn: []
    weight: 0
    allowFailure: false
  - name: install
    description: Migrate the model definition and (re)install the binary. Downloads a new build only when a wanted module is missing, and restarts a running service so it picks up the new build. The capability is granted by the following step, never by the method.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: installCaddy
      inputs:
        setCapabilities: false
        configureStatusPage: false
        restart: false
        force: ${{ inputs.force }}
    dependsOn:
    - step: check-before
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: check-capability
    description: 'Read-only: check the binary and print the exact @svendowideit/sudo command that grants CAP_NET_BIND_SERVICE immediately before the grant. If the grant step cannot elevate, this is the command to run by hand before resuming the run.'
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: setCapabilities
    dependsOn:
    - step: install
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: grant-capability
    description: 'Re-grant CAP_NET_BIND_SERVICE (a replaced binary drops it). Its own placed step driving the @svendowideit/sudo model''s `run` method (operation `setcap`) with the allowedOperations ["setcap"] method argument, never a context.runModel call inside installCaddy: runModel is unavailable under swamp worker remote execution, whereas a placed model step dispatches to the worker, so the elevation happens on the same worker the workflow runs on. Skipped when the capability is already on the binary. check-capability above prints the exact manual command if this step cannot elevate.'
    guard: '${{ (inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1) || data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").attributes.upgradeModel, "capability-command").?attributes.?applied.orValue(false) == true }}'
    task:
      type: model_method
      modelType: '@svendowideit/sudo'
      modelName: '${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").attributes.upgradeModel, "capability-command").attributes.sudoModel }}'
      methodName: run
      inputs:
        operation: setcap
        allowedOperations:
        - setcap
        requireSuccess: true
        args:
          path: '${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").attributes.upgradeModel, "capability-command").attributes.binPath }}'
          capabilities: cap_net_bind_service=+ep
    dependsOn:
    - step: check-capability
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: pause-if-capability-missing
    description: 'Interactive gate: the sudo grant failed, so CAP_NET_BIND_SERVICE is not proven on the binary. Pause, print the exact @svendowideit/sudo command and the reason from the failed grant step, and let the user run it and decide to resume or reject. Nothing has been changed on the running service yet.'
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: manual_approval
      prompt: |
        The sudo grant failed, so CAP_NET_BIND_SERVICE is not applied to the
        Caddy binary. The failed grant step above prints the exact route, why it
        failed, and the command to run (it starts with
        `swamp model @svendowideit/sudo method run ...`). Run it, then approve
        to re-check and continue. If you reject, the workflow stops without
        changing the running service. It will never move Caddy to 8080/8443.
    dependsOn:
    - step: grant-capability
      condition:
        type: failed
    weight: 0
    allowFailure: false
  - name: retry-capability
    description: Hard re-check after the user has run the grant command. Fails with the exact command if the capability is still not applied, so the run cannot proceed into a service that cannot bind 80/443.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: setCapabilities
      inputs:
        require: true
    dependsOn:
    - step: pause-if-capability-missing
      condition:
        type: always
    weight: 0
    allowFailure: false
  - name: normalize-serving
    description: Make the model's automatic-HTTPS / listen-address settings match what it wants (public HTTPS) and what this host can do (bind 80/443), correcting and persisting them — e.g. leaving the unprivileged high-port preset now that the binary can bind privileged ports. Skipped when there is nothing to correct. (grant-capability above already restored CAP_NET_BIND_SERVICE, so there is no separate setcap here.)
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: normalizeServingSettings
    dependsOn:
    - step: retry-capability
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: recreate-unit
    description: Regenerate the systemd unit from the model's current global args and reload the daemon.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: createService
    dependsOn:
    - step: normalize-serving
      condition:
        type: completed
    weight: 0
    allowFailure: false
  - name: restart
    description: Restart the Caddy service so it runs the upgraded unit.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: restartService
    dependsOn:
    - step: recreate-unit
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: status-page
    description: 'Re-install the default status page and apply the desired server/routes. This is the config apply: if the running process cannot bind the configured ports, it fails here with the journal, the getcap state and the running-process diagnosis (CapEff, unit NoNewPrivileges/AmbientCapabilities/CapabilityBoundingSet, autosave).'
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: configureStatusPage
    dependsOn:
    - step: restart
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: verify-serving
    description: 'Read-only serving check after the restart: measures whether the running process is actually on 80/443, not the 8080/8443 fallback, and records every gap with its exact fix command. It never degrades the service.'
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: upgradeCheck
      inputs:
        requireServing: true
    dependsOn:
    - step: status-page
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: tls
    description: (Re)configure the TLS app. The DNS provider is inferred from the model's plugins (and the credential mapping from its environmentFile), so passing --input dnsProvider is optional. Runs before the dns step so records are applied through a provider that is already configured. Tolerated when the model has no ACME email yet.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: configureTls
      inputs:
        dnsProvider: ${{ inputs.dnsProvider }}
        providerConfig: ${{ inputs.providerConfig }}
    dependsOn:
    - step: verify-serving
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: dns
    description: Reconcile desired static DNS records, if the model declares any. Runs after tls, so the provider is configured first. A model with no dnsRecords/dnsRemovals is a no-op, which the workflow tolerates.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: applyDnsRecords
    dependsOn:
    - step: tls
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: check-after
    description: Re-run the gap report so the run ends by telling you exactly what is still missing (if anything) and the command to fix each gap. A report, so it never fails the run.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?targetCount.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?upgradeModel.orValue("") }}'
      methodName: upgradeCheck
    dependsOn:
    - step: dns
      condition:
        type: always
    weight: 0
    allowFailure: true
  dependsOn:
  - job: discover
    condition:
      type: succeeded
  weight: 0
version: 1
