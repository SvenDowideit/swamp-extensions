id: 5add36ac-50d1-4042-b5c5-5af5e4820b8b
name: '@svendowideit/caddy-upgrade'
description: "Upgrade the Caddy managed by @svendowideit/caddy \u2014 with no model name to\nremember \u2014 and tell you exactly what is still missing.\n\nRun it after updating the extension (`swamp extension update`). Caddy global\narguments only take effect on the next method run, and a replaced binary drops\nits capability, so a version bump alone is not enough.\n\nIt first discovers every @svendowideit/caddy model this repo defines (read from\nthe model definitions on disk, so a never-run model is found and the\nauto-created scratch instance never is). If the repo defines exactly one model\nit is upgraded automatically. If it defines more than one, the run lists them\n(with the exact command to upgrade each) and finishes without changing\nanything \u2014 then run the one you want:\n\n  swamp workflow run @svendowideit/caddy-upgrade\n  swamp workflow run @svendowideit/caddy-upgrade --input model=otel-caddy\n\nIt then prints the configuration it found for that model (baseDomain, ACME\n\
  email, TLS subjects, DNS provider, records) and a gap report: every setting\nthat stops Caddy serving \u2014 the capability to bind 80/443, a baseDomain, an ACME\nemail, TLS, a DNS provider and records, a stale binary, service health \u2014 each\nwith the exact command to fix it. Confirm the configuration is right (run any\ncorrection command first), then approve; it rebuilds the binary if stale,\nre-grants the capability, regenerates the unit, and restarts, then re-runs the\ngap report so you can see what is left. Every step runs in order (no parallel\ncalls against one model), and is idempotent \u2014 re-running is safe.\n\n  # The run suspends at the gate; approve and resume:\n  swamp workflow approvals\n  swamp workflow approve @svendowideit/caddy-upgrade confirm\n  swamp workflow resume @svendowideit/caddy-upgrade\n\nTo (re)configure TLS as part of the same run, name the provider:\n  swamp workflow run @svendowideit/caddy-upgrade \\\n    --input model=otel-caddy --input dnsProvider=gandi\
  \ \\\n    --input 'providerConfig:json={\"bearer_token\":\"GANDI_TOKEN\"}'\n"
inputs:
  properties:
    model:
      type: string
      default: ''
      description: 'The @svendowideit/caddy model to upgrade. Leave empty (the default) to auto-upgrade the single model the repo defines, or to list the models (changing nothing) when there is more than one.

        '
    dnsProvider:
      type: string
      default: ''
      description: 'Optional DNS provider (e.g. gandi, cloudflare) to (re)configure TLS with after the upgrade. Empty leaves the existing TLS configuration alone.

        '
    providerConfig:
      type: object
      default: {}
      description: 'Optional provider credential field -> environment variable map, for multi-field providers, e.g. {"bearer_token":"GANDI_TOKEN"} for Gandi.

        '
    force:
      type: boolean
      default: false
      description: 'Force a fresh Caddy binary build even when all wanted modules are already present. Use this to pick up newer commits of bundled modules (for example caddy-host-dns) when the installed binary is stale.

        '
  required: []
tags:
  swamp: caddy
  kind: upgrade
jobs:
- name: discover
  description: List every @svendowideit/caddy model this repo defines, with the settings and staleness that matter for an upgrade, and the exact command to upgrade each one. Reads model definitions on disk, so it finds a model that has never been run and never mistakes the auto-created scratch instance for a real one.
  steps:
  - name: scan
    description: Discover and print the caddy model(s) in this repo.
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: caddy-upgrade-scan
      methodName: upgradeTargets
      globalArgs:
        serviceName: caddy-upgrade-scan
        target: caddy-upgrade-scan
    dependsOn: []
    weight: 0
    allowFailure: false
  dependsOn: []
  weight: 0
- name: upgrade
  description: Report the configuration and gaps, confirm, then rebuild/re-unit/restart and re-report. Every step targets one model and runs strictly in order (each depends on the previous), so nothing contends on the model lock.
  steps:
  - name: check-before
    description: "Print the configuration found for this model and every gap that stops it serving \u2014 capability to bind 80/443, baseDomain, ACME email, TLS, DNS provider/records, stale binary, service health \u2014 each with the exact command to fix it."
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: upgradeCheck
    dependsOn: []
    weight: 0
    allowFailure: false
  - name: confirm
    description: 'Interactive gate: the configuration and gap report are printed above. If they are correct, approve; if not, run the correction command shown in the report first, then approve. Skipped entirely when the single target model is already up to date (nothing to do).'
    guard: ${{ inputs.model == "" && (data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 || data.latest("caddy-upgrade-scan", "targets").?attributes.?models[0].?upToDate.orValue(false)) }}
    task:
      type: manual_approval
      prompt: The configuration for this model, and the command to change each setting, are printed above. If it is all correct, approve to continue. Otherwise run the relevant command above, then approve. Approving rebuilds the binary if its modules are stale, re-grants CAP_NET_BIND_SERVICE, regenerates the systemd unit, and restarts Caddy. If this model uses a DNS provider, make sure its token is in the model's environmentFile before approving.
    dependsOn:
    - step: check-before
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: install
    description: Migrate the model definition and (re)install the binary. Downloads a new build only when a wanted module is missing, and restarts a running service so it picks up the new build. The capability is granted by the following step, never by the method.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: installCaddy
      inputs:
        setCapabilities: false
        configureStatusPage: false
        force: ${{ inputs.force }}
    dependsOn:
    - step: confirm
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: check-capability
    description: 'Read-only: check the binary and print the exact @svendowideit/sudo command that grants CAP_NET_BIND_SERVICE immediately before the grant. If the grant step cannot elevate, this is the command to run by hand before resuming the run.'
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: setCapabilities
    dependsOn:
    - step: install
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: grant-capability
    description: 'Re-grant CAP_NET_BIND_SERVICE (a replaced binary drops it). Its own placed step driving the @svendowideit/sudo model''s `run` method (operation `setcap`) with the allowedOperations ["setcap"] method argument, never a context.runModel call inside installCaddy: runModel is unavailable under swamp worker remote execution, whereas a placed model step dispatches to the worker, so the elevation happens on the same worker the workflow runs on. check-capability above prints the exact manual command if this step cannot elevate.'
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/sudo'
      modelName: '${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").attributes.firstModel, "capability-command").attributes.sudoModel }}'
      methodName: run
      inputs:
        operation: setcap
        allowedOperations:
        - setcap
        args:
          path: '${{ data.latest(inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").attributes.firstModel, "capability-command").attributes.binPath }}'
          capabilities: cap_net_bind_service=+ep
    dependsOn:
    - step: check-capability
      condition:
        type: completed
    weight: 0
    allowFailure: false
  - name: normalize-serving
    description: "Make the model's automatic-HTTPS / listen-address settings match what it wants (public HTTPS) and what this host can do (bind 80/443), correcting and persisting them \u2014 e.g. leaving the unprivileged high-port preset now that the binary can bind privileged ports. Skipped when there is nothing to correct. (grant-capability above already restored CAP_NET_BIND_SERVICE, so there is no separate setcap here.)"
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: normalizeServingSettings
    dependsOn:
    - step: grant-capability
      condition:
        type: completed
    weight: 0
    allowFailure: false
  - name: recreate-unit
    description: Regenerate the systemd unit from the model's current global args and reload the daemon.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: createService
    dependsOn:
    - step: normalize-serving
      condition:
        type: completed
    weight: 0
    allowFailure: false
  - name: restart
    description: Restart the Caddy service so it runs the upgraded unit.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: restartService
    dependsOn:
    - step: recreate-unit
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: status-page
    description: Re-install the default status page. Does not fail the workflow if the admin API is not yet reachable.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: configureStatusPage
    dependsOn:
    - step: restart
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: tls
    description: (Re)configure the TLS app. The DNS provider is inferred from the model's plugins (and the credential mapping from its environmentFile), so passing --input dnsProvider is optional. Runs before the dns step so records are applied through a provider that is already configured. Tolerated when the model has no ACME email yet.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: configureTls
      inputs:
        dnsProvider: ${{ inputs.dnsProvider }}
        providerConfig: ${{ inputs.providerConfig }}
    dependsOn:
    - step: status-page
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: dns
    description: Reconcile desired static DNS records, if the model declares any. Runs after tls, so the provider is configured first. A model with no dnsRecords/dnsRemovals is a no-op, which the workflow tolerates.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: applyDnsRecords
    dependsOn:
    - step: tls
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: check-after
    description: Re-run the gap report so the run ends by telling you exactly what is still missing (if anything) and the command to fix each gap. A report, so it never fails the run.
    guard: ${{ inputs.model == "" && data.latest("caddy-upgrade-scan", "targets").?attributes.?count.orValue(0) != 1 }}
    task:
      type: model_method
      modelType: '@svendowideit/caddy'
      modelName: '${{ inputs.model != "" ? inputs.model : data.latest("caddy-upgrade-scan", "targets").?attributes.?firstModel.orValue("") }}'
      methodName: upgradeCheck
    dependsOn:
    - step: dns
      condition:
        type: always
    weight: 0
    allowFailure: true
  dependsOn:
  - job: discover
    condition:
      type: succeeded
  weight: 0
version: 1
