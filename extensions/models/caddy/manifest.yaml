manifestVersion: 1
name: "@svendowideit/caddy"
version: "2026.10.08.1"
description: >
  Caddy reverse-proxy and service management for a Linux host with systemd.

  WHAT IT DOES

    Manages a Caddy reverse proxy on a Linux host with systemd — install the
    binary, run it as a systemd user service, and drive routes, static file
    serving, and TLS live through Caddy's admin API. Prefer it over hand-editing
    a Caddyfile or a Go Caddy plugin when you want routes added and removed
    without a restart and managed from swamp; no Go toolchain is needed. Adding
    a route implies the DNS and TLS it needs: every route hostname under
    baseDomain automatically gains a TLS subject and an A record, so a single
    ensureDnsProxy makes a host reachable without hand-listing subjects or
    records. It can also publish a settings/document directory over HTTP(S) with
    file_server, issue wildcard certificates through DNS-challenge providers
    (including multi-field ones like Gandi, Namecheap, and DreamHost), manage
    static A/AAAA/CNAME records through any dns.providers module, and serve a
    default health contract (/, /teapot) on each configured hostname.

    It runs unprivileged (plain HTTP on high ports) or as a Let's Encrypt TLS
    proxy on 80/443, and routes persist across restarts via autosave + --resume.

  INSTALL

      swamp extension pull @svendowideit/caddy

  DEPENDENCIES

    None. It needs only the swamp CLI, a Linux host with systemd user services,
    and network access to caddyserver.com to download the binary.

  RUN

      # Create the model, choosing your public domain and ACME contact address.
      swamp model create @svendowideit/caddy my-caddy \
        --global-arg baseDomain=example.com \
        --global-arg letsEncryptEmail=admin@example.com

      # Download the Caddy binary to caddyBinPath (run once per host).
      swamp model method run my-caddy installCaddy

      # Write and start the systemd user service (run once, or after an upgrade).
      swamp model method run my-caddy createService
      swamp model method run my-caddy startService

      # Do the whole setup idempotently in one command.
      swamp workflow run caddy-setup

      # Point a hostname at a backend, creating the route if it is missing.
      swamp workflow run caddy-ensure-proxy \
        --input hostname=foo.example.com --input upstream=127.0.0.1:8080

      # Publish a directory of documents over HTTPS at a hostname.
      swamp model method run my-caddy serveSettings \
        --input hostname=settings.example.com --input root=/srv/settings/current

      # Grant CAP_NET_BIND_SERVICE so the unprivileged user service can bind
      # 80/443. If sudo is unavailable this prints the exact `sudo setcap`
      # command to run by hand (also tried automatically during installCaddy).
      swamp model method run my-caddy setCapabilities

      # Install the default status page that answers on http://localhost and
      # https://localhost (done automatically by installCaddy/startService).
      swamp model method run my-caddy configureStatusPage

      # Inspect EVERYTHING in one command: it finds all caddy models, groups
      # them by the Caddy they manage, merges what each wants, reads each live
      # config, and prints a table with drift. No model names needed; the
      # trailing name is a scratch instance it auto-creates. Read-only.
      swamp model method run @svendowideit/caddy audit caddy-status
      swamp data get caddy-status audit --json | jq '.content.cadies[] | {target, models, desiredRoutes, onlyDesired, onlyActual, inSync}'

      # To diff the whole desired config against the live config for one Caddy:
      swamp model method run @svendowideit/caddy plan caddy-status
      swamp data get caddy-status plan --json | jq '.content | {desiredConfig, actualConfig}'

      # --- Wildcard certificate via DNS-01 (worked example: Gandi) ---
      # A wildcard cert (*.example.com) cannot use the HTTP-01 challenge: Caddy
      # must write a _acme-challenge TXT record through the provider's API. That
      # needs TWO things set up BEFORE configureTls, or it silently fails:
      #   (a) the provider driver compiled into the binary, via `plugins`; and
      #   (b) its token in the service's environment, via `environmentFile`.
      #
      # 1. Create the model with the Gandi driver and an env file for the token.
      swamp model create @svendowideit/caddy my-caddy \
        --global-arg baseDomain=example.com \
        --global-arg letsEncryptEmail=admin@example.com \
        --global-arg 'plugins:json=["github.com/caddy-dns/gandi"]' \
        --global-arg environmentFile=~/.config/caddy/dns.env
      #
      # 2. Install the binary, put your Gandi Personal Access Token in the env
      #    file (field name for Gandi is bearer_token), then create the service
      #    so the unit loads it. Gandi's old API key is NOT supported.
      swamp model method run my-caddy installCaddy
      printf 'GANDI_BEARER_TOKEN=YOUR_GANDI_PAT\n' > ~/.config/caddy/dns.env
      chmod 600 ~/.config/caddy/dns.env
      swamp model method run my-caddy createService   # renders EnvironmentFile=
      swamp model method run my-caddy startService
      #
      # 3. Configure the ACME DNS-01 challenge: map the driver's credential
      #    field to the env var name, and list the wildcard + apex subjects.
      swamp model method run my-caddy configureTls \
        --input dnsProvider=gandi \
        --input 'providerConfig:json={"bearer_token":"GANDI_BEARER_TOKEN"}' \
        --input 'subjects:json=["*.example.com","example.com"]'
      #
      # 4. Verify: point a route under the wildcard at a backend and request it;
      #    a valid cert means the DNS-01 challenge succeeded.
      swamp model method run my-caddy ensureDnsProxy \
        --input hostname=app.example.com --input upstream=127.0.0.1:8080
      #
      # Serve an app that lives under a sub-path (e.g. /dashboard) at the
      # hostname root: only "/" is rewritten, so /dashboard/assets/... still
      # reaches the app.
      swamp model method run my-caddy ensureDnsProxy \
        --input hostname=dashboard.example.com \
        --input upstream=127.0.0.1:9090 --input rootPath=/dashboard
      #
      # See the README's "Wildcard certificates with a DNS provider (step by
      # step)" section for the full walkthrough and troubleshooting.

      # --- Static A/AAAA/CNAME records (same provider as TLS) ---
      # Caddy owns the (name, type) RRset: each reconcile replaces it with
      # exactly the declared values. The provider block reuses configureTls's
      # provider + credential, so one token in the env file covers both DNS-01
      # and record-writing. Records are declared as a global arg.
      swamp model create @svendowideit/caddy dns-caddy \
        --global-arg baseDomain=example.com \
        --global-arg 'plugins:json=["github.com/caddy-dns/gandi"]' \
        --global-arg environmentFile=~/.config/caddy/dns.env \
        --global-arg 'dnsRecords:json=[{"name":"otel.example.com","type":"A","value":["192.0.2.5"],"zone":"example.com"}]'
      swamp model method run dns-caddy configureTls \
        --input dnsProvider=gandi \
        --input 'providerConfig:json={"bearer_token":"GANDI_TOKEN"}'
      swamp model method run dns-caddy installCaddy   # compiles caddy-host-dns in
      # Apply the records as its own step — re-run after any dnsRecords edit:
      swamp model method run dns-caddy applyDnsRecords
      #
      # zone is required unless the provider implements libdns.ZoneLister
      # (Gandi does not); set it to the registered zone, e.g. fi.gy.
      # To delete a record, declare it under dnsRemovals (dropping it from
      # dnsRecords leaves it in DNS), then run applyDnsRecords.

      # --- Health contract (default on) ---
      # On each status/default hostname Caddy answers '/' -> 200 (status page),
      # '/teapot' -> 418, and any other path -> 404. Verify after a reconcile:
      curl -s -o /dev/null -w '%{http_code}\n' http://localhost/           # 200
      curl -s -o /dev/null -w '%{http_code}\n' http://localhost/teapot     # 418
      curl -s -o /dev/null -w '%{http_code}\n' http://localhost/nope       # 404
      # Set healthRoutes=false to omit it.

  MANAGING THE MODEL

    Find the model(s):  swamp model list --json | jq -r '.results[] |
      select(.type=="@svendowideit/caddy") | .name'
    Inspect one:        swamp model get <name> --json | jq '.globalArguments'
    A model is "active" because YOU name it on the command; its serviceName
    (default "caddy") is the systemd unit and adminApiAddr (localhost:2019) is
    the running Caddy's admin API. The status page names the model that last
    configured it.

    Change it:          swamp model create fails on an existing name by design.
      Edit instead, non-interactively, by piping the full definition to stdin:
        swamp model get <name> --json | jq '{name,version,tags,globalArguments}
          | .globalArguments.baseDomain="new.example.com"'
          | swamp model edit <name> --json
      Global args only take effect on the NEXT method run: re-run what consumes
      the arg (plugins -> installCaddy; listenAddrs/autoHttps/environmentFile ->
      createService + restartService; baseDomain -> configureTls etc.).

    Multiple models: fully supported — several models that manage the SAME Caddy
      are MERGED, not fought over. Each mutating method records what that model
      wants (a `desired` resource), then reconcile unions every model whose
      (target, serviceName) matches into one valid config and applies it. Routes
      union; listenAddrs and TLS subjects union; a real conflict (two different
      upstreams for the same hostname, or differing TLS email/provider) is
      reported naming the models rather than silently resolved. swamp-managed
      routes are tagged with a Caddy @id, so hand-added routes are preserved.
      A model only manages a SEPARATE Caddy when it has a different serviceName
      (e.g. a second instance on other ports) — set target= for another host.
      target defaults to this machine's hostname; reconcile defaults to true.

  CONFIGURE

    All arguments are optional and set as global args when creating/editing the
    model:

      baseDomain         Base domain for derived hostnames
      letsEncryptEmail   ACME email (enables automatic HTTPS)
      autoHttps          on|off|disable_redirects|disable_certs|...
      listenAddrs        HTTP listen addresses (default [":443",":80"])
      plugins            Extra Caddy modules to compile in (caddy-host-dns and
                         caddy-teapot-module are always added)
      dnsRecords         Static records to own, e.g.
                         [{"name":"otel.example.com","type":"A","value":["192.0.2.5"],"zone":"example.com"}]
                         (type A|AAAA|CNAME; optional ttl). zone is required
                         unless the provider implements libdns.ZoneLister
                         (Gandi does not). Needs tls's dnsProvider set; apply
                         with `applyDnsRecords`.
      dnsRemovals        Records to delete each reconcile, e.g.
                         [{"name":"old.example.com","type":"A","zone":"example.com"}]
                         (empty value removes the whole name+type RRset);
                         apply with `applyDnsRecords`
      dnsTtl             Default TTL for dnsRecords (default 5m) so changes
                         propagate quickly; a record's own ttl overrides it
      healthRoutes       true (default): on status/default hostnames serve
                         '/' -> 200, '/teapot' -> 418, other -> 404
      adminApiAddr       Admin API address (or unix//path)
      vaultName          Vault used by storeConfig
      environmentFile    systemd EnvironmentFile for DNS-provider tokens
                         (e.g. ~/.config/caddy/dns.env); createService renders
                         EnvironmentFile=-<path> so wildcard/DNS-01 works without
                         hand-editing the unit
      target             Host this model's Caddy runs on (default: this machine).
                         With serviceName it identifies the Caddy; models sharing
                         (target, serviceName) merge. Set it for a remote/worker
                         host or to keep a second instance separate.
      reconcile          true (default) merges all models for this target; false
                         writes only this model's config

    Ports 80/443 need CAP_NET_BIND_SERVICE on the binary: installCaddy tries to
    grant it (setCapabilities=false to skip), setCapabilities can (re)apply it
    or print the sudo command, and upgradeCaddy reapplies it after replacing the
    binary.

    A default status page is installed automatically (installCaddy/startService)
    answering http://localhost and https://localhost, listing the install
    (version, domain, ACME email, privileged-port capability, and the compiled-in
    plugins) and linking to the admin API and routes; reconfigure or remove it
    with configureStatusPage.

    Override per call with --input, e.g. addProxyService --input serviceName=app
    --input upstream=127.0.0.1:8080, or configureTls --input
    dnsProvider=cloudflare --input 'subjects:json=["*.example.com"]'. For
    multi-field DNS providers pass a providerConfig map of credential field to
    environment variable, e.g. Gandi '{"bearer_token":"GANDI_TOKEN"}',
    Namecheap '{"api_key":"NC_KEY","user":"NC_USER"}', DreamHost
    '{"api_key":"DH_KEY"}' — but a DNS provider only works if its driver is in
    `plugins` AND its token is in the service environment (`environmentFile`);
    see the RUN wildcard example and the README's step-by-step section.

  WHAT IT INSTALLS

    A Caddy binary at caddyBinPath (default ~/.local/bin/caddy) — optionally
    with CAP_NET_BIND_SERVICE set so it can bind 80/443 unprivileged, and always
    including github.com/SvenDowideit/caddy-host-dns and
    github.com/hairyhenderson/caddy-teapot-module — a systemd
    *user* service (default caddy.service), a Caddyfile under ~/.config/caddy,
    and network-facing reverse-proxy and file_server routes — plus a default
    status page and health contract (/, /teapot) — via Caddy's admin API. It
    installs no cron triggers
    or webhooks.

repository: https://github.com/svendowideit/swamp-extensions

