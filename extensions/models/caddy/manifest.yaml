paths:
  base: manifest

models:
  - caddy.ts

reports:
  - caddy_report.ts

additionalFiles:
  - README.md
  - LICENSE.txt
  - caddy_test.ts
  - caddy_report_test.ts
  - test-factory.yaml
  - test/bind/Dockerfile.txt
  - test/bind/named.conf.txt
  - test/bind/db.example.com.txt
  - test/bind/tsig.key.txt

platforms:
  - linux-x86_64
  - linux-aarch64
