            --global-arg serviceName=caddy \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0 }
      - name: install-binary
        run: >
          swamp model method run e2e-wf-sudo installCaddy
          --input setCapabilities=false --input configureStatusPage=false
        expect: { exitCode: 0 }
        timeoutSeconds: 300
      - name: remove-any-existing-capability
        run: sudo -n setcap -r "$HOME/.local/bin/caddy" 2>/dev/null || true
        expect: { exitCode: 0 }
      - name: remove-stale-autosave
        run: rm -f "$HOME/.config/caddy/autosave.json"
        expect: { exitCode: 0 }
      - name: run-upgrade
        run: swamp workflow run @svendowideit/caddy-upgrade --input model=e2e-wf-sudo
        expect:
          exitCode: 0
          outputContains:
            - "Ran 'setcap' via"
            - "verified=true"
          outputNotContains:
            - "Suspended workflow"
            - "listening on :8080"
            - "listening on :8443"
        timeoutSeconds: 300
      - name: sudo-result-is-verified-success
        run: |
          swamp data query 'modelName == "sudo-default" && specName == "result"' --json \
            | jq -e '.results[0].content.outcome == "succeeded" and .results[0].content.verified == true'
        expect: { exitCode: 0 }
      - name: getcap-proves-the-effect
        run: getcap "$HOME/.local/bin/caddy"
        expect: { stdoutContains: ["cap_net_bind_service"] }
      - name: cleanup
        run: swamp model delete e2e-wf-sudo --yes --force
        expect: { exitCode: 0 }

  - name: elevation-sudo-grants-capability-and-binds-443
    confirms: >
      With a passwordless-`sudo` grant and a non-root harness, installCaddy grants
      CAP_NET_BIND_SERVICE through @svendowideit/sudo (the `sudo-n` route), the
      restarted service binds :443, and Caddy serves the status page over TLS on
      localhost.
    cannot: >
      must not leave the service without the capability, must not serve on a high
      port (:8443), and must not return anything but 200 from the TLS status page.
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: sudo-nopasswd }
    steps:
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-sudo \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: passwordless-sudo-is-available
        run: sh -c 'if sudo -n true 2>/dev/null; then echo sudo-works; else echo sudo-blocked; fi'
        expect: { stdoutContains: ["sudo-works"] }
      - name: install-caddy-binary
        run: swamp model method run e2e-sudo installCaddy
        expect: { exitCode: 0, outputNotContains: ["panic"] }
        timeoutSeconds: 300
      - name: grant-capability
        run: |
          swamp model @svendowideit/sudo method run run sudo-default \
            --input operation=setcap \
            --input 'allowedOperations:json=["setcap"]' \
            --input 'args:json={"path":"'"$HOME"'/.local/bin/caddy","capabilities":"cap_net_bind_service=+ep"}'
        expect:
          exitCode: 0
          outputNotContains: ["not allowed", "No granted elevation route", "panic"]
      - name: create-and-start-service
        run: |
          swamp model method run e2e-sudo createService
          swamp model method run e2e-sudo startService
        expect: { exitCode: 0, outputNotContains: ["is not active", "panic"] }
      - name: binary-has-the-capability
        run: getcap "$HOME/.local/bin/caddy"
        expect: { stdoutContains: ["cap_net_bind_service"] }
      - name: live-config-binds-443
        run: curl -s http://localhost:2019/config/ | jq -c '[.apps.http.servers[].listen[]]'
        expect: { stdoutContains: [":443"], stdoutNotContains: [":8443"] }
      - name: status-page-served-over-tls
        run: curl -sk -o /dev/null -w '%{http_code}' https://localhost/
        expect: { stdoutContains: ["200"], stdoutNotContains: ["000"] }

