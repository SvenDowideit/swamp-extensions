          outputNotContains: ["panic"]
      - name: rejected-model-is-named
        run: |
          swamp model method run e2e-caddy plan >/dev/null
          swamp data get e2e-caddy plan --json | jq -r '[.content.rejected[].model] | join(",")'
        expect:
          stdoutContains: ["bad-4"]
      - name: rejected-model-is-not-merged
        run: |
          swamp data get e2e-caddy plan --json | jq -r '[.content.models[]] | join(",")'
        expect:
          stdoutContains: ["e2e-caddy"]
