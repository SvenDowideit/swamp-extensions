        expect: { exitCode: 0 }

  - name: upgrade-workflow-uses-sudo-when-capability-is-missing
    confirms: >
      With no file capability, caddy-upgrade invokes the sudo extension with
      requireSuccess=true, the sudo extension verifies getcap, the result is
      succeeded/verified, and the workflow completes on 80/443.
    cannot: >
      must not skip the sudo grant when the capability is absent, must not
      report success if the sudo effect was not verified, and must not end on
      the 8080/8443 fallback.
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: sudo-nopasswd }
    steps:
