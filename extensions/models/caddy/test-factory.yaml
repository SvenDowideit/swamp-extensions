# Acceptance tests for @svendowideit/caddy — the black-box, containerised
# system the README's "Static DNS records" example promises.
#
# A two-part container topology mirrors the module's own e2e suite:
#   - bind   : authoritative BIND for example.com, accepting RFC2136 dynamic
#              updates over TSIG (the key Caddy's rfc2136 provider writes with)
#   - harness: the swamp container, joined to two networks so it has two IP
#              endpoints; this is where every step runs (Caddy is installed and
#              run here as a systemd *user* service)
#
# The tests are an ordered narrative that builds one running Caddy and then
# exercises it: install + service + health contract, write A records into BIND,
# then prune/change/remove those records. `dig` (from the swamp container to
# BIND) proves the records Caddy wrote; `curl --resolve` proves each name is
# served from the endpoint(s) its records point to.
#
# Run it on a systemd host (the caddy model drives a systemd user service):
#   swamp model @svendowideit/test-factory method run test tf \
#     --input manifest=extensions/models/caddy/manifest.yaml \
#     --input scenario=ubuntu-systemd-standalone
#
# Network access: the swamp release download plus https://caddyserver.com (the
# Caddy binary is downloaded with the rfc2136 provider compiled in).

networks:
  net1:
    subnet: 192.0.2.0/24
  net2:
    subnet: 198.51.100.0/24

harness:
  dig: true
  networks:
    net1:
      ipv4_address: 192.0.2.10
    net2:
      ipv4_address: 198.51.100.10

services:
  bind:
    build: ./test/bind
    dockerfile: Dockerfile.txt
    networks:
      net1:
        ipv4_address: 192.0.2.11
    healthcheck:
      command:
        ["dig", "+short", "+time=1", "+tries=1", "@127.0.0.1", "example.com", "SOA"]
      intervalSeconds: 1
      retries: 30

# The elevation tests below drive @svendowideit/sudo (caddy's installCaddy calls
# its model to run setcap), so register that sibling extension in the harness.
extensions:
  sudo: extensions/models/sudo

# Boundary negative control (plan §16.1/§16.7). The positive tests below serve
# Caddy's health contract on :80 *inside* the harness container (proved by
# `curl` from within); this proves the harness container publishes **no** port
# to the dev host, so the listener is reachable only on the scenario network.
isolation:
  - name: caddy-listener-is-not-published-to-the-host
    confirms: >
      Caddy serves its health contract inside the harness container but the
      container publishes no port bindings: the listener is reachable only from
      the test-factory network, never on the dev host.
    cannot: >
      must not publish the harness container's port to the host, so the host must
      not gain a listener for this run.
    documents: README.md#examples
    noPublishedPorts: ["harness"]

tests:
  - name: installs-binary-service-and-health-contract
    confirms: >
      @svendowideit/caddy downloads the Caddy binary with the rfc2136 DNS
      provider compiled in, writes and starts a systemd *user* service, brings
      up its admin API, and serves the default health contract on each
      configured hostname — `/` -> 200, `/teapot` -> 418, other -> 404 — from
      the addresses its DNS records point to.
    cannot: >
      must not leave the service inactive or the admin API unreachable, and must
      not answer `/`, `/teapot` or an unknown path with any code other than
      200, 418 and 404 respectively.
    documents: README.md#examples
    steps:
      - name: systemd-user-manager-is-running
        run: systemctl --user is-system-running
        expect:
          stdoutContains: ["running"]
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-caddy \
            --global-arg autoHttps=off \
            --global-arg 'listenAddrs:json=[":80"]' \
            --global-arg 'plugins:json=["github.com/caddy-dns/rfc2136"]' \
            --global-arg environmentFile=/root/.config/caddy/dns.env \
            --global-arg baseDomain=example.com
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: install-caddy-binary
        run: >
          swamp model method run e2e-caddy installCaddy
          --input setCapabilities=false --input configureStatusPage=false
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
        timeoutSeconds: 300
      - name: write-dns-provider-credentials
        run: |
          mkdir -p /root/.config/caddy
          printf 'TSIG_KEY_NAME=e2e-key\nTSIG_KEY=cWnu6Ju9zOki4f7Q+da2KKGo0KOXbCf6Pej6hW3geC4=\nTSIG_KEY_ALG=hmac-sha256\nTSIG_SERVER=bind:53\n' > /root/.config/caddy/dns.env
        expect:
          fileExists: ["/root/.config/caddy/dns.env"]
      - name: create-service
        run: swamp model method run e2e-caddy createService
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: start-service
        run: swamp model method run e2e-caddy startService
        expect:
          exitCode: 0
          outputNotContains: ["is not active", "panic"]
      - name: install-status-page
        run: swamp model method run e2e-caddy configureStatusPage
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: configure-provider-and-health-hostnames
        run: |
          swamp model method run e2e-caddy configureTls \
            --input dnsProvider=rfc2136 \
            --input email=admin@example.com \
            --input 'providerConfig:json={"key_name":"TSIG_KEY_NAME","key":"TSIG_KEY","key_alg":"TSIG_KEY_ALG","server":"TSIG_SERVER"}' \
            --input 'subjects:json=["alpha.example.com","beta.example.com","gamma.example.com"]'
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: health-root-is-200
        run: >
          curl -s -o /dev/null -w '%{http_code}'
          --resolve alpha.example.com:80:$TF_HARNESS_IP_NET1
          http://alpha.example.com/
        expect:
          stdoutContains: ["200"]
          stdoutNotContains: ["000"]
      - name: health-teapot-is-418
        run: >
          curl -s -o /dev/null -w '%{http_code}'
          --resolve alpha.example.com:80:$TF_HARNESS_IP_NET1
          http://alpha.example.com/teapot
        expect:
          stdoutContains: ["418"]
      - name: health-unknown-path-is-404
        run: >
          curl -s -o /dev/null -w '%{http_code}'
          --resolve alpha.example.com:80:$TF_HARNESS_IP_NET1
          http://alpha.example.com/nope
        expect:
          stdoutContains: ["404"]
          stdoutNotContains: ["200"]

  - name: writes-a-records-into-authoritative-dns
    confirms: >
      Declaring dnsRecords and running applyDnsRecords makes Caddy write them
      into the authoritative BIND server through the rfc2136 provider: alpha
      resolves to both Caddy endpoints (proving a single name can serve from
      more than one address), beta to the first endpoint only, and gamma to the
      second only.
    cannot: >
      must not leave any of the three names unresolved, and must not resolve
      beta or gamma to an address their records do not declare.
    documents: README.md#configuration
    variables:
      DNS_SERVER: bind
    steps:
      - name: declare-dns-records
        run: |
          swamp model get e2e-caddy --json \
            | jq '.globalArguments.dnsRecords=[{"name":"alpha.example.com","type":"A","value":["192.0.2.10","198.51.100.10"],"zone":"example.com"},{"name":"beta.example.com","type":"A","value":["192.0.2.10"],"zone":"example.com"},{"name":"gamma.example.com","type":"A","value":["198.51.100.10"],"zone":"example.com"}] | {name,version,tags,globalArguments}' \
            | swamp model edit e2e-caddy --json
        expect:
          exitCode: 0
      - name: apply-dns-records
        run: swamp model method run e2e-caddy applyDnsRecords
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: alpha-resolves-to-both-endpoints
        run: dig +short @$DNS_SERVER alpha.example.com A | sort | tr '\n' ' '
        expect:
          stdoutContains: ["192.0.2.10 198.51.100.10"]
      - name: beta-resolves-to-first-endpoint-only
        run: dig +short @$DNS_SERVER beta.example.com A | sort | tr '\n' ' '
        expect:
          stdoutContains: ["192.0.2.10"]
          stdoutNotContains: ["198.51.100.10"]
      - name: gamma-resolves-to-second-endpoint-only
        run: dig +short @$DNS_SERVER gamma.example.com A | sort | tr '\n' ' '
        expect:
          stdoutContains: ["198.51.100.10"]
          stdoutNotContains: ["192.0.2.10"]

  - name: edits-and-deletes-records-via-reconcile
    confirms: >
      Re-editing dnsRecords prunes and changes records (alpha drops its first
      endpoint, beta moves to the second, delta is added as a CNAME to alpha),
      and declaring dnsRemovals deletes an entire RRset — so a later reconcile
      leaves beta and gamma with no A records.
    cannot: >
      must not leave the pruned alpha address, the old beta address, or the
      removed beta/gamma records behind.
    documents: README.md#configuration
    variables:
      DNS_SERVER: bind
    steps:
      - name: modify-dns-records
        run: |
          swamp model get e2e-caddy --json \
            | jq '.globalArguments.dnsRecords=[{"name":"alpha.example.com","type":"A","value":["198.51.100.10"],"zone":"example.com"},{"name":"beta.example.com","type":"A","value":["198.51.100.10"],"zone":"example.com"},{"name":"delta.example.com","type":"CNAME","value":["alpha.example.com."],"zone":"example.com"}] | {name,version,tags,globalArguments}' \
            | swamp model edit e2e-caddy --json
        expect:
          exitCode: 0
      - name: apply-modified-records
        run: swamp model method run e2e-caddy applyDnsRecords
        expect:
          exitCode: 0
      - name: alpha-is-pruned-to-second-endpoint
        run: dig +short @$DNS_SERVER alpha.example.com A | sort | tr '\n' ' '
        expect:
          stdoutContains: ["198.51.100.10"]
          stdoutNotContains: ["192.0.2.10"]
      - name: delta-cnames-to-alpha
        run: dig +short @$DNS_SERVER delta.example.com CNAME
        expect:
          stdoutContains: ["alpha.example.com"]
      - name: beta-moved-to-second-endpoint
        run: dig +short @$DNS_SERVER beta.example.com A | sort | tr '\n' ' '
        expect:
          stdoutContains: ["198.51.100.10"]
      - name: delete-records-via-removals
        run: |
          swamp model get e2e-caddy --json \
            | jq '.globalArguments.dnsRecords=[{"name":"alpha.example.com","type":"A","value":["198.51.100.10"],"zone":"example.com"},{"name":"delta.example.com","type":"CNAME","value":["alpha.example.com."],"zone":"example.com"}] | .globalArguments.dnsRemovals=[{"name":"beta.example.com","type":"A","zone":"example.com"},{"name":"gamma.example.com","type":"A","zone":"example.com"}] | {name,version,tags,globalArguments}' \
            | swamp model edit e2e-caddy --json
        expect:
          exitCode: 0
      - name: apply-removals
        run: swamp model method run e2e-caddy applyDnsRecords
        expect:
          exitCode: 0
      - name: beta-has-no-a-records
        run: dig +short @$DNS_SERVER beta.example.com A
        expect:
          stdoutNotContains: ["192.0.2", "198.51.100"]
      - name: gamma-has-no-a-records
        run: dig +short @$DNS_SERVER gamma.example.com A
        expect:
          stdoutNotContains: ["192.0.2", "198.51.100"]
      - name: alpha-and-delta-are-kept
        run: |
          dig +short @$DNS_SERVER alpha.example.com A
          dig +short @$DNS_SERVER delta.example.com CNAME
        expect:
          stdoutContains: ["198.51.100.10", "alpha.example.com"]

  - name: elevation-sudo-grants-capability-and-binds-443
    confirms: >
      With a passwordless-`sudo` grant and a non-root harness, installCaddy grants
      CAP_NET_BIND_SERVICE through @svendowideit/sudo (the `sudo-n` route), the
      restarted service binds :443, and Caddy serves the status page over TLS on
      localhost.
    cannot: >
      must not leave the service without the capability, must not serve on a high
      port (:8443), and must not return anything but 200 from the TLS status page.
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: sudo-nopasswd }
    steps:
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-sudo \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: passwordless-sudo-is-available
        run: sh -c 'if sudo -n true 2>/dev/null; then echo sudo-works; else echo sudo-blocked; fi'
        expect: { stdoutContains: ["sudo-works"] }
      - name: install-caddy-binary
        run: swamp model method run e2e-sudo installCaddy
        expect: { exitCode: 0, outputNotContains: ["panic"] }
        timeoutSeconds: 300
      - name: create-and-start-service
        run: |
          swamp model method run e2e-sudo createService
          swamp model method run e2e-sudo startService
        expect: { exitCode: 0, outputNotContains: ["is not active", "panic"] }
      - name: binary-has-the-capability
        run: getcap "$HOME/.local/bin/caddy"
        expect: { stdoutContains: ["cap_net_bind_service"] }
      - name: live-config-binds-443
        run: curl -s http://localhost:2019/config/ | jq -c '[.apps.http.servers[].listen[]]'
        expect: { stdoutContains: [":443"], stdoutNotContains: [":8443"] }
      - name: status-page-served-over-tls
        run: curl -sk -o /dev/null -w '%{http_code}' https://localhost/
        expect: { stdoutContains: ["200"], stdoutNotContains: ["000"] }

  - name: elevation-doas-grants-capability-and-binds-443
    confirms: >
      With a `doas` grant (no passwordless sudo) and a non-root harness, the
      @svendowideit/sudo ladder selects the `doas` route, grants
      CAP_NET_BIND_SERVICE to the binary, the restarted service binds :443, and
      Caddy serves the status page over TLS on localhost.
    cannot: >
      must not use the sudo route (sudo has no passwordless rule here), must not
      leave the service without the capability, must not serve on a high port
      (:8443), and must not return anything but 200 from the TLS status page.
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: doas-nopasswd }
    steps:
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-doas \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: passwordless-sudo-is-unavailable
        run: sh -c 'if sudo -n true 2>/dev/null; then echo sudo-works; else echo sudo-blocked; fi'
        expect: { stdoutContains: ["sudo-blocked"], stdoutNotContains: ["sudo-works"] }
      - name: install-caddy-binary
        run: swamp model method run e2e-doas installCaddy
        expect: { exitCode: 0, outputNotContains: ["panic"] }
        timeoutSeconds: 300
      - name: create-and-start-service
        run: |
          swamp model method run e2e-doas createService
          swamp model method run e2e-doas startService
        expect: { exitCode: 0, outputNotContains: ["is not active", "panic"] }
      - name: binary-has-the-capability
        run: getcap "$HOME/.local/bin/caddy"
        expect: { stdoutContains: ["cap_net_bind_service"] }
      - name: live-config-binds-443
        run: curl -s http://localhost:2019/config/ | jq -c '[.apps.http.servers[].listen[]]'
        expect: { stdoutContains: [":443"], stdoutNotContains: [":8443"] }
      - name: status-page-served-over-tls
        run: curl -sk -o /dev/null -w '%{http_code}' https://localhost/
        expect: { stdoutContains: ["200"], stdoutNotContains: ["000"] }

  - name: no-elevation-route-interactive-sudo-fails-closed-and-degrades
    confirms: >
      On a host where `sudo` exists but requires a password (a
      `sudo-interactive-only` grant: no NOPASSWD rule), installCaddy's attempt to
      grant CAP_NET_BIND_SERVICE finds no granted route in @svendowideit/sudo, so
      it fails closed without prompting for a password and without hanging;
      reconcile never rejects the config but degrades to unprivileged ports, so
      Caddy still serves the status page, and upgradeCheck reports the capability
      gap honestly instead of claiming nothing blocks.
    cannot: >
      must not prompt for a password (no "Password:" or "AUTHENTICATING FOR"),
      must not leave cap_net_bind_service on the binary, must not bind the
      privileged port :443, must not print a fabricated "https://localhost" URL,
      and must not report "ready — nothing blocks".
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: sudo-interactive-only }
    steps:
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-interactive \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: interactive-sudo-has-no-passwordless-rule
        run: sh -c 'if sudo -n true 2>/dev/null; then echo sudo-works; else echo sudo-blocked; fi'
        expect: { stdoutContains: ["sudo-blocked"], stdoutNotContains: ["sudo-works"] }
      - name: install-caddy-binary-fails-closed-without-prompting
        run: swamp model method run e2e-interactive installCaddy
        expect:
          exitCode: 0
          outputNotContains: ["panic", "Password:", "AUTHENTICATING FOR"]
        timeoutSeconds: 300
      - name: create-and-start-service
        run: |
          swamp model method run e2e-interactive createService
          swamp model method run e2e-interactive startService
        expect:
          exitCode: 0
          outputNotContains:
            ["is not active", "panic", "Password:", "AUTHENTICATING FOR"]
      - name: binary-lacks-the-capability
        run: getcap "$HOME/.local/bin/caddy"
        expect: { stdoutNotContains: ["cap_net_bind_service"] }
      - name: live-config-is-degraded-not-rejected
        # :80/:443 -> :8080/:8443 over plain HTTP (the documented degrade); the
        # privileged :443 must be gone, and :8080 must be served.
        run: curl -s http://localhost:2019/config/ | jq -c '[.apps.http.servers[].listen[]]'
        expect:
          stdoutContains: [":8080", ":8443"]
          stdoutNotContains: [":443"]
      - name: status-page-still-served
        run: curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/
        expect: { stdoutContains: ["200"], stdoutNotContains: ["000"] }
      - name: upgrade-check-reports-the-gap-honestly
        run: |
          swamp model method run e2e-interactive upgradeCheck 2>&1 | tee /tmp/e3-check.txt
        expect:
          exitCode: 0
          outputContains: ["cannot bind ports 80/443"]
          outputNotContains:
            ["ready — nothing blocks", "Password:", "AUTHENTICATING FOR", "https://localhost"]

  - name: no-elevation-route-sudo-none-fails-closed-and-degrades
    confirms: >
      On a host with no `sudo` rule at all (a `sudo-none` grant), installCaddy's
      attempt to grant CAP_NET_BIND_SERVICE finds no granted route in
      @svendowideit/sudo, so it fails closed without prompting for a password and
      without hanging; reconcile never rejects the config but degrades to
      unprivileged ports, so Caddy still serves the status page, and upgradeCheck
      reports the capability gap honestly instead of claiming nothing blocks or
      fabricating a public "https://…" URL.
    cannot: >
      must not prompt for a password (no "Password:" or "AUTHENTICATING FOR"),
      must not leave cap_net_bind_service on the binary, must not bind the
      privileged port :443, must not print a fabricated public "https://" URL,
      and must not report "ready — nothing blocks".
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: sudo-none }
    steps:
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-no-sudo \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: sudo-is-unavailable
        run: sh -c 'if sudo -n true 2>/dev/null; then echo sudo-works; else echo sudo-blocked; fi'
        expect: { stdoutContains: ["sudo-blocked"], stdoutNotContains: ["sudo-works"] }
      - name: install-caddy-binary-fails-closed-without-prompting
        run: swamp model method run e2e-no-sudo installCaddy
        expect:
          exitCode: 0
          outputNotContains: ["panic", "Password:", "AUTHENTICATING FOR"]
        timeoutSeconds: 300
      - name: create-and-start-service
        run: |
          swamp model method run e2e-no-sudo createService
          swamp model method run e2e-no-sudo startService
        expect:
          exitCode: 0
          outputNotContains:
            ["is not active", "panic", "Password:", "AUTHENTICATING FOR"]
      - name: binary-lacks-the-capability
        run: getcap "$HOME/.local/bin/caddy"
        expect: { stdoutNotContains: ["cap_net_bind_service"] }
      - name: live-config-is-degraded-not-rejected
        # :80/:443 -> :8080/:8443 over plain HTTP (the documented degrade); the
        # privileged :443 must be gone, and :8080 must be served.
        run: curl -s http://localhost:2019/config/ | jq -c '[.apps.http.servers[].listen[]]'
        expect:
          stdoutContains: [":8080", ":8443"]
          stdoutNotContains: [":443"]
      - name: status-page-still-served
        run: curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/
        expect: { stdoutContains: ["200"], stdoutNotContains: ["000"] }
      - name: upgrade-check-reports-the-gap-honestly
        run: |
          swamp model method run e2e-no-sudo upgradeCheck 2>&1 | tee /tmp/e4-check.txt
        expect:
          exitCode: 0
          outputContains: ["cannot bind ports 80/443"]
          outputNotContains:
            ["ready — nothing blocks", "Password:", "AUTHENTICATING FOR", "https://localhost", "https://e2e-no-sudo.example.com"]
