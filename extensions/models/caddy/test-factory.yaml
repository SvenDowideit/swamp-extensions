        expect: { stdoutContains: ["200"], stdoutNotContains: ["000"] }
      - name: gap-report-names-the-missing-domain
        run: swamp model method run e2e-p3 upgradeCheck
        expect:
          outputContains: ["No baseDomain is set"]
          outputNotContains: ["ready — nothing blocks"]

  # ---- caddy-upgrade UX + unprivileged fallback (2026.11.07.4+) ------------
  # The upgrade workflow must not require an approval gate or a manual recovery
  # command, and it must leave Caddy active.
  - name: upgrade-workflow-runs-without-approval
    confirms: >
      @svendowideit/caddy-upgrade runs to completion without suspending for
      approval, and leaves the Caddy service active with its admin API
      reachable.
    cannot: >
      must not suspend on a manual approval, print a manual recovery command,
      or leave the service inactive.
    documents: README.md#upgrade
    steps:
      - name: remove-stale-autosave
        run: rm -f /root/.config/caddy/autosave.json
        expect: { exitCode: 0 }
      - name: run-upgrade
        run: swamp workflow run @svendowideit/caddy-upgrade --input model=e2e-caddy
        expect:
          exitCode: 0
          outputNotContains: ["waiting approval", "Suspended workflow"]
        timeoutSeconds: 300
      - name: service-stays-active
        run: systemctl --user is-active caddy
        expect: { stdoutContains: ["active"] }
      - name: admin-api-answers
        run: curl -sf http://localhost:2019/config/ >/dev/null
        expect: { exitCode: 0 }

  # Several models for the same (target, serviceName) are additive peers for
  # one Caddy. The default upgrade must upgrade that group, not skip because
  # the model count is greater than one.
  - name: upgrade-additive-models-together
    confirms: >
      Two caddy models with the same target and serviceName are one additive
      Caddy: the default upgrade with no model name upgrades the group instead
      of skipping, and both models' routes remain in the live config.
    cannot: >
      must not stop after listing the models, must not require --input model,
      and must not drop the second model's route.
    documents: README.md#more-than-one-caddy-model-they-merge-they-dont-fight
    steps:
      - name: create-additive-peer
        run: |
          swamp model create @svendowideit/caddy e2e-peer \
            --global-arg serviceName=caddy \
            --global-arg 'plugins:json=["github.com/caddy-dns/rfc2136"]' \
            --global-arg environmentFile=/root/.config/caddy/dns.env \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: add-peer-route
        run: >
          swamp model method run e2e-peer addRoute
          --input hostname=peer.example.com --input kind=file_server
          --input root=/tmp
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: remove-stale-autosave
        run: rm -f /root/.config/caddy/autosave.json
        expect: { exitCode: 0 }
      - name: upgrade-with-no-model
        run: swamp workflow run @svendowideit/caddy-upgrade
        expect:
          exitCode: 0
          outputContains: ["additive"]
          outputNotContains:
            - "distinct Caddy targets"
            - "waiting approval"
            - "Suspended workflow"
        timeoutSeconds: 300
      - name: both-models-routes-are-live
        run: |
          curl -s http://localhost:2019/config/ \
            | grep -o 'swamp:e2e-caddy\|swamp:e2e-peer' | sort -u
        expect:
          stdoutContains: ["swamp:e2e-caddy", "swamp:e2e-peer"]
      - name: cleanup-peer
        run: swamp model delete e2e-peer --yes --force
        expect: { exitCode: 0 }

  # A repo with models for genuinely different Caddy instances cannot be
  # upgraded by one unnamed run. It must fail with the choice, not skip every
  # step and report success.
  - name: upgrade-distinct-caddies-fails-loudly
    confirms: >
      When the repo defines models for two different Caddy instances, the
      default upgrade fails with the list and the exact --input model=
      commands instead of skipping every step and reporting success.
    cannot: >
      must not exit 0, must not claim the workflow completed successfully, and
      must not silently upgrade one Caddy while ignoring the other.
    documents: README.md#more-than-one-caddy-model-they-merge-they-dont-fight
    steps:
      - name: create-second-caddy
        run: |
          swamp model create @svendowideit/caddy e2e-other-caddy \
            --global-arg serviceName=caddy-other \
            --global-arg baseDomain=example.com
        expect: { exitCode: 0, outputNotContains: ["panic"] }
      - name: upgrade-with-no-model-fails
        run: swamp workflow run @svendowideit/caddy-upgrade
        expect:
          exitCode: 1
          outputContains: ["distinct Caddy targets", "Choose one"]
          outputNotContains: ["waiting approval", "Suspended workflow"]
        timeoutSeconds: 120
      - name: cleanup-second-caddy
        run: swamp model delete e2e-other-caddy --yes --force
        expect: { exitCode: 0 }

  # The running process cannot bind 80/443 on a host with no elevation route.
  # The extension must apply the config on 8080/8443 instead of leaving red
  # failures or crash-looping Caddy.
  - name: upgrade-workflow-pauses-when-sudo-cannot-grant
    confirms: >
      With no elevation route, the upgrade workflow suspends at
      pause-if-capability-missing and prints the exact command, instead of
      continuing or moving Caddy to high ports. Approving without running the
      command makes the hard retry fail with that command.
    cannot: >
      must not complete successfully, must not serve on 8080/8443, and must not
      approve a capability that is not on the binary.
    documents: README.md#privileged-ports-80443
    runAs: tester
    grants:
      - { guest: harness, profile: sudo-none }
    steps:
      - name: create-model
        run: |
          swamp model create @svendowideit/caddy e2e-pause \
            --global-arg baseDomain=example.com \
            --global-arg letsEncryptEmail=admin@example.com
        expect: { exitCode: 0 }
      - name: run-suspends-with-the-command
        run: swamp workflow run @svendowideit/caddy-upgrade --input model=e2e-pause 2>&1
        expect:
          exitCode: 0
          outputContains: ["Suspended workflow"]
          outputNotContains: ["listening on :8080", "listening on :8443"]
        timeoutSeconds: 300
      - name: approve-without-running-the-command
        run: swamp workflow approve @svendowideit/caddy-upgrade pause-if-capability-missing
        expect: { exitCode: 0 }
      - name: resume-fails-the-hard-retry
        run: swamp workflow resume @svendowideit/caddy-upgrade 2>&1
        expect:
          exitCode: 1
          outputContains: ["CAP_NET_BIND_SERVICE is not applied", "swamp model @svendowideit/sudo"]
          outputNotContains: ["listening on :8080", "listening on :8443"]
      - name: no-high-port-fallback
        run: curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/
        expect: { exitCode: [0, 7], stdoutContains: ["000"], stdoutNotContains: ["200"] }

