id: eb85224f-7588-49a3-b329-7fc7b8268d79
name: '@svendowideit/postgres-provision'
description: |
  Provision and configure PostgreSQL, then verify it is accepting connections.

  Idempotent — safe to re-run. Provisioning is delegated to the
  @svendowideit/postgres model (container-first): it ensures the network,
  starts a long-lived health-gated container, generates/stores the database
  password in the vault, creates the role and database, and writes a non-secret
  `connection` resource other models can consume with CEL.

  The model instance is created on first use (direct type execution). To reuse
  the same instance from other workflows, pass a stable modelName.

  Run:
    swamp workflow run postgres \
      --input vaultName=postgres-secrets \
      --input database=dtrack --input username=dtrack
tags: {}
inputs:
  properties:
    modelName:
      type: string
      default: postgres
      description: Name of the @svendowideit/postgres model instance to drive.
    vaultName:
      type: string
      description: >-
        Vault that holds the generated database password (required). Create it
        first, e.g. swamp vault create @svendowideit/systemd-creds postgres-secrets
    version:
      type: string
      default: 18-alpine
      description: Postgres image tag.
    database:
      type: string
      default: app
      description: Application database to create.
    username:
      type: string
      default: app
      description: Application role to create and own the database.
    adminUser:
      type: string
      default: postgres
      description: Image superuser (POSTGRES_USER).
    dataDir:
      type: string
      default: ~/.local/share/swamp-postgres
      description: Host directory persisted as the data volume.
    network:
      type: string
      default: swamp-postgres
      description: Container network peers join by name.
    port:
      type: integer
      default: 5432
      description: Host port to publish.
    serviceBackend:
      type: string
      default: direct
      description: direct | systemd (how the container is kept running).
  required:
    - vaultName
jobs:
  - name: main
    description: Provision, then verify readiness.
    steps:
      - name: provision
        description: Idempotently provision the server, role, database, and connection.
        task:
          type: model_method
          modelType: "@svendowideit/postgres"
          modelName: ${{ inputs.modelName }}
          methodName: provision
          globalArgs:
            vaultName: ${{ inputs.vaultName }}
            version: ${{ inputs.version }}
            database: ${{ inputs.database }}
            username: ${{ inputs.username }}
            adminUser: ${{ inputs.adminUser }}
            dataDir: ${{ inputs.dataDir }}
            network: ${{ inputs.network }}
            port: ${{ inputs.port }}
            serviceBackend: ${{ inputs.serviceBackend }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: status
        description: Verify the server is accepting connections.
        task:
          type: model_method
          modelType: "@svendowideit/postgres"
          modelName: ${{ inputs.modelName }}
          methodName: status
          globalArgs:
            vaultName: ${{ inputs.vaultName }}
            version: ${{ inputs.version }}
            database: ${{ inputs.database }}
            username: ${{ inputs.username }}
            adminUser: ${{ inputs.adminUser }}
            dataDir: ${{ inputs.dataDir }}
            network: ${{ inputs.network }}
            port: ${{ inputs.port }}
            serviceBackend: ${{ inputs.serviceBackend }}
        dependsOn:
          - step: provision
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
