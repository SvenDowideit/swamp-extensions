id: bbb60144-2c5f-4c95-8e0a-a89fe33aac01
name: "@svendowideit/ebook-scan"
description: |
  Incrementally scan the local filesystem for ebooks, detect bibliographic
  metadata, resolve authors/titles against Wikipedia/Wikidata, and render an
  HTML page linking to each file's location on disk.

  The scan-disk step is resumable and self-terminating: each run enumerates
  directories for up to 5 minutes, then hands off to the next step. Re-run the
  workflow to continue scanning from where it left off (state is persisted in
  swamp data). Once the whole tree is covered, the scan restarts fresh.

  Resolution is pure workflow composition. This workflow knows nothing about
  fetching or caching: it fans out per name into the
  @svendowideit/ebooks-resolve-name child workflow, which in turn calls the
  @svendowideit/wikipedia and @svendowideit/wikidata workflows (and they call
  @svendowideit/web-cache). Cache-hit vs fetch is invisible throughout.

    scan-disk → detect-metadata → plan-resolution
    → forEach name: @svendowideit/ebooks-resolve-name
    → render-html-list → render-html-authors

  Usage:
    swamp workflow run @svendowideit/ebook-scan
    swamp workflow run @svendowideit/ebook-scan --input root=/home/me/books
    swamp workflow run @svendowideit/ebook-scan --input outputPath=/srv/ebooks.html

  The scan/render steps are idempotent, so re-running is safe.
tags: {}
inputs:
  properties:
    root:
      type: string
      default: "~"
      description: Filesystem path to scan for ebooks
    outputPath:
      type: string
      default: "~/.swamp/ebooks/ebooks.html"
      description: Filesystem path for the generated HTML listing
    authorsOutputPath:
      type: string
      default: "~/.swamp/ebooks/index.html"
      description: Filesystem path for the author-grouped index page
    title:
      type: string
      default: "Ebooks"
      description: Title for the generated HTML page
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared web-cache directory (must match web-cache + ebooks)
    maxNames:
      type: number
      default: 20
      description: >-
        Cap on the number of names resolved per run. Already-resolved names are
        excluded first, so the backlog drains across runs. Raise to resolve more
        per run, lower to keep runs short.
    skipScan:
      type: boolean
      default: false
      description: >-
        Skip the directory scan and only re-process the already-discovered ebook
        paths (detect metadata + resolve + render). Useful when you only changed
        the metadata detection or rendering and don't need to re-walk the filesystem.
  required: []
jobs:
  - name: main
    description: Scan for ebooks, resolve authors/titles, then (re)generate the HTML listing.
    steps:
      - name: scan-disk
        description: Resume (or start) the ebook scan, up to 5 minutes per run.
        guard: ${{ inputs.skipScan == true }}
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: scan-disk
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: detect-metadata
        description: Detect book metadata (author, title, ISBN, dates) for the discovered ebooks.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: detect-metadata
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn:
          - step: scan-disk
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: plan-resolution
        description: Compute the names (authors + titles) that need resolving.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: plan-resolution
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxNames: ${{ inputs.maxNames }}
        dependsOn:
          - step: detect-metadata
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: resolve-names
        description: Resolve + classify each name via the fan-out child workflow.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/ebooks-resolve-names"
          inputs:
            items: ${{ data.latest("ebooks", "names").attributes.items }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn:
          - step: plan-resolution
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: render-html-list
        description: Render discovered ebooks (with detected metadata) into an HTML page.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: render-html-list
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
        dependsOn:
          - step: resolve-names
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: render-html-authors
        description: Render an author-grouped index page for ebooks with a detected author.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: render-html-authors
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            authorsOutputPath: ${{ inputs.authorsOutputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
        dependsOn:
          - step: resolve-names
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
