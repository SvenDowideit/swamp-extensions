id: bbb60144-2c5f-4c95-8e0a-a89fe33aac01
name: "@svendowideit/ebook-scan"
description: |
  Incrementally scan the local filesystem for ebooks, detect bibliographic
  metadata, resolve authors/titles against Wikipedia/Wikidata, and render an
  HTML page linking to each file's location on disk.

  The scan-disk step is resumable and self-terminating: each run enumerates
  directories for up to 5 minutes, then hands off to the next step. Re-run the
  workflow to continue scanning from where it left off (state is persisted in
  swamp data). Once the whole tree is covered, the scan restarts fresh.

  Resolution is a fetch-free decision pipeline in the ebooks model, with all
  fetching delegated to @svendowideit/web-cache:

    plan-resolution  →  web-cache.get-many (opensearch)
    choose-candidates →  web-cache.get-many (pageprops query)
    choose-final     →  web-cache.get-many (wikitext + wikidata entity)
    finalize-resolution (classify + write authors/books)

  Usage:
    swamp workflow run @svendowideit/ebook-scan
    swamp workflow run @svendowideit/ebook-scan --input root=/home/me/books
    swamp workflow run @svendowideit/ebook-scan --input outputPath=/srv/ebooks.html

  The scan/render steps are idempotent, so re-running is safe.
tags: {}
inputs:
  properties:
    root:
      type: string
      default: "~"
      description: Filesystem path to scan for ebooks
    outputPath:
      type: string
      default: "~/.swamp/ebooks/ebooks.html"
      description: Filesystem path for the generated HTML listing
    authorsOutputPath:
      type: string
      default: "~/.swamp/ebooks/index.html"
      description: Filesystem path for the author-grouped index page
    title:
      type: string
      default: "Ebooks"
      description: Title for the generated HTML page
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared web-cache directory (must match web-cache + ebooks)
    maxFetches:
      type: number
      default: 20
      description: >-
        Cap on origin fetches per web-cache.get-many call. Cached hits don't
        count, so the backlog is spread across runs. Raise to fetch more per run,
        lower to keep runs short.
    skipScan:
      type: boolean
      default: false
      description: >-
        Skip the directory scan and only re-process the already-discovered ebook
        paths (detect metadata + resolve + render). Useful when you only changed
        the metadata detection or rendering and don't need to re-walk the filesystem.
  required: []
jobs:
  - name: main
    description: Scan for ebooks, resolve authors/titles, then (re)generate the HTML listing.
    steps:
      - name: scan-disk
        description: Resume (or start) the ebook scan, up to 5 minutes per run.
        guard: ${{ inputs.skipScan == true }}
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: scan-disk
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: detect-metadata
        description: Detect book metadata (author, title, ISBN, dates) for the discovered ebooks.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: detect-metadata
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn:
          - step: scan-disk
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: plan-resolution
        description: Compute names to resolve and emit round-1 opensearch URLs.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: plan-resolution
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn:
          - step: detect-metadata
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: fetch-search
        description: Fetch + cache the opensearch URLs (round 1) via web-cache.
        task:
          type: model_method
          modelType: "@svendowideit/web-cache"
          modelName: web-cache
          methodName: get-many
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            urls: ${{ data.latest("ebooks", "plan").attributes.searchUrls }}
            maxFetches: ${{ inputs.maxFetches }}
        dependsOn:
          - step: plan-resolution
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: choose-candidates
        description: Read cached opensearch bodies and emit round-2 pageprops URLs.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: choose-candidates
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn:
          - step: fetch-search
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: fetch-query
        description: Fetch + cache the pageprops query URLs (round 2) via web-cache.
        task:
          type: model_method
          modelType: "@svendowideit/web-cache"
          modelName: web-cache
          methodName: get-many
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            urls: ${{ data.latest("ebooks", "candidates").attributes.queryUrls }}
            maxFetches: ${{ inputs.maxFetches }}
        dependsOn:
          - step: choose-candidates
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: choose-final
        description: Choose the canonical candidate and emit round-3 wikitext + wikidata URLs.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: choose-final
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn:
          - step: fetch-query
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: fetch-final
        description: Fetch + cache the wikitext + wikidata entity URLs (round 3) via web-cache.
        task:
          type: model_method
          modelType: "@svendowideit/web-cache"
          modelName: web-cache
          methodName: get-many
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            urls: ${{ data.latest("ebooks", "final").attributes.finalFetchUrls }}
            maxFetches: ${{ inputs.maxFetches }}
        dependsOn:
          - step: choose-final
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: finalize-resolution
        description: Classify each name and write the authors/books resolution maps.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: finalize-resolution
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            maxDurationMs: 300000
        dependsOn:
          - step: fetch-final
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: render-html-list
        description: Render discovered ebooks (with detected metadata) into an HTML page.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: render-html-list
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
        dependsOn:
          - step: finalize-resolution
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: render-html-authors
        description: Render an author-grouped index page for ebooks with a detected author.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: render-html-authors
          globalArgs:
            root: ${{ inputs.root }}
            outputPath: ${{ inputs.outputPath }}
            authorsOutputPath: ${{ inputs.authorsOutputPath }}
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
        dependsOn:
          - step: finalize-resolution
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
