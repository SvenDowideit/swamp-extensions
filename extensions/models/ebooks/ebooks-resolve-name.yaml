id: aaa8740f-122c-4dae-9f58-bdcb6028f434
name: "@svendowideit/ebooks-resolve-name"
description: |
  Resolve and classify one name (an author or a book title) against Wikipedia
  and Wikidata, through the shared cache, transparently. Emits a single per-name
  `resolution` record owned by @svendowideit/ebooks.

  The whole pipeline is workflow composition — this workflow knows nothing about
  fetching or caching. It calls the wikipedia/wikidata workflows, which in turn
  call web-cache; cache-hit vs fetch is invisible here (only surfaced as
  metadata).

    wikipedia-search      → candidate titles
    wikipedia-page-props  → canonical title / shortdesc / wikidataId
    ebooks.pick-candidate → choose the best candidate
    wikipedia-infobox     → infobox template name
    wikidata-instance-of  → P31 value QIDs
    ebooks.classify       → classify (author/book) + write the resolution record

  Inputs:
    name       — the author name or book title to resolve
    expectKind — "author" | "book"
    key        — filesystem-safe key for this name (defaults to nameKey(name));
                 used for every data-instance name so long/Unicode/garbage
                 titles can't blow the filename limit.
    cacheDir   — shared cache dir (default ~/.swamp/web-cache)
tags: {}
inputs:
  properties:
    name:
      type: string
      description: The name to resolve
    expectKind:
      type: string
      description: author | book
    key:
      type: string
      default: ""
      description: Filesystem-safe key for this name
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
  required:
    - name
    - expectKind
jobs:
  - name: main
    description: Resolve + classify one name.
    steps:
      - name: search
        description: Search Wikipedia for the name.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikipedia-search"
          inputs:
            query: ${{ inputs.name }}
            key: ${{ inputs.key }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: page-props
        description: Resolve candidate titles to canonical title/QID.
        guard: >-
          ${{ size(data.latest("wiki", 'search-' + inputs.key).?attributes.?results.orValue([])) == 0 }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikipedia-page-props"
          inputs:
            titles: ${{ data.latest("wiki", 'search-' + inputs.key).?attributes.?results.orValue([]).map(r, r.title) }}
            key: ${{ inputs.key }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn:
          - step: search
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: pick
        description: Choose the best candidate for the name.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: pick-candidate
          inputs:
            name: ${{ inputs.name }}
            expectKind: ${{ inputs.expectKind }}
            key: ${{ inputs.key }}
            results: ${{ data.latest("wiki", 'search-' + inputs.key).?attributes.?results.orValue([]) }}
            pages: ${{ data.latest("wiki", 'page-props-' + inputs.key).?attributes.?pages.orValue({}) }}
        dependsOn:
          - step: page-props
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: infobox
        description: Fetch + parse the chosen page's infobox.
        guard: >-
          ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?title.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikipedia-infobox"
          inputs:
            title: ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?title.orValue("") }}
            key: ${{ inputs.key }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn:
          - step: pick
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: instance-of
        description: Fetch + parse the chosen entity's P31 values.
        guard: >-
          ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?wikidataId.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikidata-instance-of"
          inputs:
            id: ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?wikidataId.orValue("") }}
            key: ${{ inputs.key }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn:
          - step: pick
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: classify
        description: Classify (author/book) and write the resolution record.
        task:
          type: model_method
          modelType: "@svendowideit/ebooks"
          modelName: ebooks
          methodName: classify
          inputs:
            name: ${{ inputs.name }}
            expectKind: ${{ inputs.expectKind }}
            key: ${{ inputs.key }}
            title: ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?title.orValue(null) }}
            url: ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?url.orValue(null) }}
            description: ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?description.orValue(null) }}
            wikidataId: ${{ data.latest("ebooks", 'candidate-' + inputs.key).?attributes.?wikidataId.orValue(null) }}
            infoboxTemplate: ${{ data.latest("wiki", 'infobox-' + inputs.key).?attributes.?template.orValue(null) }}
            instanceOf: ${{ data.latest("wd", 'instance-of-' + inputs.key).?attributes.?instanceOf.orValue([]) }}
        dependsOn:
          - step: infobox
            condition:
              type: always
          - step: instance-of
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
