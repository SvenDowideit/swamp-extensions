id: bbee58f5-d1ed-4eb9-b57c-08b08e5f8c9f
name: "@svendowideit/garmin-health-sync"
description: |
  Sync daily wellness from Garmin Connect for a date window.

  Same transport→domain seam as the other Garmin syncs, but with a prerequisite
  the device endpoints do not need:

    1. session       guarantee a valid bearer token.
    2. profile       fetch the account's social profile. Several Garmin wellness
                     endpoints are addressed by the display name, which this
                     records so the health model can build their paths.
    3. health-paths  @svendowideit/garmin-health builds one path per date per
                     metric, dropping device-gated metrics the account's devices
                     do not support (it reads the capability map).
    4. fetch         one fetch-many caches every path in a paced batch.
    5. sync          parse the cached bodies into `daily-<date>` and a
                     `health-range` roll-up, with a compact summary per day.

  Default window is yesterday — the most recent complete day. Widen it with
  startDate/endDate for a backfill. Device-gated metrics (HRV, SpO2,
  respiration, body battery) are only requested when the capability map says the
  account has a device that produces them.

  Runs daily at 05:30, after the session, device and activity syncs.

  Manual run:
    swamp workflow run @svendowideit/garmin-health-sync
    swamp workflow run @svendowideit/garmin-health-sync --input startDate=2026-01-01 --input endDate=2026-01-31
    swamp workflow run @svendowideit/garmin-health-sync --input respectCapabilities=false
tags:
  domain: fitness
trigger:
  schedule: "30 5 * * *"
  inputs: {}
inputs:
  properties:
    sessionName:
      type: string
      default: garmin-connect
      description: The @svendowideit/garmin-connect transport instance name.
    healthName:
      type: string
      default: garmin-health
      description: The @svendowideit/garmin-health instance name.
    devicesName:
      type: string
      default: garmin-devices
      description: >
        The @svendowideit/garmin-devices instance holding the capability map;
        used to gate device-specific metrics.
    startDate:
      type: string
      default: ""
      description: Window start, YYYY-MM-DD; empty = yesterday.
    endDate:
      type: string
      default: ""
      description: Window end, YYYY-MM-DD; empty = start date.
  required: []
jobs:
  - name: health
    description: Ensure a session, fetch wellness paths, parse into resources.
    steps:
      - name: session
        description: Guarantee a valid Garmin bearer token before any fetch.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/garmin-session"
          inputs:
            name: ${{ inputs.sessionName }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: profile
        description: >
          Fetch the account display name — several wellness endpoints are
          addressed by it.
        task:
          type: model_method
          modelType: "@svendowideit/garmin-connect"
          modelName: ${{ inputs.sessionName }}
          methodName: profile
        dependsOn:
          - step: session
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: health-paths
        description: >
          Build one path per date per metric, gated by the device capability map.
        task:
          type: model_method
          modelType: "@svendowideit/garmin-health"
          modelName: ${{ inputs.healthName }}
          methodName: paths
          inputs:
            startDate: ${{ inputs.startDate }}
            endDate: ${{ inputs.endDate }}
            displayName: ${{ data.latest(inputs.sessionName, "profile").attributes.displayName }}
            capabilities: ${{ data.latest(inputs.devicesName, "device-capabilities").?attributes.?capabilities.orValue({}) }}
        dependsOn:
          - step: profile
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: fetch
        description: One authenticated, paced, cached batch fetch of all paths.
        task:
          type: model_method
          modelType: "@svendowideit/garmin-connect"
          modelName: ${{ inputs.sessionName }}
          methodName: fetch-many
          inputs:
            paths: ${{ data.latest(inputs.healthName, "health-paths").attributes.paths }}
        dependsOn:
          - step: health-paths
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: sync
        description: >
          Parse the cached bodies into `daily-<date>` and a `health-range` roll-up.
        task:
          type: model_method
          modelType: "@svendowideit/garmin-health"
          modelName: ${{ inputs.healthName }}
          methodName: sync
        dependsOn:
          - step: fetch
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: report
        description: Fail loudly if no day could be parsed at all.
        task:
          type: assert
          expr: >-
            data.latest(inputs.healthName, "health-range").attributes.days > 0
          message: >-
            No wellness days were parsed. Check the session is valid and the
            window is correct, then re-run.
          severity: medium
        dependsOn:
          - step: sync
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
