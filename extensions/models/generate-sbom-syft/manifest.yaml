manifestVersion: 1
name: "@svendowideit/generate-sbom-syft"
version: "2026.10.11.1"
description: >
  Generate Dependency-Track-ready SBOMs with Anchore Syft for a whole host, a
  container image, a single binary, or a source tree — one method, four kinds
  of target.

  WHAT IT DOES

    Turns "what is installed here?" into a Bill of Materials you can act on.
    Syft covers all four targets this needs: a host filesystem (`dir:/`), a
    container image (`image:`/`registry:`), a single binary (`file:`), and a
    source repository (`dir:`). `generate` writes the result as a swamp file
    resource plus an optional path, with a `scan` summary — format, package
    count, source, size and duration. Prefer it over hand-run `syft`: the
    binary is downloaded and checksum-verified for you, the output is captured
    as data, and one model serves a nightly host scan and a one-off image scan.
    A generic `@svendowideit/generate-sbom` workflow produces the SBOM and
    exposes its path; a site-specific workflow submits it wherever you need.

  INSTALL

      swamp extension pull @svendowideit/generate-sbom-syft

  DEPENDENCIES

    @svendowideit/github-release-install (pulled automatically) resolves and
    verifies the syft release; a `tar` binary extracts it. Set `syftPath` to use
    a pre-installed syft and skip both. Nothing here references a dependency
    tracker: the SBOM is generic, and a site-specific workflow composes the
    upload.

  RUN

      # Scan this whole host: `dir:/` walks the root filesystem. Give the BOM a
      # name/version so Dependency-Track groups it as the project you expect.
      swamp model @svendowideit/generate-sbom-syft method run generate host \
        --input target=/ --input targetType=dir \
        --input sourceName=my-host --input sourceVersion=1.0.0 \
        --input outputFile=~/sbom/my-host.cdx.json

      # Scan a container image (uses the local container runtime or registry).
      swamp model @svendowideit/generate-sbom-syft method run generate image \
        --input target=alpine:3.19 --input targetType=image

      # Install (or refresh) the checksum-verified syft binary without scanning.
      swamp model @svendowideit/generate-sbom-syft method run install syft-tool

      # Or run the bundled generic workflow, which scans the target and makes
      # the SBOM available as data for any caller to submit wherever.
      swamp workflow run @svendowideit/generate-sbom \
        --input target=/home/alice/.local/bin/caddy --input targetType=file \
        --input label=caddy

  CONFIGURE

    Optional global arguments (set with `--global-arg key=value`): syftPath,
    syftVersion, repo, stateDir, githubToken, outputFormat, catalogers, exclude,
    scope, sourceName, sourceVersion and timeoutMs. Per call: target, targetType,
    format, catalogers, exclude, scope, platform, sourceName, sourceVersion,
    label, outputFile and timeoutMs. See the README for the full tables.

  UPGRADE

    This extension installs nothing on the host, so an upgrade has nothing to
    rebuild or reconcile. Refresh the pulled model type and its bundled files
    with one idempotent command:

        swamp extension update

    The cached syft binary refreshes itself on the next scan (or immediately
    with `install --input force=true`); swamp data is never touched.

  WHAT IT INSTALLS

    Nothing on the host — no services, cron triggers, daemons or webhooks. It
    downloads a checksum-verified syft binary and caches it (plus the verified
    release archive) under `stateDir` (default `~/.swamp/generate-sbom-syft`),
    and writes swamp resources and files.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - generate_sbom_syft.ts

workflows:
  - generate-sbom.yaml

dependencies:
  - "@svendowideit/github-release-install"

additionalFiles:
  - README.md
  - LICENSE.txt
  - generate_sbom_syft_test.ts

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
