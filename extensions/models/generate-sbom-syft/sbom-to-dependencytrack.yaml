id: f537a09e-6152-4d79-9ded-fe613bf6fda0
name: '@svendowideit/sbom-to-dependencytrack'
description: |
  Generate an SBOM for one target with @svendowideit/generate-sbom-syft and upload
  it to Dependency-Track with @svendowideit/curl, tagging the project with the
  host it came from.

  Dependency-Track model: one project per (software, version) — projectName is
  the software, projectVersion its version — with the host recorded as a project
  tag (projectTags). Uploading the same software on many machines therefore
  creates a distinct project per version and tags each with its host, so "which
  hosts run which version" is a tag filter in the portfolio.

  The BOM upload is a multipart/form-data POST. The API key is read from the
  vault named by vaultName (key vaultKey); the endpoint comes from the
  dependencytrack model's agentKey data unless uploadUrl is given.

  Prerequisites: @svendowideit/generate-sbom-syft, @svendowideit/curl and a
  running @svendowideit/dependencytrack with a key that can upload and tag
  (the extension's default agent permissions include TAG_MANAGEMENT).

  Run (a binary on this host):
    swamp workflow run @svendowideit/sbom-to-dependencytrack \
      --input target=/home/alice/.local/bin/caddy --input targetType=file \
      --input projectName=caddy --input projectVersion=2.11.6 --input host=x1yoga

  Run (a whole host filesystem, excluding the virtual filesystems):
    swamp workflow run @svendowideit/sbom-to-dependencytrack \
      --input target=/ --input targetType=dir \
      --input projectName=host-x1yoga --input projectVersion=1.0.0 \
      --input host=x1yoga \
      --input 'exclude:json=["**/proc/**","**/sys/**","**/dev/**","**/run/**"]'
tags: {}
inputs:
  properties:
    target:
      type: string
      description: What to scan — a path, a binary, or a container image reference.
    targetType:
      type: string
      default: ""
      enum: ["", dir, file, image, registry, docker, podman, oci-archive, oci-dir, singularity, purl, sbom]
      description: Syft source scheme to prepend when the target has none.
    projectName:
      type: string
      description: Dependency-Track project name — the software (e.g. caddy).
    projectVersion:
      type: string
      description: Dependency-Track project version — the software version (e.g. 2.11.6).
    host:
      type: string
      default: ""
      description: Host/VM this SBOM came from; applied as a project tag. Empty leaves the project untagged.
    format:
      type: string
      default: cyclonedx-json
      enum: [cyclonedx-json, cyclonedx-xml, spdx-json, spdx-tag-value, syft-json]
      description: SBOM format. CycloneDX is the safest for Dependency-Track.
    exclude:
      type: array
      items:
        type: string
      default: []
      description: Exclusions in syft glob syntax (each must start with ./, */ or **/).
    catalogers:
      type: array
      items:
        type: string
      default: []
      description: Syft catalogers to enable. Empty uses all.
    scanModel:
      type: string
      default: sbom
      description: Name of the @svendowideit/generate-sbom-syft model instance to drive.
    uploadModel:
      type: string
      default: dt-upload
      description: Name of the @svendowideit/curl model instance to drive.
    dtModel:
      type: string
      default: dependencytrack
      description: Name of the @svendowideit/dependencytrack model instance whose agentKey endpoint is used.
    vaultName:
      type: string
      default: dependencytrack-secrets
      description: Vault holding the Dependency-Track agent API key.
    vaultKey:
      type: string
      default: DEPENDENCYTRACK_API_KEY
      description: Vault key holding the agent API key.
    uploadUrl:
      type: string
      default: ""
      description: Override the BOM endpoint URL. Empty uses the dependencytrack model's agentKey endpoint.
  required:
    - target
    - projectName
    - projectVersion
jobs:
  - name: main
    description: Generate the SBOM, then upload and tag it in Dependency-Track.
    steps:
      - name: generate
        description: Scan the target with syft and write the SBOM as a file resource.
        task:
          type: model_method
          modelType: "@svendowideit/generate-sbom-syft"
          modelName: ${{ inputs.scanModel }}
          methodName: generate
          inputs:
            target: ${{ inputs.target }}
            targetType: ${{ inputs.targetType }}
            format: ${{ inputs.format }}
            exclude: ${{ inputs.exclude }}
            catalogers: ${{ inputs.catalogers }}
            sourceName: ${{ inputs.projectName }}
            sourceVersion: ${{ inputs.projectVersion }}
            label: ${{ inputs.projectName }}
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: upload
        description: Upload the SBOM to Dependency-Track (multipart), tagging the project with the host.
        task:
          type: model_method
          modelType: "@svendowideit/curl"
          modelName: ${{ inputs.uploadModel }}
          methodName: post
          inputs:
            url: >-
              ${{ inputs.uploadUrl != "" ? inputs.uploadUrl : data.latest(inputs.dtModel, "agentKey").attributes.bomEndpoint }}
            headers: >-
              ${{ ["X-Api-Key: " + vault.get(inputs.vaultName, inputs.vaultKey)] }}
            multipart: >-
              ${{ {"autoCreate": "true", "projectName": inputs.projectName, "projectVersion": inputs.projectVersion, "projectTags": inputs.host} }}
            files: >-
              ${{ {"bom": data.latest(inputs.scanModel, inputs.projectName).path} }}
            label: ${{ "upload-" + inputs.projectName }}
            failOnHttpError: true
        dependsOn:
          - step: generate
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: verify-upload
        description: Assert Dependency-Track accepted the BOM.
        task:
          type: assert
          expr: >-
            data.latest(inputs.uploadModel, "upload-" + inputs.projectName).attributes.ok == true
          message: >-
            Upload to Dependency-Track failed: status=${{ data.latest(inputs.uploadModel, "upload-" + inputs.projectName).attributes.status }} body=${{ data.latest(inputs.uploadModel, "upload-" + inputs.projectName).attributes.body }}
          severity: high
        dependsOn:
          - step: upload
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
