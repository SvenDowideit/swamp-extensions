manifestVersion: 1
name: "@svendowideit/github-pages"
version: "2026.09.25.1"
description: >
  Publish a local directory to a GitHub repository's Pages site, and
  idempotently configure Pages itself, straight through the GitHub REST API —
  no `gh-pages` package, no extra checkout, no action runner.

  WHAT IT DOES

    Turns "publish this folder to GitHub Pages" into two repeatable commands
    that are safe to re-run. It walks a directory, hashes each file as a git
    blob locally, uploads only the blobs that actually changed, and commits the
    delta as a single commit — so re-publishing a mostly-unchanged site is cheap
    and creates no commit when nothing changed. It also reconciles the Pages
    configuration itself (source branch, source path, build type, custom domain,
    HTTPS enforcement) via GET + POST/PUT, so enabling Pages is no longer a
    one-way manual step. Prefer it over a `gh-pages` tool or a GitHub Action:
    everything happens over the API with no local `git` operation, and the
    directory traversal rejects `..` segments and skips symlinks.

  INSTALL

      swamp extension pull @svendowideit/github-pages

  DEPENDENCIES

    None — it uses the `gh` CLI for authentication (run `gh auth login` first)
    and the GitHub REST API; no other extension is required. A token can instead
    be supplied via the `authToken` global argument or the `GH_TOKEN` /
    `GITHUB_TOKEN` environment variables.

  RUN

      # Create a model for the target repository.
      swamp model create @svendowideit/github-pages my-site \
        --global repo=owner/repo \
        --global branch=gh-pages

      # Idempotently configure Pages to serve gh-pages at /.
      swamp model method run my-site ensureSite

      # Publish ./dist (recursively) as a single commit.
      swamp model method run my-site publishDir --input dir=./dist

      # Preview what would change without committing.
      swamp model method run my-site publishDir --input dir=./dist --input dryRun=true

    Publishing to `main:/docs` instead is a configuration change, not a code
    change: set `--global branch=main --global pagesPath=/docs`, then run
    `ensureSite` and `publishDir --input prune=true`.

  CONFIGURE

    Global arguments (all optional):

      repo             owner/name                 (default: inferred from git origin)
      branch           branch Pages serves from   (default gh-pages)
      pagesPath        / or /docs                 (default /)
      buildType        legacy or workflow         (default legacy)
      cname            custom domain              (pass null to ensureSite to remove)
      httpsEnforced    enforce HTTPS              (default true)
      authToken        API token                  (else gh auth token / GH_TOKEN / GITHUB_TOKEN)
      apiBase          GitHub Enterprise base      (default api.github.com)
      commitMessage    commit message              (default "Publish site via swamp")
      gitAuthorName / gitAuthorEmail               commit author identity

    Per-run overrides: `dir`, `prune`, `dryRun` on `publishDir`; `files` on
    `publishFiles`; `cname` on `ensureSite`.

  WHAT IT INSTALLS

    Nothing on the host — no services, daemons, cron triggers, or webhooks. It
    reads and writes files in the target GitHub repository over the REST API and
    writes swamp resources (`site`, `publish`, `sync`); the only local
    requirement is the `gh` CLI for authentication.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - github_pages.ts

additionalFiles:
  - README.md
  - LICENSE.txt
  - github_pages_test.ts

platforms: []
