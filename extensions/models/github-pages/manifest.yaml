manifestVersion: 1
name: "@svendowideit/github-pages"
version: "2026.09.18.1"
description: |
  Publish a local directory (and its subdirectories) to a GitHub repository's
  GitHub Pages site, and idempotently configure Pages itself, using the GitHub
  REST API. No `gh-pages` package, no extra checkout, no action runner — swamp
  commits straight to the Pages branch through the Git Data API and reuses
  unchanged git blobs, so re-running it is cheap and safe.

  ## What it does

  - `ensureSite` idempotently creates or updates the Pages site: source branch,
    source path (`/` or `/docs`), build type, custom domain, and HTTPS
    enforcement. Running it twice is a no-op.
  - `publishDir` walks a directory recursively, uploads only the files whose
    content changed, and commits the delta as a single commit. If nothing
    changed, no commit is created.
  - `publishFiles` publishes an explicit list of files, optionally remapped to
    repository paths.
  - `syncSite` reads the live Pages site and latest build into a drift snapshot.

  ## Install

  ```sh
  swamp extension pull @svendowideit/github-pages
  ```

  Authentication uses the `gh` CLI by default, so run `gh auth login` first. A
  token can also be supplied via the `authToken` global argument or the
  `GH_TOKEN` / `GITHUB_TOKEN` environment variables. The token needs `repo`
  scope (classic PAT) or `Contents: read/write` + `Pages: read/write`
  (fine-grained PAT).

  ## Run

  ```sh
  # Create a model for the target repository
  swamp model create @svendowideit/github-pages my-site \
    --global repo=owner/repo \
    --global branch=gh-pages

  # Idempotently configure Pages to serve gh-pages at /
  swamp model method run my-site ensureSite

  # Publish ./dist (recursively) as one commit
  swamp model method run my-site publishDir --input dir=./dist

  # Preview changes without committing
  swamp model method run my-site publishDir --input dir=./dist --input dryRun=true
  ```

  Publishing to `main:/docs` instead is a config change, not a code change:

  ```sh
  swamp model create @svendowideit/github-pages docs-site \
    --global repo=owner/repo \
    --global branch=main \
    --global pagesPath=/docs
  swamp model method run docs-site ensureSite
  swamp model method run docs-site publishDir --input dir=./site --input prune=true
  ```

  ## Configure

  | Global argument  | Default                  | Description                                                 |
  | ---------------- | ------------------------ | ----------------------------------------------------------- |
  | `repo`           | inferred from git origin | `owner/name`.                                               |
  | `branch`         | `gh-pages`               | Branch Pages serves from.                                   |
  | `pagesPath`      | `/`                      | Source path within the branch (`/` or `/docs`).             |
  | `buildType`      | `legacy`                 | `legacy` (build from branch) or `workflow` (Actions).       |
  | `cname`          | unset                    | Custom domain; pass `null` to `ensureSite` to remove one.   |
  | `httpsEnforced`  | `true`                   | Enforce HTTPS on the Pages site.                            |
  | `authToken`      | unset                    | Token; otherwise `gh auth token`, `GH_TOKEN`, `GITHUB_TOKEN`. |
  | `apiBase`        | `https://api.github.com` | Override for GitHub Enterprise.                             |
  | `commitMessage`  | `Publish site via swamp` | Commit message.                                             |

  Outputs are versioned resources usable from other models with CEL, e.g.
  `${{ data.latest("my-site", "publish").attributes.commitSha }}`. See the
  bundled README for the full method and output reference.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - github_pages.ts

additionalFiles:
  - README.md
  - LICENSE.txt
  - github_pages_test.ts

platforms: []
