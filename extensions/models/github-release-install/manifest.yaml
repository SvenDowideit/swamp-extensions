manifestVersion: 1
name: "@svendowideit/github-release-install"
version: "2026.09.30.1"
description: >
  Resolve any GitHub repository's latest (or pinned) release, pick the right
  archive for this machine, verify it against the release's checksums, and
  download a verified file — the reusable core of a binary auto-updater.

  WHAT IT DOES

    Turns "install the latest release of X" into two repeatable commands for
    any repository that publishes release assets. It reads the GitHub releases
    API, probes the local OS and architecture (`uname`), matches them against
    each asset's parsed name (`tool_1.2.3_Linux_x86_64.tar.gz`), records the
    archive's SHA-256 from the release's checksums file, and downloads the
    archive only after the bytes match that hash. It also preserves the raw
    GitHub payload and can render it into a Markdown release document. Prefer it
    over a `curl` of a release URL: the download is verified before it is
    written, the platform match is explicit, and one model serves every
    repository. The same checksum-verified download pattern
    `@swamp/deno-runner` uses for Deno is generalised here to any repo, any
    release, and tar.gz / zip / raw archives.

  INSTALL

      swamp extension pull @svendowideit/github-release-install

  DEPENDENCIES

    None — it uses Deno's built-in `fetch` and the bundled Deno binary swamp
    already ships. No other extension is required, and nothing is installed on
    the host. A GitHub token is optional: set the `githubToken` global (or
    export `GITHUB_TOKEN`) to raise the API rate limit above 60 requests/hour.

  RUN

      # Create a model for a repository (globals are set with --global-arg),
      # then resolve its latest release and this machine's archive.
      swamp model create @svendowideit/github-release-install rel \
        --global-arg repo=Gaurav-Gosain/tuios --global-arg stem=tuios
      swamp model @svendowideit/github-release-install method run check rel

      # Resolve and download a verified archive to a path in one workflow run.
      swamp workflow run @svendowideit/github-release-install-fetch \
        --input repo=Gaurav-Gosain/tuios \
        --input outputPath=~/.cache/tuios/tuios.tar.gz

      # Pin a version and ask what a different platform would download,
      # without touching this machine (per-call values use --input).
      swamp model @svendowideit/github-release-install method run check rel \
        --input version=0.8.0 --input os=Darwin --input arch=arm64

      # Render the resolved release (notes + asset table) into Markdown.
      swamp model @svendowideit/github-release-install method run render rel

  CONFIGURE

    Global arguments (set at model creation with `--global-arg repo=owner/name`):

      repo             GitHub repository (owner/name)     (required; or set apiUrl)
      apiUrl           explicit releases API URL          (default: derived from repo)
      stem             required asset product name        (default: any)
      assetPattern     regex the asset name must match;   (default: GoReleaser
                       named groups version/os/arch        tool_<v>_<Os>_<arch>[.ext])
      checksumsName    checksums asset name               (default checksums.txt)
      format           auto | tar.gz | zip | raw          (default auto)
      githubToken      raises the API rate limit          (default: GITHUB_TOKEN / GH_TOKEN)
      userAgent        User-Agent header                  (default swamp-github-release/1.0)
      os / arch        override the detected platform     (default: host probe)

    Per-run overrides: `check` takes `version`, `os`, `arch`, `stem`,
    `assetName`, `pattern`, `fetchChecksums` and `requireChecksum`; `download`
    takes `version`, `outputPath`/`outputDir`, `checksum`/`downloadUrl`/
    `assetName` (to consume a prior `check`), `checksumsUrl`, `force` and
    `requireChecksum`; `render` takes `includeBody`, `includeAssets` and
    `maxBodyChars`. Precedence is per-call `--input` > model global > schema
    default. `format` both records the archive format and filters selection
    (use it when a release offers the same platform as more than one format). A
    checksum is mandatory on both paths: `check` fails when the checksums file
    cannot be fetched or does not list the archive, and `download` refuses an
    archive whose bytes do not match.

  WHAT IT INSTALLS

    Nothing on the host — no services, daemons, cron triggers, or webhooks. It
    writes the verified archive to the `outputPath`/`outputDir` you pass to
    `download` (nothing is written when both are empty), and writes swamp
    resources (`release`, `archive`, `summary`, `document`). Installing or
    extracting the downloaded archive is the caller's job —
    `@svendowideit/tuios` uses it to keep the `tuios` binary current.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - github_release_install.ts
  - github_release.ts

workflows:
  - github-release-install-fetch.yaml

dependencies: []

additionalFiles:
  - README.md
  - LICENSE.txt
  - github_release_test.ts
  - github_release_install_methods_test.ts

platforms: []
