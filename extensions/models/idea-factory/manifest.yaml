manifestVersion: 1
name: "@svendowideit/idea-factory"
version: "2026.09.07.1"
description: >
  An idea factory that captures raw thoughts, classifies them, and routes them
  into common ideas or todos. Phase 0: capture -> classify -> route, with an
  optional LLM classifier and a kanban board renderer. All data lives in swamp
  model data resources (inbox, classification, ideas, todos).

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - idea_factory.ts

reports:
  - idea_factory_report.ts

additionalFiles:
  - scripts/capture-server.ts
  - README.md
  - LICENSE.txt

platforms: []
