paths:
  base: manifest
models:
  - obsidian_factory.ts
  - obsidian_agent.ts
skills:
  - obsidian-factory
dependencies:
  - "@magistr/obsidian-vault"
  - "@swamp/stagecraft"
workflows:
  - workflows/obsidian-factory-tick.yaml
  - workflows/obsidian-factory-archive.yaml
  - workflows/obsidian-factory-unarchive.yaml
reports:
  - obsidian_factory_tick_report.ts
additionalFiles:
  - README.md
  - LICENSE.txt
  - obsidian_factory_test.ts
  - assets/board.base.yaml
  - assets/board.md
  - assets/archive.base.yaml
  - assets/archive.md
  - assets/guide.md
  - assets/card-template.md
  - assets/category-template.md
  - assets/action-template.md
  - obsidian-plugin/main.js.sha256.txt
  - obsidian-plugin/manifest.json
  - obsidian-plugin/styles.css.txt
  - obsidian-plugin/main.ts
  - obsidian-plugin/model.ts
  - obsidian-plugin/build.ts
  - obsidian-plugin/model_test.ts
  - obsidian-plugin/obsidian.d.ts
binaries:
  - obsidian-plugin/main.js
platforms: []
