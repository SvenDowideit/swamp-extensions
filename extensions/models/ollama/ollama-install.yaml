id: 2b656abc-0076-47fd-9a86-ef89d16e853a
name: '@svendowideit/ollama-install'
description: |
  Install or upgrade Ollama on this machine — the whole loop in one idempotent
  run, elevated through the @svendowideit/sudo ladder.

  Stages (install): plan → privilege → sync → resolve → assess → download →
  stage → place-binary → create-user → stage-service → place-service →
  daemon-reload → enable → restart → verify. (uninstall): plan → privilege →
  sync → remove-service → uninstall → verify.

  plan resolves this machine's OS/architecture and accelerator (NVIDIA CUDA,
  AMD ROCm, Jetson, or the base build), the exact release asset name to fetch,
  and the service scope. manageService is tri-state: `auto` (default)
  maintains the systemd service only when a unit already exists (a server) and
  upgrades the binary only otherwise (a client machine); `true` always
  creates/updates the service; `false` never touches units. privilege reports
  what the @svendowideit/sudo model can elevate with; its ladder (sudo, doas,
  polkit/run0, pkexec, containers, ssh, …) replaces ad-hoc sudo probing. sync
  reads the installed `ollama --version`. resolve calls
  @svendowideit/github-release-install to read the newest Ollama release and
  the asset's expected SHA-256 from its sha256sum.txt, and assess compares the
  two. download fetches the checksum-verified archive only when an update is
  actually needed (or force is set), so a current machine does not
  re-download a multi-gigabyte release. stage verifies and extracts the
  archive into an unprivileged staging dir. The privileged placement steps
  run @svendowideit/sudo's named operations through the elevation ladder:
  ensureDirectory (install/lib dirs), installFile (binary + lib tree + the
  staged unit/drop-in), createUser (the unprivileged run-as user),
  daemonReload, and manageService (enable + start/restart). Every
  @svendowideit/sudo-run step needs its operation allowlisted on the sudo
  model with `--global-arg allowedOperations=…` (see the manifest RUN
  section); a run without them fails that step with the ladder report. verify
  prints the installed version, the binary path and the exact
  `systemctl status` command.

  Run it on any Linux host to make Ollama present, current, configured and
  (server machines) always-on as a service:

      swamp workflow run @svendowideit/ollama-install

  Pin a version, put the models on a big disk, and expose the API on the LAN:

      swamp workflow run @svendowideit/ollama-install \
        --input version=0.35.0 \
        --input host=0.0.0.0:11434 \
        --input environment='OLLAMA_MODELS=/mnt/models'

  Upgrade the binary only (a client machine — never touch units):

      swamp workflow run @svendowideit/ollama-install \
        --input manageService=false

  Force the service to exist (a fresh server):

      swamp workflow run @svendowideit/ollama-install --input manageService=true

  Alternative installer: run the official install.sh as root through the
  elevation ladder instead of the checksummed release flow (downloaded to
  staging and executed via sudo's runScript op):

      swamp workflow run @svendowideit/ollama-install --input installScript=true

  The workflow auto-registers the `ollama`, `github-release` and
  `sudo-ollama` model instances on first run; nothing needs creating by hand.
  The daily trigger upgrades the binary (and the service where one exists) as
  new releases appear; remove `trigger:` if you would rather upgrade by hand.
tags: {}
trigger:
  schedule: "0 4 * * *"
  inputs:
    manageService: auto
inputs:
  properties:
    repo:
      type: string
      default: ollama/ollama
      description: GitHub repository (owner/name) publishing the Ollama releases.
    version:
      type: string
      default: ""
      description: >-
        Release to install (e.g. 0.35.0 or v0.35.0). Empty installs the latest.
    os:
      type: string
      default: ""
      description: Override the detected OS token (Linux). Empty probes the host.
    arch:
      type: string
      default: ""
      description: >-
        Override the detected architecture token (x86_64, arm64). Empty probes
        the host.
    accel:
      type: string
      enum:
        - auto
        - base
        - rocm
        - mlx
        - jetpack5
        - jetpack6
      default: auto
      description: >-
        Build variant: auto detects Jetson/ROCm, else base (which bundles CUDA
        on Linux/amd64). rocm adds AMD GPU support; jetpack5/jetpack6 are the
        NVIDIA Jetson (arm64) builds.
    githubToken:
      type: string
      default: ""
      description: >-
        GitHub token to raise the releases API rate limit. Empty falls back to
        GITHUB_TOKEN / GH_TOKEN, then the authenticated `gh` CLI.
    downloadDir:
      type: string
      default: ~/.cache/ollama
      description: >-
        Directory the checksum-verified release archive is staged in before
        install extracts it.
    installDir:
      type: string
      default: ""
      description: >-
        Directory to install the ollama binary into. Empty picks /usr/local/bin
        for system scope or ~/.local/bin for user scope.
    force:
      type: boolean
      default: false
      description: >-
        Reinstall even when the target version is already installed, and rewrite
        the unit/drop-in even when it already matches.
    manageService:
      type: string
      enum:
        - auto
        - "true"
        - "false"
      default: auto
      description: >-
        auto (default) maintains the systemd service only when a unit already
        exists (a server) and upgrades the binary only otherwise (a client
        machine). "true" always creates/updates the service. "false" never
        touches units.
    uninstall:
      type: boolean
      default: false
      description: >-
        Remove the ollama binary and lib instead of installing. With
        purgeService=true the systemd service is removed too.
    purgeService:
      type: boolean
      default: false
      description: >-
        On an uninstall run, also remove the systemd unit and drop-in (rather
        than leaving them in place).
    serviceName:
      type: string
      default: ollama
      description: systemd service name (without the .service suffix).
    serviceScope:
      type: string
      enum:
        - auto
        - system
        - user
      default: auto
      description: >-
        systemd scope: system (needs root/sudo), user (no root), or auto to use
        the existing service when one is found, else system.
    unitDir:
      type: string
      default: ""
      description: >-
        Override the directory unit files are written to. Empty uses
        /etc/systemd/system (system) or ~/.config/systemd/user (user).
    serviceUser:
      type: string
      default: ollama
      description: Run-as user for a system service (created if missing).
    serviceGroup:
      type: string
      default: ollama
      description: Run-as group for a system service (created if missing).
    host:
      type: string
      default: ""
      description: >-
        Value for OLLAMA_HOST (e.g. 127.0.0.1:11434 or 0.0.0.0:11434). Empty
        leaves the service default untouched.
    environment:
      type: array
      items:
        type: string
      default: []
      description: >-
        Extra Environment= lines as KEY=VALUE (e.g. OLLAMA_MODELS=/mnt/models),
        one per array item.
    extraArgs:
      type: string
      default: ""
      description: >-
        Extra arguments appended to `ollama serve` in ExecStart (e.g.
        --flash-attention).
    restart:
      type: string
      default: always
      description: systemd Restart= policy.
    restartSec:
      type: string
      default: "3"
      description: systemd RestartSec= delay.
    installScript:
      type: boolean
      default: false
      description: >-
        Install/upgrade via Ollama's official install.sh (downloaded from the
        release tag and run as root through the sudo elevation ladder) instead
        of the checksum-verified release archive. Needs the runScript sudo
        operation allowlisted.
    installScriptUrl:
      type: string
      default: https://ollama.com/install.sh
      description: >-
        Download URL for the official installer script used when installScript
        is true.
    sudoInstanceKey:
      type: string
      default: default
      description: >-
        Instance key of the @svendowideit/sudo model the workflow elevates
        through (model name sudo-<instanceKey>).
    sudoAllowedOperations:
      type: array
      items:
        type: string
      default:
        - installPackage
        - removePackage
        - manageService
        - ensureDirectory
        - createUser
        - installFile
        - daemonReload
        - removePath
        - copyDirectory
      description: >-
        Operation allowlist passed to the sudo model for every privileged step
        of this run (merged into the model's own allowlist). The default
        covers the standard install flow; add runScript when running with
        installScript=true.
  required: []
jobs:
  - name: main
    description: >-
      Plan the platform, read the installed version, resolve the latest
      release, download and stage only when an update is needed, place the
      staged tree through the elevation ladder, then create/configure/restart
      the systemd service when manageService says so.
    steps:
      - name: plan
        description: >-
          Resolve this machine's OS/arch/accelerator, the exact release asset
          name to fetch, the install/lib paths, the systemd service scope, and
          the tri-state manageService decision. Runs first so every later step
          uses one consistent plan. It is the only writer of the `plan`
          resource.
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: plan
          inputs:
            os: ${{ inputs.os }}
            arch: ${{ inputs.arch }}
            accel: ${{ inputs.accel }}
            serviceScope: ${{ inputs.serviceScope }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: privilege
        description: >-
          Report the @svendowideit/sudo ladder for this host (route proven,
          mode). Informational: the placement steps run the ladder themselves,
          and a no-route run fails there with the full report.
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: privilege
        dependsOn:
          - step: plan
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: sync
        description: >-
          Read the installed `ollama --version` so `assess` can decide whether
          an update is needed. Skipped on an uninstall or installScript run
          (script mode has no release download to assess; it runs install.sh
          and install.sh decides). The dedicated `resolve` step owns the
          release check on workflow runs, so sync runs offline here
          (checkLatest=false). It is the only writer of the `installed`
          resource before install.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == true }}
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: sync
          inputs:
            checkLatest: false
        dependsOn:
          - step: privilege
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: resolve
        description: >-
          Read the latest Ollama release (or the pinned version), match the
          exact asset plan selected, and record its expected SHA-256 from the
          release's sha256sum.txt. Skipped on an uninstall or installScript
          run. It is the only writer of the `release` resource.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == true }}
        task:
          type: model_method
          modelType: "@svendowideit/github-release-install"
          modelName: github-release
          methodName: check
          globalArgs:
            repo: ${{ inputs.repo }}
            githubToken: ${{ inputs.githubToken }}
            checksumsName: sha256sum.txt
          inputs:
            version: ${{ inputs.version }}
            stem: ${{ steps.plan.outputs.stem }}
            pattern: ${{ steps.plan.outputs.assetPattern }}
            os: ${{ steps.plan.outputs.os }}
            arch: ${{ steps.plan.outputs.arch }}
        dependsOn:
          - step: sync
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assess
        description: >-
          Compare the installed version with the resolved latest release and
          record whether an update is available. Skipped on an uninstall or
          installScript run. It is the only writer of the `assessment`
          resource, which gates the download and stage steps.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == true }}
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: assess
          inputs:
            latestVersion: ${{ steps.resolve.outputs.version }}
        dependsOn:
          - step: resolve
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: download
        description: >-
          Download the resolved archive and verify its SHA-256. Only runs when
          an update is actually available (or force is set), so a machine that
          is already current does not re-download a multi-gigabyte release. It
          is the only writer of the `archive` resource.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == true || inputs.force == false
          && steps.assess.outputs.?updateAvailable.orValue(true) == false }}
        task:
          type: model_method
          modelType: "@svendowideit/github-release-install"
          modelName: github-release
          methodName: download
          globalArgs:
            repo: ${{ inputs.repo }}
            githubToken: ${{ inputs.githubToken }}
            checksumsName: sha256sum.txt
          inputs:
            outputDir: ${{ inputs.downloadDir }}
            force: ${{ inputs.force }}
            stem: ${{ steps.plan.outputs.stem }}
            pattern: ${{ steps.plan.outputs.assetPattern }}
            assetName: ${{ steps.resolve.outputs.?platform.?archiveName.orValue("") }}
            downloadUrl: ${{ steps.resolve.outputs.?platform.?downloadUrl.orValue("") }}
            releaseVersion: ${{ steps.resolve.outputs.version }}
            checksum: ${{ steps.resolve.outputs.?checksum.orValue("") }}
        dependsOn:
          - step: assess
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: stage
        description: >-
          Verify the archive's SHA-256 again (defence in depth) and extract it
          into an unprivileged staging directory — bin/, lib/ollama/ and (from
          prepareService, later) the rendered unit files. Runs only when an
          update was needed (or force is set). It is the only writer of the
          `stage` resource.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == true
          || (inputs.force == false
          && steps.assess.outputs.?updateAvailable.orValue(true) == false) }}
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: stage
          inputs:
            version: ${{ steps.resolve.outputs.?version.orValue(inputs.version) }}
            archivePath: ${{ steps.download.outputs.?path.orValue("") }}
            archiveName: ${{ steps.download.outputs.?archiveName.orValue("") }}
            checksum: ${{ steps.download.outputs.?checksum.orValue("") }}
        dependsOn:
          - step: download
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: place-binary
        description: >-
          Place the staged binary into the install directory as root, through
          the elevation ladder. install -D -m creates the parent directories,
          so no separate mkdir step is needed. Only runs when an update was
          staged.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == true
          || (inputs.force == false
          && steps.assess.outputs.?updateAvailable.orValue(true) == false) }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: installFile
            args:json: >-
              {"src": "${{ steps.stage.outputs.?binaryPath.orValue("") }}",
              "dest": "${{ steps.plan.outputs.?installDir.orValue("") }}/ollama",
              "mode": "0755"}
        dependsOn:
          - step: stage
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: place-lib
        description: >-
          Place the staged lib/ollama runtime next to the binary as root:
          create the target directory, then copy the staged tree over it.
          Skipped when the archive carried no runtime directory (then the
          binary alone suffices). Runs only when an update was staged.
        guard: >-
          ${{ inputs.uninstall == true
          || inputs.installScript == true
          || (inputs.force == false
          && steps.assess.outputs.?updateAvailable.orValue(true) == false)
          || steps.stage.outputs.?libDir.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: copyDirectory
            args:json: >-
              {"src": "${{ steps.stage.outputs.?libDir.orValue("") }}",
              "dest": "${{ steps.plan.outputs.?libDir.orValue("") }}"}
        dependsOn:
          - step: place-binary
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: create-user
        description: >-
          Create the unprivileged run-as user for the system service when it
          does not exist yet. Idempotent. Runs only on a manageService run
          whose scope is system.
        guard: >-
          ${{ inputs.uninstall == true
          || steps.plan.outputs.?manageService.orValue(false) == false
          || inputs.installScript == true
          || steps.plan.outputs.?serviceStatusCommand.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: createUser
            args:json: >-
              {"user": "${{ inputs.serviceUser }}",
              "comment": "Ollama service user"}
        dependsOn:
          - step: place-binary
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: stage-service
        description: >-
          Render the systemd unit (when none exists) and drop-in with the
          configured service settings into the staging tree. Only runs when
          manageService resolved true (an existing unit, or forced).
        guard: >-
          ${{ inputs.uninstall == true
          || steps.plan.outputs.?manageService.orValue(false) == false
          || inputs.installScript == true
          || steps.plan.outputs.?serviceStatusCommand.orValue("") == "" }}
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: prepareService
          inputs:
            serviceName: ${{ inputs.serviceName }}
            serviceScope: ${{ inputs.serviceScope }}
            host: ${{ inputs.host }}
            environment: ${{ inputs.environment }}
            extraArgs: ${{ inputs.extraArgs }}
            restart: ${{ inputs.restart }}
            restartSec: ${{ inputs.restartSec }}
        dependsOn:
          - step: place-lib
            condition:
              type: always
          - step: create-user
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: place-service
        description: >-
          Place the staged unit (when one was rendered) as root into the unit
          dir, and the drop-in next to it. install -D -m creates the .d
          directory. The drop-in step is allowed to fail when only the
          drop-in's parent dir is root-owned and the place ran already; in
          practice both runs go through one ladder resolution.
        guard: >-
          ${{ inputs.uninstall == true
          || steps.plan.outputs.?manageService.orValue(false) == false
          || inputs.installScript == true
          || steps.plan.outputs.?serviceStatusCommand.orValue("") == ""
          || steps["stage-service"].outputs.?unitStagedPath.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: installFile
            args:json: >-
              {"src": "${{ steps["stage-service"].outputs.?unitStagedPath.orValue("") }}",
              "dest": "${{ steps["stage-service"].outputs.?unitPath.orValue("") }}",
              "mode": "0644"}
        dependsOn:
          - step: stage-service
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: place-dropin
        description: >-
          Place the staged drop-in override as root into the unit's .d
          directory. Skipped when no unit is managed.
        guard: >-
          ${{ inputs.uninstall == true
          || steps.plan.outputs.?manageService.orValue(false) == false
          || inputs.installScript == true
          || steps.plan.outputs.?serviceStatusCommand.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: installFile
            args:json: >-
              {"src": "${{ steps["stage-service"].outputs.?dropInStagedPath.orValue("") }}",
              "dest": "${{ steps["stage-service"].outputs.?dropInPath.orValue("") }}",
              "mode": "0644"}
        dependsOn:
          - step: place-service
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: daemon-reload
        description: >-
          Tell systemd to re-read its unit files after placing the unit/drop-in
          as root. Skipped when no unit is managed.
        guard: >-
          ${{ inputs.uninstall == true
          || steps.plan.outputs.?manageService.orValue(false) == false
          || inputs.installScript == true
          || steps.plan.outputs.?serviceStatusCommand.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: daemonReload
            args:json: "{}"
        dependsOn:
          - step: place-dropin
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: fetch-script
        description: >-
          Download Ollama's official install.sh into the download directory
          and record its SHA-256. Only runs on an installScript=true run;
          the standard flow instead resolves and verifies a checksummed
          release archive.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == false }}
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: fetchScript
          inputs:
            url: ${{ inputs.installScriptUrl }}
            downloadDir: ${{ inputs.downloadDir }}
        dependsOn:
          - step: privilege
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: run-script
        description: >-
          Execute the downloaded install.sh as root through the elevation
          ladder (sudo's runScript operation — appended to the allowlist for
          this call). install.sh performs its own internal downloads as root
          inside the winning route's container, so the container route needs
          network access: this step sets containerNetwork=host deliberately
          (upstream-parity mode; the checksummed release flow avoids this
          entirely — prefer it). CAUTION: install.sh pipes its download
          through tar without checksum verification; verify the script's
          recorded SHA-256 before trusting a scheduled run of this mode.
        guard: >-
          ${{ inputs.uninstall == true || inputs.installScript == false }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations:json: >-
              ${{ inputs.sudoAllowedOperations + ["runScript"] }}
            containerNetwork: host
            operation: runScript
            args:json: >-
              {"script": "${{ steps["fetch-script"].outputs.?scriptPath.orValue("") }}",
              "args": []}
        dependsOn:
          - step: fetch-script
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: enable-restart
        description: >-
          Enable the service (starts at boot) and restart it so the running
          daemon is the newly placed binary with the new configuration. For
          install.sh runs this is the only service step: install.sh may have
          set the unit up already, and this brings it live through the same
          ladder. Runs on manageService runs, and always on installScript runs
          that left a unit in place.
        guard: >-
          ${{ inputs.uninstall == true
          || (steps.plan.outputs.?manageService.orValue(false) == false
          && inputs.installScript == false)
          || steps.plan.outputs.?serviceStatusCommand.orValue("") == "" }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: manageService
            args:json: >-
              {"unit": "${{ inputs.serviceName }}",
              "action": "${{ steps.plan.outputs.?serviceScope.orValue("system") == "user" ? "restart" : "restart" }}"}
        dependsOn:
          - step: daemon-reload
            condition:
              type: always
          - step: run-script
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: uninstall-step
        description: >-
          Remove the ollama binary and its runtime as root through the ladder.
          Idempotent: a missing binary is a no-op. With purgeService=true the
          systemd service is removed too. Only runs when uninstall=true.
        guard: ${{ inputs.uninstall == false }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: removePath
            args:json: >-
              {"path": "${{ data.latest("ollama", "installed").?attributes.?path.orValue("/usr/local/bin/ollama") }}"}
        dependsOn:
          - step: plan
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: purge-service
        description: >-
          On an uninstall run with purgeService=true: stop and remove the
          systemd unit and drop-in via the manageService/removePath ladder
          operations, then daemon-reload. Only runs when uninstall=true and
          purgeService=true.
        guard: ${{ inputs.uninstall == false || inputs.purgeService == false }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/sudo-run"
          inputs:
            instanceKey: ${{ inputs.sudoInstanceKey }}
            allowedOperations: ${{ inputs.sudoAllowedOperations }}
            operation: manageService
            args:json: >-
              {"unit": "${{ inputs.serviceName }}", "action": "stop"}
        dependsOn:
          - step: uninstall-step
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: verify
        description: >-
          Print the installed version, the binary path and the exact
          `systemctl status` command for the service, so the run log ends with
          what is now on the machine, where it is and how to check it.
        task:
          type: model_method
          modelType: "@svendowideit/ollama"
          modelName: ollama
          methodName: print
          inputs:
            serviceName: ${{ inputs.serviceName }}
            serviceScope: ${{ inputs.serviceScope }}
        dependsOn:
          - step: sync
            condition:
              type: always
          - step: place-binary
            condition:
              type: always
          - step: uninstall-step
            condition:
              type: always
          - step: enable-restart
            condition:
              type: always
        weight: 0
        allowFailure: false
version: 1