manifestVersion: 1
name: "@svendowideit/sudo"
version: "2026.10.04.2"
description: >
  Run one privileged operation on the host — install a package, restart a
  system service, set a sysctl — from any workflow, without writing sudo logic
  and without assuming sudo is installed.

  WHAT IT DOES

    A cross-distro Linux elevation primitive for swamp. You name the operation and
    its arguments; the extension finds the first route the host has already
    granted — sudo, doas, polkit/run0, a container runtime you are in, an ssh
    root key, a held capability, or a cloud agent — and uses it. You never need
    to know which: it returns the exit code, output, and uid, and keeps the
    route invisible unless you ask for an audit. Nothing is brute-forced; if no
    route is granted it fails cleanly, listing what it tried. Arbitrary
    commands are a separate, approval-gated workflow, so the everyday path (a
    named operation) is safe to automate. Prefer it over ad-hoc `sudo` steps:
    it works without sudo, never hangs on a prompt, and records how it elevated.

  INSTALL

      swamp extension pull @svendowideit/sudo

  DEPENDENCIES

    None required. The extension is self-contained. The out-of-band `ssm-run`
    route is a placeholder: it is never selectable by the built-in argv
    executor (it is documented as always-unavailable), and no `@swamp/aws/ssm`
    dependency is assumed or installed.

  RUN

      # Restart a system service by name. The workflow picks whichever route
      # this host already grants and runs systemctl restart for you — you never
      # mention sudo or the mechanism.
      swamp workflow run @svendowideit/sudo-run \
        --input operation=manageService \
        --input 'args:json={"unit":"caddy","action":"restart"}'

      # Install a package with this host's package manager. One named operation,
      # typed arguments, no shell string to get wrong.
      swamp workflow run @svendowideit/sudo-run \
        --input operation=installPackage \
        --input 'args:json={"manager":"apt","packages":["caddy"]}'

      # Read-only: list every elevation route this host offers and how it was
      # proved. Use it to see what a scheduled workflow will pick before you
      # trust it. (It runs no target command; a container route may briefly
      # start a container to prove itself.)
      swamp model @svendowideit/sudo method run probe sudo-default

      # When no named operation fits, ask for an arbitrary command. This path is
      # off unless the model is created with allowArbitrary=true, and it always
      # pauses for a human approval showing the exact argv before running.
      swamp workflow run @svendowideit/sudo-command \
        --input 'command:json=["id","-u"]' \
        --input reason="verify elevation works end to end"

      # Audit only: the same read-only probe, plus a hardening report (container
      # group membership, over-permissive sudoers, writable root-owned files,
      # polkit/LXD surfaces). This is the one time the mechanism is spelled out
      # for you.
      swamp model @svendowideit/sudo method run probe sudo-default \
        --input allowAudit=true

  CONFIGURE

    Callers name an operation and pass typed args. Enabled by default (the
    narrow, idempotent set):

      installPackage    manager (apt|dnf|yum|zypper|apk|pacman), packages[]
      removePackage     manager, packages[]
      manageService     unit, action (start|stop|restart|enable|disable)

    Also available, but disabled by default because they mutate the filesystem,
    account state, kernel knobs, or run arbitrary code as root — add them to
    `allowedOperations` to enable:

      sysctl            key, value
      ensureDirectory   path, mode, owner, group
      chown             path, owner, group, recursive
      addUserToGroup    user, group
      createUser        user, comment, group, groups
      mount             source, target, fstype, options
      installFile       src, dest, mode (install -D -m)
      daemonReload      (none) — systemctl daemon-reload
      removePath        path (rm -rf, refuses /)
      copyDirectory     src, dest (cp -a, refuses /)
      runScript         script (absolute), args[] — runs a script as root

    Every @svendowideit/sudo-run call also takes `strategy` (pin one route
    instead of auto), `instanceKey` (give concurrent callers their own model
    instance, e.g. instanceKey="${{ run.id }}"), `timeoutSeconds` (default
    120), and `allowedOperations` (extra operations permitted for this call,
    merged into the model's own allowlist — so a bare instance can execute an
    opt-in operation without a prior `swamp model create`); an empty model
    allowlist falls back to the narrow default set. The
    @svendowideit/sudo-command workflow takes `command` (an argv array),
    `reason`, and `instanceKey`.

    Model globals (set with `swamp model create ... --global-arg`, or as model
    attributes), all optional:

      strategyOrder        Routes to try, in order         (default: side-effect-ordered)
      allowedOperations    Operations run may execute      (default: the narrow set above)
      allowArbitrary       Enable the gated command path   (default false)
      sshHost              Host for the ssh-root route     (default "" = disabled)
      sshKnownHosts        Pinned host key for ssh-root    (default "")
      containerImage       Digest-pinned image for the      (default: a pinned alpine digest)
                           container routes
      containerNetwork     Network mode for scratch         (default "none")
                           containers
      k8sNode              Node for the k8s-node route     (default "" = disabled)
      ssmInstanceId        Target for the SSM route        (default "" = disabled)
      timeoutSeconds       Per-execution timeout           (default 120)
      probeTimeoutSeconds  Per-route proof timeout         (default 8)
      allowAudit           Emit the hardening findings     (default false)
      approvalVault        Vault for the run-scoped,       (default "sudo-approval")
                            single-use approval secret;
                            create it before the first
                            gated run: swamp vault create
                            local_encryption sudo-approval.
                            The approval token is passed as
                            a method argument and is
                            recorded in plaintext in run
                            history; single use is
                            guaranteed for completed runs
                            only — after a run is killed
                            mid-execution the approved
                            command stays replayable until
                            the vault secret is deleted.

    Container routes are disabled when DOCKER_HOST/CONTAINER_HOST names a remote
    daemon, so a local operation never runs on another host. The reverse also
    holds and is worth knowing: non-local operations (installPackage,
    removePackage, manageService, sysctl) execute on whatever host the winning
    route elevates — with sshHost configured, manageService restarts the unit on
    that ssh host, not on your machine. Leave sshHost/k8sNode unset or pin
    strategy to a local route to keep execution local.

    Read the full method, strategy and operation reference in the README.

  WHAT IT INSTALLS

    Nothing on the host — no service, no webhook, no cron trigger. It only runs
    the operation you name, through a route the host already grants. The
    container and Kubernetes routes start a transient container/pod that is
    removed in the same call; the out-of-band route sends the command to the
    agent you configured. The recommended production setup — a root agent that
    enforces its own allowlist — is an operator choice documented in the README,
    not something this extension installs.

repository: https://github.com/svendowideit/swamp-extensions

