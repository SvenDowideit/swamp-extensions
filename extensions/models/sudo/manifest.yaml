paths:
  base: manifest

models:
  - sudo.ts
  - sudo_strategies.ts
  - sudo_operations.ts

workflows:
  - sudo-run.yaml
  - sudo-command.yaml

dependencies: []

additionalFiles:
  - README.md
  - LICENSE.txt
  - sudo_test.ts
  - sudo_strategies_test.ts
  - sudo_operations_test.ts

platforms:
  - linux-x86_64
  - linux-aarch64
