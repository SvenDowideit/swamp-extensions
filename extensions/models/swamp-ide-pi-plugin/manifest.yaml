models:
  - swamp_ide_pi_plugin.ts

binaries:
  - pi/swamp-ide.ts
  - pi/swamp-ide-guard.ts
  - pi/swamp-ide-policy.ts
  - pi/swamp-ide-lock.ts

dependencies: []

additionalFiles:
  - README.md
  - LICENSE.txt
  - swamp_ide_pi_plugin_test.ts
  - swamp_ide_policy_test.ts
  - swamp_ide_lock_test.ts

platforms: []

labels:
  - swamp-ide
  - pi
  - plugin
  - routing
