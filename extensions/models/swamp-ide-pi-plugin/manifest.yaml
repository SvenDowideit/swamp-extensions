manifestVersion: 1
name: "@svendowideit/swamp-ide-pi-plugin"
version: "2026.11.29.1"
description: >
  Install, enable and disable the pi addin that routes tool calls through
  @svendowideit/swamp-ide, and record every routed and bypassed call.

  WHAT IT DOES

    Owns the pi addin as a managed file. It bundles the addin source, writes it
    into a project (`<project>/.pi/extensions/swamp-ide.ts`) or the global pi
    agent directory (`~/.pi/agent/extensions/swamp-ide.ts`), refuses to
    overwrite or remove a file that is not marked as managed, and gates the
    addin per pi session with a marker. It also writes a small **global
    guard**: when the session is enabled, the guard makes `swamp_ide` the only
    active pi tool while it is registered. If the addin did not register
    `swamp_ide`, the guard restores the baseline tools, records `enforced:false`
    with a reason, and the Herdr panel shows "tracking off" — a missing tracker
    degrades visibly instead of locking the person out. The addin exposes
    `swamp_ide` for herdr-core, vim and arbitrary `system=swamp` model methods,
    runs methods through the warm `swamp serve` WebSocket (one connection per
    session; CLI fallback only when serve is unreachable), records routed and
    bypassed tool calls as OTLP spans and JSONL activity events, and keeps a
    per-program histogram of the bash commands that still bypass the IDE.
    Every `swamp_ide` result starts with a deterministic Authorization line
    generated by the addin (read-only, existing lease, approved dialog, or
    blocked/denied/timeout/unavailable); the same structured fields are
    recorded in activity events and OTLP spans. Each pi session drives its own
    model instances, named `<behaviour>-pi-<terminal>-<session>` (for example
    `herdr-core-pi-t2g-01a20665`), created against the running serve the first
    time a session needs them: swamp's lock is per instance, so a session never
    queues behind a schedule or another session. The instance name is in every
    activity event, so `swamp run doctor` and the log agree on who held what.
    Each event also records what the call attempted (`attempt`), the behaviour
    type, the Herdr space/tab/terminal it came from, and - on a lock timeout -
    the contended instance and the pid named as its holder. Text file writes are routed
    through the space's editor buffer: `system=herdr-core
    method=file-write|file-edit|file-edit-lines` becomes one `editFile` call on
    the vim-controller model, so the buffer the person is watching is what
    changed the file. Binary content, binary file types and remote machines stay
    on herdr-core, and every fallback records why. Each activity event also says
    `via`: `ws` when the call went over the `swamp serve` socket, `cli` when it
    had to spawn a `swamp` process, or the route it took instead; `/swamp-ide
    log` prints one line per event and a `ws`-versus-`cli` summary. The addin's prompt tells the
    assistant to quote that line verbatim instead of inventing an explanation.
    `@svendowideit/swamp-ide` calls `set` so one command enables or disables
    the whole system.

    A capability policy gates the addin itself. Protected paths (the addin,
    guard, policy, session markers, Herdr mods/layouts, swamp-ide state and the
    swamp-ide extension sources) and mutating methods cannot be changed by the
    agent without a human-created lease. The human runs
    `/swamp-ide approve <scope> [minutes]` in pi; the agent cannot create the
    lease. Read-only calls are allowed; everything else fails closed. The
    Herdr dialog also offers **Grant directory** for an exact file or
    protected-file request; it writes a `dir:<absolute directory>` lease
    covering every file below that directory. Protected directories are
    available and carry HIGH risk; the filesystem root is not.

  INSTALL

      swamp extension pull @svendowideit/swamp-ide-pi-plugin

  DEPENDENCIES

    pi on PATH (or a `~/.pi/agent` install). The addin imports `typebox` from
    pi itself. No other swamp extension is required; `@svendowideit/swamp-ide`
    is the front door that installs this one when pi is available.

  RUN

      # Install the managed addin globally (so project trust cannot leave it
      # unloaded) and write the fail-closed guard.
      swamp model @svendowideit/swamp-ide-pi-plugin method run install ide-pi \
        --input scope=global

      # Enable it for the current pi session (PI_SESSION_ID), then restart pi.
      swamp model @svendowideit/swamp-ide-pi-plugin method run set ide-pi \
        --input enabled=true --input scope=global \
        --input sessionId="$PI_SESSION_ID"

      # Disable it for every session without removing the file.
      swamp model @svendowideit/swamp-ide-pi-plugin method run set ide-pi \
        --input enabled=false

      # Report the install path, pi availability and enabled sessions.
      swamp model @svendowideit/swamp-ide-pi-plugin method run status ide-pi

    In pi, `/swamp-ide` shows the mode, serve connection and the top shell-outs;
    `/swamp-ide histogram` shows the top 20, which is the build-priority list.
    `/swamp-ide approve <scope> [minutes]` creates a human-only lease;
    `/swamp-ide revoke` removes it; `/swamp-ide lease` shows it.

  CONFIGURE

    Global arguments:

      piBin         pi executable                         (pi)
      scope         project or global                     (project)
      projectDir    project root for project scope        (current directory)
      force         overwrite/remove an unmanaged file    (false)

    `set` takes `enabled` and optional `sessionId` (empty discovers the newest
    live pi session; explicit values target a specific session). `install` and
    `uninstall` take optional `scope` and `force` overrides.

    The addin reads these environment variables:

      SWAMP_IDE_MODE                  off | advise | enforce   (enforce)
      SWAMP_IDE_SERVE                 off disables the serve fast path
      SWAMP_SERVE_URL                 serve endpoint (ws://127.0.0.1:9090)
      SWAMP_AGENT_IDE_SHELLOUT_LOG    shell-out histogram JSONL
                                      (~/.local/state/swamp-agent-ide/shellouts.jsonl)
      SWAMP_AGENT_IDE_LEASE           human approval lease
                                      (~/.local/state/swamp-agent-ide/lease.json)

  WHAT IT INSTALLS

    One managed addin file, one global guard file, one policy file, one approval
    lock file, plus one marker per enabled session:
    `~/.pi/agent/extensions/swamp-ide.ts` +
    `~/.pi/agent/extensions/swamp-ide-guard.ts` +
    `~/.pi/agent/extensions/swamp-ide-policy.ts` +
    `~/.pi/agent/extensions/swamp-ide-lock.ts` +
    `~/.pi/agent/swamp-ide/<session>.enabled`, or the project-local files plus
    `.pi/swamp-ide/<session>.enabled`. The guard is always global so it can
    fail closed even when a project-local addin does not load. It does not edit
    pi's settings.json.

repository: 'https://github.com/svendowideit/swamp-extensions'

license: MIT

