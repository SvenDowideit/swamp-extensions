manifestVersion: 1
name: "@svendowideit/swamp-ide"
version: "2026.11.27.2"
description: >
  The single front door for the agent IDE: install, enable and disable the
  herdr-core/vim-controller routing, the pi addin and the resizable Herdr
  Swamp IDE panel with three stacked sections.

  WHAT IT DOES

    One extension pulls the pieces together and gives you one pair of commands:
    `@svendowideit/swamp-ide-enable` and `@svendowideit/swamp-ide-disable`.
    Enable installs and selects the resizable right-hand Swamp IDE panel and
    layout, installs and gates the pi addin when pi is available, ensures the
    addin's default `vim-controller` model instance exists (creating it if
    missing), and creates or updates the OpenObserve dashboard when OpenObserve
    is installed and healthy. Activity is one line per call — time, `via` (ws/cli/herdr-core/
    vim), what was called, outcome and duration — expanding to the full record
    on click, with filter chips for ws, cli, vim+herdr and errors and a header
    count of ws against cli. The panel has three independently resizable
    sections (Activity,
    Command histogram and Leases) and a component-health indicator that reads
    the addin/guard heartbeats and says all active, degraded, or tracking off.
    The histogram lists programs with counts and expands to the top 10 commands
    per program. The Leases section is human-only: click a lease to extend it
    by 5m/30m/1h or revoke it with confirmation; the agent has no route to
    those controls. Disable removes the session gate and the Herdr panel/layout
    and returns to the base layout; the OpenObserve history is left alone. The
    optional parts are declared optional, and the workflows allow them to be
    absent: the base setup still works with only herdr-core and vim-controller.
    The model also exposes `status` so you can see what is installed without
    changing it. The layout it installs also carries the swamp bar: the
    `obsidian-idea` input and the `browser-launch` button installed by
    `@svendowideit/herdr-app`, in a row beside the tab strip (or in the status
    row). A block is only placed for a mod that exists, so installing the bar
    mods later and re-running enable is enough to see them.

    When Herdr is running, the approval request opens with a plain-language
    "You are granting" summary and an explicit Target (the exact file, exact
    command, swamp method, or a loud NO specific file warning for a broad
    method grant). It then shows what the agent may do, what it may not do, a
    HIGH/MEDIUM risk explanation and how to undo it. The agent's reason/goal,
    effect and inputs follow. Approve, Deny, Explain and Copy stay pinned.
    Approved requests become named lease features whose purpose, target and
    risk appear in the Leases section on hover, with an inner scrollbar for
    long scope lists. Closing the dialog with X or Esc resolves the request as
    a fallback, so the agent immediately returns the explicit
    `/swamp-ide approve <scope> <duration>` command. Copy writes the full request to
    `~/.local/state/swamp-agent-ide/last-request.txt` and the clipboard. For an
    exact file or protected-file request the dialog also shows the parent
    directory and a **Grant directory** button; that writes a
    `dir:<absolute directory>` lease for every file below it. Protected
    directories are available and carry HIGH risk; the filesystem root is not.

  INSTALL

      swamp extension pull @svendowideit/swamp-ide

  DEPENDENCIES

    `@svendowideit/herdr-core` and `@svendowideit/vim-controller` are required;
    they are pulled with this extension. `@svendowideit/swamp-ide-pi-plugin`
    (when pi is available) and `@svendowideit/swamp-ide-openobserve` (when
    OpenObserve is installed and healthy) are optional and only used by the
    workflows. The Herdr panel needs the Herdr app; it is skipped when the app
    is not present.

  RUN

      # Enable the whole system: Herdr panel/layout, pi addin + session gate,
      # and the OpenObserve dashboard when OpenObserve is healthy. It discovers
      # the newest live pi session, so no sessionId is needed.
      swamp workflow run @svendowideit/swamp-ide-enable

      # Disable the session gate and remove the Herdr panel/layout. The
      # OpenObserve history is left alone.
      swamp workflow run @svendowideit/swamp-ide-disable

      # Inspect what is installed without changing it.
      swamp model @svendowideit/swamp-ide method run status ide

      # Ensure the addin's Vim model instance exists, creating it if needed.
      swamp model @svendowideit/swamp-ide method run ensureVim ide

  CONFIGURE

    Global arguments on the Herdr model:

      herdrBin        Herdr desktop binary                  (herdr-app)
      herdrHome       Herdr home                            (HERDR_APP_HOME or ~/.config/herdr-app)
      layout          Layout this extension installs        (swamp-ide)
      baseLayout      Layout to return to on disable        (swamp)

    `setHerdr` takes `placement` (`tabbar`, the default, or `statusbar`) and
    decides the bar from what is on disk: `mods/obsidian-idea` and
    `mods/browser-launch` exist, so their blocks are placed; they are absent,
    so the layout stays as it was and the report says which extension to
    install. It never edits another extension's files.

    The pi plugin and OpenObserve extensions have their own global arguments;
    the workflows pass the defaults.

  WHAT IT INSTALLS

    The Herdr activity mod at `<herdrHome>/mods/swamp-activity/`, the resizable
    Swamp IDE panel with Activity, Command histogram and Leases sections at
    `<herdrHome>/mods/swamp-ide/`, the approval dialog at
    `<herdrHome>/mods/swamp-ide-approval/`, the
    `<herdrHome>/layouts/swamp-ide.json` layout, and the selected layout. It
    runs the Herdr app's documented `do layout.switch` command. `setHerdr` also
    runs `herdr-app check` against all three mods before switching and fails
    without switching if any check fails.

    The layout's tab row becomes `bar`: the shipped tab strip, the idea input
    and the browser button (or, with `placement=statusbar`, the same two
    blocks appended to the status row at 32px). Only the blocks for mods that
    exist are placed - the two mods themselves are installed by
    `@svendowideit/herdr-app`'s `installExtras`, and its mods are checked with
    the same `herdr-app check` before the switch.

    Through the workflows it may also install the managed pi addin and create
    the OpenObserve dashboard. It does not edit Herdr settings, pi settings or
    OpenObserve's own data.

repository: 'https://github.com/svendowideit/swamp-extensions'

license: MIT

paths:
  base: manifest

models:
  - swamp_ide.ts

workflows:
  - enable.yaml
  - disable.yaml

binaries:
  - herdr/main.js
  - herdr/mod.json
  - herdr/swamp-ide/main.js
  - herdr/swamp-ide/mod.json
  - herdr/swamp-ide-approval/main.js
  - herdr/swamp-ide-approval/mod.json
  - herdr/layout.json

dependencies:
  - '@svendowideit/herdr-core'
  - '@svendowideit/vim-controller'

optionalDependencies:
  - '@svendowideit/swamp-ide-pi-plugin'
  - '@svendowideit/swamp-ide-openobserve'

additionalFiles:
  - README.md
  - LICENSE.txt
  - swamp_ide_test.ts

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64

labels:
  - swamp-ide
  - herdr
  - pi
  - setup
  - enable
