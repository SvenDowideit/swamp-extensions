manifestVersion: 1
name: "@svendowideit/swamp-ide"
version: "2026.11.23.1"
description: >
  The single front door for the agent IDE: install, enable and disable the
  herdr-core/vim-controller routing, the pi addin and the Herdr activity panel.

  WHAT IT DOES

    One extension pulls the pieces together and gives you one pair of commands:
    `@svendowideit/swamp-ide-enable` and `@svendowideit/swamp-ide-disable`.
    Enable installs and selects the Herdr activity panel/layout, installs and
    gates the pi addin when pi is available, and creates or updates the
    OpenObserve dashboard when OpenObserve is installed and healthy. Disable
    removes the session gate and the Herdr panel/layout and returns to the base
    layout; the OpenObserve history is left alone. The optional parts are
    declared optional, and the workflows allow them to be absent: the base
    setup still works with only herdr-core and vim-controller. The model also
    exposes `status` so you can see what is installed without changing it.

  INSTALL

      swamp extension pull @svendowideit/swamp-ide

  DEPENDENCIES

    `@svendowideit/herdr-core` and `@svendowideit/vim-controller` are required;
    they are pulled with this extension. `@svendowideit/swamp-ide-pi-plugin`
    (when pi is available) and `@svendowideit/swamp-ide-openobserve` (when
    OpenObserve is installed and healthy) are optional and only used by the
    workflows. The Herdr panel needs the Herdr app; it is skipped when the app
    is not present.

  RUN

      # Enable the whole system: Herdr panel/layout, pi addin + session gate,
      # and the OpenObserve dashboard when OpenObserve is healthy.
      swamp workflow run @svendowideit/swamp-ide-enable

      # Disable the session gate and remove the Herdr panel/layout. The
      # OpenObserve history is left alone.
      swamp workflow run @svendowideit/swamp-ide-disable

      # Inspect what is installed without changing it.
      swamp model @svendowideit/swamp-ide method run status ide

  CONFIGURE

    Global arguments on the Herdr model:

      herdrBin        Herdr desktop binary                  (herdr-app)
      herdrHome       Herdr home                            (HERDR_APP_HOME or ~/.config/herdr-app)
      layout          Layout this extension installs        (swamp-ide)
      baseLayout      Layout to return to on disable        (swamp)

    The pi plugin and OpenObserve extensions have their own global arguments;
    the workflows pass the defaults.

  WHAT IT INSTALLS

    The Herdr activity mod at `<herdrHome>/mods/swamp-activity/`, the
    `<herdrHome>/layouts/swamp-ide.json` layout, and the selected layout. It
    runs the Herdr app's documented `do layout.switch` command. Through the
    workflows it may also install the managed pi addin and create the
    OpenObserve dashboard. It does not edit Herdr settings, pi settings or
    OpenObserve's own data.

repository: 'https://github.com/svendowideit/swamp-extensions'

license: MIT

paths:
  base: manifest

models:
  - swamp_ide.ts

workflows:
  - enable.yaml
  - disable.yaml

binaries:
  - herdr/main.js
  - herdr/mod.json
  - herdr/layout.json

dependencies:
  - '@svendowideit/herdr-core'
  - '@svendowideit/vim-controller'

optionalDependencies:
  - '@svendowideit/swamp-ide-pi-plugin'
  - '@svendowideit/swamp-ide-openobserve'

additionalFiles:
  - README.md
  - LICENSE.txt
  - swamp_ide_test.ts

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64

labels:
  - swamp-ide
  - herdr
  - pi
  - setup
  - enable
