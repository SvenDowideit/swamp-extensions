manifestVersion: 1
name: "@svendowideit/swamp-serve"
version: "2026.11.08.2"
description: >
  Run a swamp repository as a long-lived, always-on `swamp serve` service —
  binary, systemd user unit, HTTPS reverse proxy, and OTLP telemetry in one
  re-runnable workflow.

  WHAT IT DOES

    Turns "keep this repo running and reachable" into one command:
    `swamp workflow run @svendowideit/swamp-serve-setup`. It creates the
    `swamp-serve` model if needed, installs the swamp binary, writes
    `.swamp/serve.yaml`, and runs `swamp serve` under a systemd *user* unit
    (via @svendowideit/systemd-service) with the **dashboard, hot-reload and
    auto-resume** enabled. To expose it at `swamp.<host>` / `dashboard.<host>`
    with TLS, it reads a @svendowideit/caddy model and adds the two routes;
    that model issues the certificates and owns the DNS. The model is
    portable: it knows no domain of its own. Every run ends by printing each
    option with the exact command that changes it.

  INSTALL

    One command installs the model, the setup workflow and its dependencies:

      swamp extension pull @svendowideit/swamp-serve

  DEPENDENCIES

    @svendowideit/systemd-service always (the unit). @svendowideit/caddy is
    needed for the public-hostname layer and must already exist and be
    configured; the setup workflow discovers it. @svendowideit/otel-settings is
    only for telemetry. The swamp binary comes from swamp's own installer.

  RUN

    Run the setup workflow first. It is idempotent and safe to re-run:

      swamp workflow run @svendowideit/swamp-serve-setup

    That creates the `swamp-serve` model on first run, starts the server, adds
    the Caddy routes, and prints the guidance. Pass
    `--input modelName=other-serve` only when the model instance has another
    name; the workflow always uses that model's own global arguments. If there
    is exactly one @svendowideit/caddy model, it is selected automatically. If
    there are several, list them and choose one:

      swamp behavior list --json \
        | jq -r '.results[] | select(.type == "@svendowideit/caddy") | .name'

      swamp model edit swamp-serve --global-arg caddyModelName=my-caddy
      swamp workflow run @svendowideit/swamp-serve-setup

    If no Caddy model exists, create and configure one, then re-run:

      swamp workflow run @svendowideit/caddy-setup
      swamp workflow run @svendowideit/swamp-serve-setup

    Change any setting by editing the model and re-running the workflow; the
    workflow reads the model's global arguments (it does not override them).
    `guidance` prints every option, its current value, the installed Caddy
    models, and the exact command for each:

      swamp model method run swamp-serve guidance
      swamp model edit swamp-serve --global-arg port=9091
      swamp workflow run @svendowideit/swamp-serve-setup

  CONFIGURE

    The workflow applies the model's global arguments. `caddyModelName` selects
    the Caddy model; leave it empty to auto-select a single installed Caddy.
    With a base domain of `fi.gy` and an A record for `x1yoga.fi.gy`, the two
    hostnames are `swamp.x1yoga.fi.gy` and `dashboard.x1yoga.fi.gy`.
    `swamp.<host>` proxies the serve **API root**; `dashboard.<host>` serves
    swamp's `/dashboard` at the host root (only `/` is rewritten, so its assets
    pass through). Common settings:

        caddyModelName     the @svendowideit/caddy model to read    (empty = auto-select)
        otelSettingsModel  the @svendowideit/otel-settings model    (empty = no telemetry)
        serviceName        systemd unit name                         (default swamp-serve)
        port               port swamp serve listens on              (default 9090)
        serviceHardening   apply PrivateTmp/ProtectSystem            (default true)
        dashboard          enable /dashboard                        (default true)
        hotReload          SIGHUP hot-reload of bundles             (default true)
        autoResume         resume runs once approvals are decided   (default true)
        authMode           none | token | oauth                     (default none)
        autoTrustedHosts   trust the derived hostnames for WebSockets (default true)

    `authMode=none` binds loopback only; going off-loopback requires TLS and
    token/oauth, which swamp serve enforces at startup. Per-run overrides:
    `version`/`force` on `installBinary`, `endpoint` on `ensureTelemetry`.

    `configure` merges into an existing `.swamp/serve.yaml` instead of
    replacing it: it rewrites only the keys this model owns (port, host,
    dashboard, hot-reload, auto-resume, trust-proxy, schedule, auth,
    trusted-hosts) and preserves every other top-level key — notably
    `webhooks` registered by other extensions and `triggers` — plus comments.
    Invalid YAML or a non-mapping root fails without overwriting the file.

    `ensureService` and `ensureTelemetry` tolerate an installed
    `@svendowideit/systemd-service` older than 2026.10.26.1: when it rejects the
    `hardening` argument, `createService` is retried without it and a warning
    says how to update. Setup keeps working; updating the dependency restores
    `serviceHardening` control.

  WHAT IT INSTALLS

    The swamp binary (only when absent; updates replace it in place), a
    systemd *user* service running `swamp serve`, a `.swamp/serve.yaml`, and
    Caddy reverse-proxy routes for the two hostnames. The A records and TLS
    subjects live on the Caddy model itself (a Caddy model reconciles only its
    own); the setup workflow adds the routes and reports any missing records.
    `remove` stops and deletes the unit and its routes but leaves the swamp
    binary and data in place. It writes swamp resources; it installs no cron
    triggers or webhooks of its own, and re-running `configure` preserves any
    webhooks or triggers that another extension has registered in the same
    `serve.yaml`.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - swamp_serve.ts

workflows:
  - swamp-serve-setup.yaml

dependencies:
  - "@svendowideit/systemd-service"
  - "@svendowideit/caddy"
  - "@svendowideit/otel-settings"

additionalFiles:
  - README.md
  - LICENSE.txt
  - swamp_serve_test.ts
  - test-factory.yaml
  - test/bind/Dockerfile.txt
  - test/bind/named.conf.txt
  - test/bind/db.example.com.txt
  - test/bind/tsig.key.txt

platforms: []
