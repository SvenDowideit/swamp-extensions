id: 17cdca53-7d64-41cf-b91c-105621fbdd60
name: "@svendowideit/swamp-serve-setup"
description: |
  Stand up a swamp repository as an always-on `swamp serve` service, in order.

  This is the primary way to configure a host. It creates the `swamp-serve`
  model on first run, reads that model's global arguments, installs or confirms
  the swamp binary, writes `.swamp/serve.yaml`, creates and starts the systemd
  user unit (dashboard, hot-reload and auto-resume enabled), reconciles the DNS
  A records and reverse-proxies the two hostnames through Caddy, applies the
  OTLP telemetry from the `@svendowideit/otel-settings` contract, and prints
  the guidance with every option and its exact update command.

  To change a setting, edit the model and re-run this workflow:

      swamp model method run swamp-serve guidance
      swamp model edit swamp-serve --global-arg port=9091
      swamp workflow run @svendowideit/swamp-serve-setup

  The model's `caddyModelName` selects the Caddy model. When it is unset, a
  single `@svendowideit/caddy` model is selected automatically; when several
  exist the workflow prints their names and the exact `swamp model edit`
  command for each. When none exists, create one and re-run:

      swamp workflow run @svendowideit/caddy-setup
      swamp workflow run @svendowideit/swamp-serve-setup

  The Caddy steps are allowed to fail so a host without Caddy still gets a
  running service; the final guidance step says exactly what to do next.

  `modelName` selects the `@svendowideit/swamp-serve` instance to configure. It
  defaults to `swamp-serve`; pass it only when the instance has another name.
inputs:
  properties:
    modelName:
      type: string
      default: swamp-serve
      description: >-
        The @svendowideit/swamp-serve model instance to configure. Defaults to
        swamp-serve; the workflow uses that model's own global arguments.
  required: []
jobs:
  - name: setup
    description: Resolve, install, configure, serve, expose, observe, guide.
    steps:
      - name: resolve
        description: >-
          Read the model's Caddy model and derive swamp.<host> and
          dashboard.<host> before anything is written. When caddyModelName is
          unset, a single installed Caddy model is selected automatically; with
          several, the step reports their names and the exact commands to pick
          one.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: resolve
        dependsOn: []
        weight: 0
        allowFailure: true

      - name: install
        description: >-
          Install the swamp binary when it is absent; a present binary is left
          untouched (use the model's updateBinary method to upgrade it).
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: installBinary
        dependsOn:
          - step: resolve
            condition:
              type: completed
        weight: 0
        allowFailure: false

      - name: configure
        description: >-
          Write .swamp/serve.yaml from the model's global arguments with the
          dashboard, hot-reload and auto-resume options, then validate it.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: configure
        dependsOn:
          - step: install
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: service
        description: >-
          Create and start the systemd user unit. This is the point the server
          actually runs; the dashboard is at /dashboard on the bound port.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: ensureService
        dependsOn:
          - step: configure
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: dns
        description: >-
          Reconcile the A records for both hostnames via the Caddy model. Allowed
          to fail so a host without a Caddy model still leaves a running service.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: ensureDns
        dependsOn:
          - step: service
            condition:
              type: succeeded
        weight: 0
        allowFailure: true

      - name: proxy
        description: >-
          Reverse-proxy both hostnames to the server through Caddy, which also
          issues their TLS certificates. Allowed to fail with the DNS step.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: ensureProxy
        dependsOn:
          - step: service
            condition:
              type: succeeded
        weight: 0
        allowFailure: true

      - name: telemetry
        description: >-
          Read the settings contract from the model's otelSettingsModel and apply
          the OTLP environment so the server's logs, metrics and traces reach the
          gateway. Skipped cleanly when no otelSettingsModel is configured.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: ensureTelemetry
          inputs:
            endpoint: ""
        dependsOn:
          - step: service
            condition:
              type: succeeded
        weight: 0
        allowFailure: true

      - name: status
        description: >-
          Report the final state: systemd active, HTTP status of both hostnames,
          the swamp version and the telemetry summary.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: status
        dependsOn:
          - step: service
            condition:
              type: completed
        weight: 0
        allowFailure: true

      - name: guidance
        description: >-
          Print every option, its current and default value, the exact
          `swamp model edit` command that changes it, and the installed Caddy
          models with the exact command that selects each one. Always runs, so a
          partial setup always ends with the next step spelled out.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-serve"
          modelName: ${{ inputs.modelName }}
          methodName: guidance
        dependsOn:
          - step: status
            condition:
              type: completed
        weight: 0
        allowFailure: true
    dependsOn: []
    weight: 0
version: 1
