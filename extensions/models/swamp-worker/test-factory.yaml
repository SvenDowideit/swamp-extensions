# Acceptance tests for @svendowideit/swamp-worker.
#
# These prove the generic worker model end to end on a systemd host: it mints an
# enrollment token to a 0600 file, renders and reconciles a systemd user unit for
# one identity, the worker enrolls on a real `swamp serve` (loopback), a placed
# workflow step dispatches to it, re-running the model is a no-op, a change is
# reconciled, a foreign worker unit is never touched, and teardown removes only
# our own namespaced artifacts.
#
# Run it on a systemd host:
#   swamp model @svendowideit/test-factory method run test tf \
#     --input manifest=extensions/models/swamp-worker/manifest.yaml \
#     --input scenario=ubuntu-systemd-standalone
#
# Network access: the swamp release download only. `swamp serve` runs on
# loopback with `--auth-mode none`, so no collective token is needed.

tests:
  - name: enrol
    confirms: >
      `mintToken` writes a 0600 enrollment token and `ensureService` renders a
      systemd user unit, enables it (with linger) and starts it, so the worker
      enrolls on a real `swamp serve` and advertises its serve/host labels; the
      token plaintext is written only to the 0600 file, never into swamp data.
    cannot: >
      must not leave the unit inactive, and must not fail to enroll.
    documents: README.md#examples
    variables:
      IDENTITY: figy
      SERVE_URL: ws://127.0.0.1:9090
      BIN: /usr/local/bin/swamp
      REPO: /work/repo
    steps:
      - name: systemd-user-manager-is-running
        run: systemctl --user is-system-running
        expect:
          stdoutContains: ["running"]
      - name: start-serve
        run: |
          cd "$REPO"
          nohup swamp serve --host 127.0.0.1 --port 9090 --auth-mode none >/tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9090/ready >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9090/ready >/dev/null && echo SERVE_READY
        expect:
          exitCode: 0
          outputContains: ["SERVE_READY"]
          outputNotContains: ["SERVE_TIMEOUT"]
        timeoutSeconds: 120
      - name: create-worker-model
        run: |
          swamp model create @svendowideit/swamp-worker worker \
            --global-arg identity=$IDENTITY \
            --global-arg swampBinPath=$BIN \
            --global-arg repoDir=$REPO
        expect:
          exitCode: 0
          outputNotContains: ["error"]
      - name: mint-token
        run: swamp model method run worker mintToken --input duration=1h
        expect:
          exitCode: 0
          outputContains: ["figy-"]
          outputNotContains: ["panic", "failed"]
        timeoutSeconds: 120
      - name: ensure-service
        run: swamp model method run worker ensureService --input serveUrl=$SERVE_URL
        expect:
          exitCode: 0
          outputContains: ["unit changed"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: token-file-is-0600
        run: stat -c '%a' /root/.config/swamp-worker/figy.token
        expect:
          stdoutContains: ["600"]
          stdoutNotContains: ["644"]
      - name: token-plaintext-not-in-swamp-data
        run: |
          secret=$(cat /root/.config/swamp-worker/figy.token)
          swamp data query 'modelName == "worker"' --select content \
            | grep -q -- "$secret" && echo PRESENT || echo ABSENT
        expect:
          stdoutContains: ["ABSENT"]
          stdoutNotContains: ["PRESENT"]
      - name: unit-is-active
        run: systemctl --user is-active swamp-worker-figy
        expect:
          stdoutContains: ["active"]
          stdoutNotContains: ["failed", "inactive"]
      - name: worker-enrolled-with-labels
        run: |
          for i in $(seq 1 30); do
            swamp worker list --json 2>/dev/null \
              | jq -e '.workers[] | select(.labels.serve == "figy")' >/dev/null 2>&1 \
              && { echo ENROLLED; break; }
            sleep 2
          done
          swamp worker list
        expect:
          exitCode: 0
          outputContains: ["ENROLLED", "figy"]
          outputNotContains: ["error"]
        timeoutSeconds: 120
      - name: status-reports-live-state
        run: swamp model method run worker status
        expect:
          exitCode: 0
          outputContains: ["swamp-worker-figy"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120

  - name: dispatch
    confirms: >
      A workflow step placed with `labels: {serve: figy}` and run through the
      `swamp serve` orchestrator is dispatched to the enrolled worker and returns
      the worker's output — proving end-to-end remote execution against a real
      serve.
    cannot: >
      must not run the step locally, and must not fail with 'no eligible worker'.
    documents: README.md#examples
    variables:
      REPO: /work/repo
    steps:
      - name: write-and-validate-probe
        run: |
          cd "$REPO"
          mkdir -p workflows
          cat > workflows/workflow-worker-probe.yaml <<'YAML'
          id: 00000000-0000-4000-8000-0000000000a1
          name: worker-probe
          tags: {}
          labels:
            serve: figy
          jobs:
            - name: main
              steps:
                - name: remote-echo
                  task:
                    type: model_method
                    modelType: command/shell
                    modelName: worker-probe-shell
                    methodName: execute
                    inputs:
                      run: "echo WORKER_DISPATCH_OK"
                  dependsOn: []
                  weight: 0
                  allowFailure: false
              dependsOn: []
              weight: 0
          version: 1
          YAML
          swamp model create command/shell worker-probe-shell --json >/dev/null 2>&1 || true
          swamp workflow validate worker-probe
        expect:
          exitCode: 0
          outputNotContains: ["invalid", "error"]
      - name: run-through-serve
        run: swamp workflow run worker-probe --server ws://127.0.0.1:9090
        expect:
          exitCode: 0
          outputContains: ["WORKER_DISPATCH_OK"]
          outputNotContains: ["no eligible worker", "queued"]
        timeoutSeconds: 180

  - name: reconcile-idempotent
    confirms: >
      Re-running `ensureService` with the same desired state changes nothing: the
      unit is not rewritten and the worker process is not restarted
      (ActiveEnterTimestamp is unchanged).
    cannot: >
      must not rewrite the unit and must not restart the worker.
    documents: README.md#examples
    variables:
      SERVE_URL: ws://127.0.0.1:9090
    steps:
      - name: render-unit-is-pure
        run: swamp model method run worker renderUnit --input serveUrl=$SERVE_URL
        expect:
          exitCode: 0
          outputContains: ["Rendered unit swamp-worker-figy"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: capture-active-enter
        run: |
          systemctl --user show swamp-worker-figy -p ActiveEnterTimestamp --value > /tmp/before.ts
          cat /tmp/before.ts
        expect:
          exitCode: 0
      - name: rerun-ensure-service
        run: swamp model method run worker ensureService --input serveUrl=$SERVE_URL
        expect:
          exitCode: 0
          outputContains: ["already converged"]
          outputNotContains: ["unit changed", "panic"]
        timeoutSeconds: 120
      - name: not-restarted
        run: |
          now=$(systemctl --user show swamp-worker-figy -p ActiveEnterTimestamp --value)
          if [ -n "$now" ] && [ "$now" = "$(cat /tmp/before.ts)" ]; then
            echo SAME
          else
            echo CHANGED
          fi
        expect:
          stdoutContains: ["SAME"]
          stdoutNotContains: ["CHANGED"]

  - name: reconcile-change
    confirms: >
      Changing a label and re-running `ensureService` rewrites the unit, restarts
      the worker, and the new label appears on the enrolled worker.
    cannot: >
      must not leave the old label in place, and must not skip the restart.
    documents: README.md#examples
    variables:
      SERVE_URL: ws://127.0.0.1:9090
    steps:
      - name: capture-active-enter
        run: |
          systemctl --user show swamp-worker-figy -p ActiveEnterTimestamp --value > /tmp/change-before.ts
          cat /tmp/change-before.ts
        expect:
          exitCode: 0
      - name: change-label
        run: >
          swamp model method run worker ensureService --input serveUrl=$SERVE_URL
          --input 'labels:json=["tier=prod"]'
        expect:
          exitCode: 0
          outputContains: ["unit changed"]
          outputNotContains: ["already converged", "panic"]
        timeoutSeconds: 120
      - name: unit-has-new-label
        run: grep -q 'tier=prod' /root/.config/systemd/user/swamp-worker-figy.service && echo LABEL_WRITTEN
        expect:
          stdoutContains: ["LABEL_WRITTEN"]
          stdoutNotContains: ["missing"]
      - name: restarted
        run: |
          now=$(systemctl --user show swamp-worker-figy -p ActiveEnterTimestamp --value)
          if [ -n "$now" ] && [ "$now" != "$(cat /tmp/change-before.ts)" ]; then
            echo CHANGED
          else
            echo SAME
          fi
        expect:
          stdoutContains: ["CHANGED"]
          stdoutNotContains: ["SAME"]
      - name: new-label-visible-in-pool
        run: |
          for i in $(seq 1 30); do
            swamp worker list --json 2>/dev/null \
              | jq -e '.workers[] | select(.labels.serve=="figy" and .labels.tier=="prod")' >/dev/null 2>&1 \
              && { echo TIER_VISIBLE; break; }
            sleep 2
          done
          swamp worker list
        expect:
          exitCode: 0
          outputContains: ["TIER_VISIBLE", "tier=prod"]
          outputNotContains: ["error"]
        timeoutSeconds: 120

  - name: coexistence
    confirms: >
      A second, REAL worker of a different identity (`rc` — its own model
      instance, token, unit and cache dir) runs on the same host against the same
      serve alongside `figy`, and reconciling `figy` leaves the other worker and a
      non-owned foreign unit completely alone.
    cannot: >
      must not stop, rewrite or remove the other worker's unit or the non-owned
      foreign unit.
    documents: README.md#examples
    variables:
      SERVE_URL: ws://127.0.0.1:9090
      FOREIGN: /root/.config/systemd/user/swamp-worker-zz.service
    steps:
      - name: deploy-a-second-worker-identity-rc
        run: |
          swamp model create @svendowideit/swamp-worker worker-rc \
            --global-arg identity=rc \
            --global-arg swampBinPath=/usr/local/bin/swamp \
            --global-arg repoDir=/work/repo --json >/dev/null 2>&1 || true
          swamp model method run worker-rc mintToken --input duration=1h
          swamp model method run worker-rc ensureService --input serveUrl=$SERVE_URL
        expect:
          exitCode: 0
          outputContains: ["unit changed"]
          outputNotContains: ["panic"]
        timeoutSeconds: 180
      - name: second-worker-is-active-and-enrolled
        run: |
          systemctl --user is-active swamp-worker-rc
          for i in $(seq 1 30); do
            swamp worker list --json 2>/dev/null \
              | jq -e '.workers[] | select(.labels.serve=="rc")' >/dev/null 2>&1 \
              && { echo RC_ENROLLED; break; }
            sleep 2
          done
          swamp worker list
        expect:
          exitCode: 0
          stdoutContains: ["active"]
          outputContains: ["RC_ENROLLED", "rc"]
          outputNotContains: ["inactive", "failed"]
        timeoutSeconds: 120
      - name: install-a-non-owned-foreign-unit
        run: |
          mkdir -p /root/.config/systemd/user
          cat > "$FOREIGN" <<'UNIT'
          [Unit]
          Description=foreign worker (zz, not managed by this repo)
          [Service]
          Type=simple
          ExecStart=/bin/sleep infinity
          [Install]
          WantedBy=default.target
          UNIT
          systemctl --user daemon-reload
          systemctl --user enable swamp-worker-zz.service
          echo FOREIGN_INSTALLED
        expect:
          exitCode: 0
          outputContains: ["FOREIGN_INSTALLED"]
      - name: reconcile-figy-leaves-the-others-alone
        run: swamp model method run worker ensureService --input serveUrl=$SERVE_URL
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: the-other-worker-and-foreign-unit-survive
        run: |
          systemctl --user is-active swamp-worker-figy
          systemctl --user is-active swamp-worker-rc
          grep -q 'identity: rc' /root/.config/systemd/user/swamp-worker-rc.service && echo RC_UNIT_INTACT
          test -f "$FOREIGN" && echo FOREIGN_INTACT
        expect:
          exitCode: 0
          stdoutContains: ["active", "RC_UNIT_INTACT", "FOREIGN_INTACT"]
          outputNotContains: ["inactive", "failed", "missing"]

  - name: teardown
    confirms: >
      Removing `figy` completely decommissions only that worker — token revoked,
      unit/cache/token gone — while the other real worker (`rc`) keeps running and
      stays enrolled, and a non-owned foreign unit is untouched; removing `rc` too
      still leaves the foreign unit intact.
    cannot: >
      must not leave the figy unit active, must not leave the figy token valid,
      and must not stop, remove or otherwise touch the rc worker or the foreign
      unit.
    documents: README.md#examples
    variables:
      FOREIGN: /root/.config/systemd/user/swamp-worker-zz.service
    steps:
      - name: remove-figy
        run: swamp model method run worker remove
        expect:
          exitCode: 0
          outputContains: ["Removed worker swamp-worker-figy", "revoked 1 of 1 token(s): figy-"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: figy-is-completely-gone
        run: |
          if systemctl --user is-active swamp-worker-figy >/dev/null 2>&1; then echo FIGY_ACTIVE; else echo FIGY_GONE; fi
          test -f /root/.config/systemd/user/swamp-worker-figy.service && echo FIGY_UNIT_PRESENT || echo FIGY_UNIT_REMOVED
          test -e /root/.local/share/swamp-worker/figy && echo FIGY_CACHE_PRESENT || echo FIGY_CACHE_GONE
          test -e /root/.config/swamp-worker/figy.token && echo FIGY_TOKEN_PRESENT || echo FIGY_TOKEN_GONE
          test -e /root/.config/swamp-worker/figy.env && echo FIGY_ENV_PRESENT || echo FIGY_ENV_GONE
        expect:
          stdoutContains: ["FIGY_GONE", "FIGY_UNIT_REMOVED", "FIGY_CACHE_GONE", "FIGY_TOKEN_GONE", "FIGY_ENV_GONE"]
          stdoutNotContains: ["FIGY_ACTIVE", "FIGY_UNIT_PRESENT", "FIGY_CACHE_PRESENT", "FIGY_TOKEN_PRESENT", "FIGY_ENV_PRESENT"]
      - name: the-other-worker-still-runs-and-is-enrolled
        run: |
          systemctl --user is-active swamp-worker-rc
          test -e /root/.local/share/swamp-worker/rc && echo RC_CACHE_INTACT || echo RC_CACHE_GONE
          grep -q 'identity: rc' /root/.config/systemd/user/swamp-worker-rc.service && echo RC_UNIT_INTACT
          for i in $(seq 1 30); do
            swamp worker list --json 2>/dev/null \
              | jq -e '.workers[] | select(.labels.serve=="rc" and .status=="idle")' >/dev/null 2>&1 \
              && { echo RC_STILL_ENROLLED; break; }
            sleep 2
          done
        expect:
          exitCode: 0
          stdoutContains: ["active", "RC_CACHE_INTACT", "RC_UNIT_INTACT", "RC_STILL_ENROLLED"]
          stdoutNotContains: ["inactive", "failed", "RC_CACHE_GONE"]
      - name: non-owned-foreign-unit-still-survives
        run: test -f "$FOREIGN" && echo FOREIGN_SURVIVES
        expect:
          stdoutContains: ["FOREIGN_SURVIVES"]
          stdoutNotContains: ["missing"]
      - name: remove-the-second-worker-too
        run: swamp model method run worker-rc remove
        expect:
          exitCode: 0
          outputContains: ["Removed worker swamp-worker-rc"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: foreign-unit-survives-after-both-workers-are-gone
        run: |
          if systemctl --user is-active swamp-worker-rc >/dev/null 2>&1; then echo RC_ACTIVE; else echo RC_GONE; fi
          test -f "$FOREIGN" && echo FOREIGN_SURVIVES
        expect:
          stdoutContains: ["RC_GONE", "FOREIGN_SURVIVES"]
          stdoutNotContains: ["RC_ACTIVE", "missing"]

  - name: mint-token-is-per-node-and-idempotent
    confirms: >
      `mintToken` is per-target: minting one node stages only that node's token
      in its own 0600 file and records it under its own `token` resource instance,
      leaving every other node untouched; re-minting a node reuses the token
      already staged for it (its file is unchanged), so re-running a deploy does
      not mint a fresh token and strand the old one.
    cannot: >
      must not clobber another node's staged token or record, and must not mint a
      different token for a node that already has one staged.
    documents: README.md#examples
    variables:
      REPO: /work/repo
      BIN: /usr/local/bin/swamp
    steps:
      - name: create-model
        run: >
          swamp model create @svendowideit/swamp-worker worker-prov
          --global-arg identity=prov --global-arg swampBinPath=$BIN
          --global-arg repoDir=$REPO --json >/dev/null 2>&1 || true
        expect:
          exitCode: 0
      - name: mint-node1
        run: >
          swamp model method run worker-prov mintToken
          --input name=prov-node1 --input duration=1h
        expect:
          exitCode: 0
          outputContains: ["prov-node1"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: mint-node2
        run: >
          swamp model method run worker-prov mintToken
          --input name=prov-node2 --input duration=1h
        expect:
          exitCode: 0
          outputContains: ["prov-node2"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: both-nodes-are-staged-independently
        run: |
          test -s /tmp/swamp-worker-staging/prov-node1.token && echo NODE1_STAGED || echo NODE1_MISSING
          test -s /tmp/swamp-worker-staging/prov-node2.token && echo NODE2_STAGED || echo NODE2_MISSING
          s1=$(sha256sum /tmp/swamp-worker-staging/prov-node1.token | awk '{print $1}')
          s2=$(sha256sum /tmp/swamp-worker-staging/prov-node2.token | awk '{print $1}')
          echo "$s1" > /tmp/prov1.sha
          echo "$s2" > /tmp/prov2.sha
          [ "$s1" != "$s2" ] && echo DISTINCT_TOKENS || echo SAME_TOKEN
        expect:
          stdoutContains: ["NODE1_STAGED", "NODE2_STAGED", "DISTINCT_TOKENS"]
          stdoutNotContains: ["NODE1_MISSING", "NODE2_MISSING", "SAME_TOKEN"]
      - name: two-token-records-keyed-by-name
        run: |
          swamp data query 'modelName == "worker-prov" && specName == "token"' --select name --json \
            | jq -e '(.results | index("prov-node1") != null) and (.results | index("prov-node2") != null)' >/dev/null \
            && echo NAMED_RECORDS || echo RECORDS_MISSING
        expect:
          stdoutContains: ["NAMED_RECORDS"]
          stdoutNotContains: ["RECORDS_MISSING"]
        timeoutSeconds: 120
      - name: re-mint-node1
        run: >
          swamp model method run worker-prov mintToken
          --input name=prov-node1 --input duration=1h
        expect:
          exitCode: 0
          outputContains: ["Reusing staged enrollment token prov-node1"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: node1-reused-node2-untouched
        run: |
          n1=$(sha256sum /tmp/swamp-worker-staging/prov-node1.token | awk '{print $1}')
          n2=$(sha256sum /tmp/swamp-worker-staging/prov-node2.token | awk '{print $1}')
          [ "$n1" = "$(cat /tmp/prov1.sha)" ] && echo NODE1_REUSED || echo NODE1_REMINTED
          [ "$n2" = "$(cat /tmp/prov2.sha)" ] && echo NODE2_UNTOUCHED || echo NODE2_CHANGED
        expect:
          stdoutContains: ["NODE1_REUSED", "NODE2_UNTOUCHED"]
          stdoutNotContains: ["NODE1_REMINTED", "NODE2_CHANGED"]

  - name: provision-restarts-when-the-token-changes
    confirms: >
      The rendered provisioning script reconciles the **token** as well as the
      unit: when the node's token file changes (a re-deploy with a new token, or a
      rotation), re-running the script restarts the worker onto the new token, and
      re-running it with an unchanged token restarts nothing.
    cannot: >
      must not leave the running worker on the old token after the token file
      changed.
    documents: README.md#examples
    variables:
      IDENTITY: prov
      SERVE_URL: ws://127.0.0.1:9090
      REPO: /work/repo
      BIN: /usr/local/bin/swamp
    steps:
      - name: ensure-serve
        run: |
          if ! curl -fsS http://127.0.0.1:9090/ready >/dev/null 2>&1; then
            cd "$REPO"
            nohup swamp serve --host 127.0.0.1 --port 9090 --auth-mode none >/tmp/serve.log 2>&1 &
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9090/ready >/dev/null 2>&1 && break; sleep 1; done
          fi
          curl -fsS http://127.0.0.1:9090/ready >/dev/null && echo SERVE_READY
        expect:
          exitCode: 0
          outputContains: ["SERVE_READY"]
          outputNotContains: ["SERVE_TIMEOUT"]
        timeoutSeconds: 120
      - name: mint-two-tokens
        run: |
          swamp model method run worker-prov mintToken --input name=prov-nodea --input duration=1h
          swamp model method run worker-prov mintToken --input name=prov-nodeb --input duration=1h
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
        timeoutSeconds: 180
      - name: render-provision
        run: swamp model method run worker-prov renderProvision --input serveUrl=$SERVE_URL
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: script-refuses-a-foreign-token
        run: |
          swamp data query 'modelName=="worker-prov" && name=="provision"' --select content --json \
            | jq -r '.results[0].script' > /tmp/provision.sh
          # A stale / another repo's token left at the shared node staging path
          # must be refused (its name is not an 'prov-' token), not installed.
          printf 'rc-node1.deadbeef\n' > /tmp/swamp-worker-token
          sh /tmp/provision.sh 2>/tmp/foreign.err && echo UNEXPECTED_OK || echo REFUSED
          cat /tmp/foreign.err
        expect:
          stdoutContains: ["REFUSED", "not an 'prov-' token"]
          stdoutNotContains: ["UNEXPECTED_OK"]
        timeoutSeconds: 120
      - name: deploy-with-token-one
        run: |
          mkdir -p /root/.config/swamp-worker
          # Deliver the token the way the site workflow does: to the node's
          # staging path; the provisioning script installs it to its final 0600
          # location (and restarts onto it).
          install -m600 /tmp/swamp-worker-staging/prov-nodea.token /tmp/swamp-worker-token
          sh /tmp/provision.sh
        expect:
          exitCode: 0
          outputContains: ["swamp-worker-prov"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: capture-active-enter
        run: |
          systemctl --user show swamp-worker-prov -p ActiveEnterTimestampMonotonic --value > /tmp/prov.ts
          cat /tmp/prov.ts
        expect:
          exitCode: 0
      - name: deploy-with-token-two
        run: |
          install -m600 /tmp/swamp-worker-staging/prov-nodeb.token /tmp/swamp-worker-token
          sh /tmp/provision.sh
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: restarted-onto-the-new-token
        run: |
          now=$(systemctl --user show swamp-worker-prov -p ActiveEnterTimestampMonotonic --value)
          before=$(cat /tmp/prov.ts)
          echo "before=$before now=$now"
          echo "stamp=$(cat /root/.config/swamp-worker/.swamp-worker-prov.token.sha 2>/dev/null || echo none)"
          echo "currenthash=$(sha256sum /root/.config/swamp-worker/prov.token 2>/dev/null | awk '{print $1}')"
          if [ -n "$now" ] && [ "$now" != "$before" ]; then echo RESTARTED; else echo NOT_RESTARTED; fi
        expect:
          stdoutContains: ["RESTARTED"]
          stdoutNotContains: ["NOT_RESTARTED"]

  - name: update-binary
    confirms: >
      Re-running provision with a requested `version` upgrades the swamp binary
      the worker runs: a stubbed (wrong) binary at swampBinPath is replaced by the
      requested release, and the unit is restarted onto it.
    cannot: >
      must not leave the stubbed binary in place.
    documents: README.md#examples
    variables:
      IDENTITY: bin
      SERVE_URL: ws://127.0.0.1:9090
      REPO: /work/repo
      BIN: /tmp/bin/swamp-under-test
    steps:
      - name: ensure-serve
        run: |
          if ! curl -fsS http://127.0.0.1:9090/ready >/dev/null 2>&1; then
            cd "$REPO"
            nohup swamp serve --host 127.0.0.1 --port 9090 --auth-mode none >/tmp/serve.log 2>&1 &
            for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9090/ready >/dev/null 2>&1 && break; sleep 1; done
          fi
          curl -fsS http://127.0.0.1:9090/ready >/dev/null && echo SERVE_READY
        expect:
          exitCode: 0
          outputContains: ["SERVE_READY"]
          outputNotContains: ["SERVE_TIMEOUT"]
        timeoutSeconds: 120
      - name: stub-the-installed-binary
        run: |
          # An "old swamp" that reports a stale version but otherwise delegates to
          # the real swamp, so the model's own token calls still work.
          mkdir -p /tmp/bin
          cat > "$BIN" <<'STUB'
          #!/bin/sh
          if [ "${1:-}" = "--version" ]; then echo "swamp 0.0.0-stub"; exit 0; fi
          exec /usr/local/bin/swamp "$@"
          STUB
          chmod +x "$BIN"
          "$BIN" --version
        expect:
          stdoutContains: ["stub"]
      - name: create-model
        run: >
          swamp model create @svendowideit/swamp-worker worker-bin
          --global-arg identity=$IDENTITY --global-arg swampBinPath=$BIN
          --global-arg repoDir=$REPO --json >/dev/null 2>&1 || true
        expect:
          exitCode: 0
      - name: mint-token
        run: swamp model method run worker-bin mintToken --input name=bin-hostb --input duration=1h
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: render-provision-with-version
        run: swamp model method run worker-bin renderProvision --input serveUrl=$SERVE_URL --input version=latest
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
      - name: deploy-and-upgrade
        run: |
          mkdir -p /root/.config/swamp-worker
          install -m600 /tmp/swamp-worker-staging/bin-hostb.token /root/.config/swamp-worker/bin.token
          swamp data query 'modelName=="worker-bin" && name=="provision"' --select content --json \
            | jq -r '.results[0].script' > /tmp/provision-bin.sh
          sh /tmp/provision-bin.sh
        expect:
          exitCode: 0
          outputNotContains: ["panic"]
        timeoutSeconds: 300
      - name: the-binary-was-upgraded
        run: '"$BIN" --version'
        expect:
          exitCode: 0
          stdoutNotContains: ["stub"]

  - name: ensure-service-preconditions
    confirms: >
      `ensureService` refuses to start a unit that is guaranteed to crash-loop:
      with no staged and no installed token it fails loudly naming the missing
      token file, instead of enabling a `Restart=always` unit that would loop.
    cannot: >
      must not report success or start the unit when the token is absent.
    documents: README.md#examples
    variables:
      REPO: /work/repo
      BIN: /usr/local/bin/swamp
      SERVE_URL: ws://127.0.0.1:9090
    steps:
      - name: create-model
        run: >
          swamp model create @svendowideit/swamp-worker worker-pre
          --global-arg identity=pre --global-arg swampBinPath=$BIN
          --global-arg repoDir=$REPO --json >/dev/null 2>&1 || true
        expect:
          exitCode: 0
      - name: ensure-service-without-a-token-fails-clearly
        run: >
          swamp model method run worker-pre ensureService
          --input serveUrl=$SERVE_URL --input name=pre-untokenised
        expect:
          exitCode: [1, 2]
          outputContains: ["token file"]
          outputNotContains: ["panic"]
        timeoutSeconds: 120
      - name: no-unit-was-written
        run: |
          test -f /root/.config/systemd/user/swamp-worker-pre.service && echo UNIT_WRITTEN || echo NO_UNIT
        expect:
          stdoutContains: ["NO_UNIT"]
          stdoutNotContains: ["UNIT_WRITTEN"]
