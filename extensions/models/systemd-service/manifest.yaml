manifestVersion: 1
name: "@svendowideit/systemd-service"
version: "2026.09.10.1"
description: >
  Generic systemd *user* service management. Idempotently creates, starts,
  stops, and removes a systemd user service unit for any service name and
  command line. Any other extension can call its methods to stand up a
  persistent service — e.g. running swamp's bundled Deno to serve dynamic web
  services and APIs like @svendowideit/news's feedback-server.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - systemd_service.ts

additionalFiles:
  - README.md
  - LICENSE.txt
  - systemd_service_test.ts

platforms:
  - linux-x86_64
  - linux-aarch64
