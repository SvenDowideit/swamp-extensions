manifestVersion: 1
name: "@svendowideit/tuios"
version: "2026.09.30.2"
description: >
  Keep TUIOS current and always-on: track the latest release, know exactly what
  to download for this machine, install, upgrade, restart or remove it, and run
  the TUIOS daemon under systemd so sessions survive logout and reboot.

  WHAT IT DOES

    TUIOS (https://tuios.dev) is a terminal window manager whose sessions live
    in a background daemon. This extension closes the whole loop around it on
    the machine it runs on: it resolves the newest release and the exact archive
    for this platform (recording its SHA-256 from checksums.txt), downloads and
    verifies it, then installs, upgrades or removes the `tuios` binary —
    idempotently, refusing an unverified archive and refusing to fight a system
    package manager. A bundled workflow does the lot: it installs or upgrades,
    restarts the systemd daemon so it runs the new binary, and prints the
    version, the binary's path and the exact `systemctl --user status` command
    to inspect the service.

    Release resolution, platform selection, checksum lookup and download are
    delegated to `@svendowideit/github-release-install`, so this extension keeps
    only what is particular to TUIOS.

  INSTALL

      swamp extension pull @svendowideit/tuios

  DEPENDENCIES

    `@svendowideit/github-release-install`, declared in `dependencies:` and
    installed by the single pull above. It resolves, selects, downloads and
    verifies the release archive; the bundled workflow calls it. The TUIOS
    models also depend on `@svendowideit/systemd-service` for the daemon steps —
    optional, and skipped with `--input manageService=false`.

  RUN

      # Install or upgrade TUIOS and start its daemon as a systemd user
      # service, so sessions survive logout and reboot. Idempotent.
      swamp workflow run @svendowideit/tuios-install

      # Pin a version and choose where the binary lands.
      swamp workflow run @svendowideit/tuios-install \
        --input version=0.8.0 --input installDir=~/.local/bin

      # Ask what the latest release is and what this machine would download.
      swamp workflow run @svendowideit/github-release-install-fetch \
        --input repo=Gaurav-Gosain/tuios --input stem=tuios --input download=false

      # Ask what is installed right now.
      swamp model @svendowideit/tuios-installed method run sync tuios-installed

      # Remove the binary (leaving any systemd service in place).
      swamp workflow run @svendowideit/tuios-install --input uninstall=true

  CONFIGURE

    Workflow inputs (all optional, with defaults):

      repo           GitHub repository publishing TUIOS  (default Gaurav-Gosain/tuios)
      installDir     Where to install the binary         (default: first writable of
                                                         /usr/local/bin, ~/.local/bin, ~/bin)
      downloadDir    Where the verified archive is staged (default ~/.cache/tuios)
      version        Release to install; empty = latest  (default "")
      flavor         std | ghostty                       (default std)
      force          Reinstall even when up to date, and override the
                     package-manager guard                (default false)
      manageService  Create + start the daemon service   (default true)
      serviceName    systemd user service name           (default tuios)
      uninstall      Remove the binary instead           (default false)
      githubToken    GitHub token for the releases API   (default: GITHUB_TOKEN,
                                                         GH_TOKEN, or `gh auth token`)

    Precedence is per-call `--input` > schema default. The releases API allows
    only 60 anonymous requests per hour per IP, so authenticate for scheduled
    runs: run `gh auth login` once (its token is then used automatically), or
    export `GITHUB_TOKEN=$(gh auth token)` / pass `--input githubToken=…`. The
    release workflow resolves and downloads once; install consumes the verified
    archive it produced, so a normal run spends one API request.

  WHAT IT INSTALLS

    The `tuios` binary at the chosen install directory (default: the first
    writable of /usr/local/bin, ~/.local/bin, ~/bin) — the same locations the
    upstream install script targets. The archive is staged (and checksum
    verified) under the download directory. The install output and the final
    verify step log the binary's path (run `<path> --version` to check it). When
    `manageService` is true it also writes one systemd *user* unit named
    `tuios.service` at `~/.config/systemd/user/`, enables user lingering,
    starts/enables the service so the daemon runs at boot, and restarts it
    after an upgrade. Nothing else is installed, and `manageService=false`
    installs no service. Inspect the service at any time with:

        systemctl --user status tuios.service

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - tuios_installed.ts
  - tuios_shared.ts

workflows:
  - tuios-install.yaml

dependencies:
  - "@svendowideit/github-release-install"
  - "@svendowideit/systemd-service"

additionalFiles:
  - README.md
  - LICENSE.txt
  - tuios_shared_test.ts
  - tuios_installed_test.ts
  - tuios_installed_methods_test.ts

platforms: []
