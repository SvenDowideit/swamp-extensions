id: fc72db4c-1cc0-45d5-b3e5-75c3bcd80252
name: '@svendowideit/tuios-install'
description: |
  Install, upgrade — or uninstall — TUIOS on the machine this workflow runs on,
  then hand the daemon to systemd so sessions are always available.

  Steps (install):
    fetch-release → install → create-daemon-service → start-daemon-service
    → restart-daemon-service → verify

  fetch-release calls @svendowideit/github-release-install-fetch, which resolves
  the newest TUIOS release, selects the archive for this platform, records its
  SHA-256 from checksums.txt, downloads it and verifies the bytes before writing
  a checksum-verified archive. install then extracts the `tuios` binary from
  that verified archive, checks it once more, and replaces the installed binary
  — idempotently: it skips the install when the target version is already
  present (unless force is set). The systemd steps create and start a
  `tuios daemon` user service (via @svendowideit/systemd-service) so sessions
  survive logout and reboot, and restart it after an upgrade (enable --now does
  not restart an active unit, so without this the daemon would keep running the
  old binary). verify prints the installed version, the binary's path, and the
  exact `systemctl --user status <service>.service` command to inspect the
  daemon.

  Run it on any machine to make TUIOS present, current, and always-on:

      swamp workflow run @svendowideit/tuios-install

  Pin a version, choose where the binary lands, or leave the daemon alone:

      swamp workflow run @svendowideit/tuios-install \
        --input version=0.8.0 --input installDir=~/.local/bin \
        --input manageService=false

  Remove the binary instead (the systemd service is left in place):

      swamp workflow run @svendowideit/tuios-install --input uninstall=true

  The workflow auto-registers the `github-release`, `tuios-installed` and
  `tuios-daemon` model instances on first run; nothing needs creating by hand.
  The daily trigger upgrades the binary and restarts the daemon as new releases
  appear; remove `trigger:` if you would rather upgrade by hand.
tags: {}
trigger:
  schedule: "0 4 * * *"
  inputs:
    manageService: true
inputs:
  properties:
    repo:
      type: string
      default: Gaurav-Gosain/tuios
      description: GitHub repository (owner/name) publishing the TUIOS releases.
    installDir:
      type: string
      default: ""
      description: >-
        Directory to install the tuios binary into. Empty picks the first
        writable of /usr/local/bin, ~/.local/bin, ~/bin.
    downloadDir:
      type: string
      default: ~/.cache/tuios
      description: >-
        Directory the checksum-verified release archive is staged in before
        install extracts it.
    version:
      type: string
      default: ""
      description: >-
        Release to install (e.g. 0.8.0 or v0.8.0). Empty installs the latest.
    flavor:
      type: string
      enum:
        - std
        - ghostty
      default: std
      description: >-
        Build flavor: 'std' is the pure-Go emulator, 'ghostty' bundles
        libghostty-vt (Linux/Windows only).
    githubToken:
      type: string
      default: ""
      description: >-
        GitHub token to raise the releases API rate limit. Empty falls back to
        GITHUB_TOKEN / GH_TOKEN, then the authenticated `gh` CLI. Set
        GITHUB_TOKEN or run `gh auth login` for scheduled runs.
    force:
      type: boolean
      default: false
      description: >-
        Reinstall even when the target version is already installed, and
        rewrite the systemd unit even if it already matches.
    manageService:
      type: boolean
      default: true
      description: >-
        Create and start a systemd user service running the TUIOS daemon, so
        sessions persist across logout and reboot.
    serviceName:
      type: string
      default: tuios
      description: systemd user service name (without the .service suffix).
    uninstall:
      type: boolean
      default: false
      description: >-
        Remove the tuios binary instead of installing it. The systemd service
        is left in place; remove it separately with @svendowideit/systemd-service.
  required: []
jobs:
  - name: main
    description: Fetch and verify the release archive, install the binary, then run the daemon under systemd.
    steps:
      - name: fetch-release
        description: >-
          Resolve the newest TUIOS release, select this platform's archive,
          download it, and verify it against the release's checksums — landing a
          checksum-verified archive on disk. Skipped on an uninstall run (nothing
          to download). This is the only writer of the `release` and `archive`
          resources in a run.
        guard: ${{ inputs.uninstall == true }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/github-release-install-fetch"
          inputs:
            repo: ${{ inputs.repo }}
            version: ${{ inputs.version }}
            stem: '${{ inputs.flavor == "ghostty" ? "tuios-ghostty" : "tuios" }}'
            outputDir: ${{ inputs.downloadDir }}
            force: ${{ inputs.force }}
            githubToken: ${{ inputs.githubToken }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: install
        description: >-
          Extract the `tuios` binary from the verified archive, verify it once
          more against the recorded SHA-256, and install it. The model locates
          whatever is already installed and skips the install when the target
          version is present (unless force is set), so this step is safe on every
          pass. Skipped when `uninstall=true`. It is the only writer of the
          `installed` and `install` resources in a run.
        guard: ${{ inputs.uninstall == true }}
        task:
          type: model_method
          modelType: "@svendowideit/tuios-installed"
          modelName: tuios-installed
          methodName: install
          inputs:
            version: ${{ inputs.version }}
            installDir: ${{ inputs.installDir }}
            force: ${{ inputs.force }}
            archivePath: ${{ data.latest("github-release", "archive").attributes.?path.orValue("") }}
            archiveName: ${{ data.latest("github-release", "archive").attributes.?archiveName.orValue("") }}
            checksum: ${{ data.latest("github-release", "archive").attributes.?checksum.orValue("") }}
        dependsOn:
          - step: fetch-release
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: uninstall
        description: >-
          Remove the tuios binary. Idempotent: a missing binary is a no-op, and
          a package-manager-owned binary is refused unless force is set. Only
          runs when `uninstall=true`. It stops the daemon service (so a removed
          binary cannot leave the unit restart-looping) but leaves the unit
          file, and reports how to remove that too.
        guard: ${{ inputs.uninstall == false }}
        task:
          type: model_method
          modelType: "@svendowideit/tuios-installed"
          modelName: tuios-installed
          methodName: uninstall
          inputs:
            installDir: ${{ inputs.installDir }}
            force: ${{ inputs.force }}
            serviceName: ${{ inputs.serviceName }}
        dependsOn:
          - step: fetch-release
            condition:
              type: always
        weight: 0
        allowFailure: false
      - name: create-daemon-service
        description: >-
          Write (idempotently) a systemd user unit that runs the freshly
          installed `tuios daemon`, so sessions persist across logout and
          reboot. Only runs when manageService is true and uninstall is false.
        guard: ${{ inputs.uninstall == true || inputs.manageService == false }}
        task:
          type: model_method
          modelType: "@svendowideit/systemd-service"
          modelName: tuios-daemon
          methodName: createService
          inputs:
            serviceName: ${{ inputs.serviceName }}
            command: ${{ data.latest("tuios-installed", "install").attributes.path + " daemon" }}
            description: TUIOS daemon — persistent terminal sessions
            restart: always
            restartSec: "5"
            force: ${{ inputs.force }}
        dependsOn:
          - step: install
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: start-daemon-service
        description: >-
          Enable user lingering and start/enable the service so the daemon comes
          back at boot and its sessions are always available.
        guard: ${{ inputs.uninstall == true || inputs.manageService == false }}
        task:
          type: model_method
          modelType: "@svendowideit/systemd-service"
          modelName: tuios-daemon
          methodName: startService
          inputs:
            serviceName: ${{ inputs.serviceName }}
            linger: true
        dependsOn:
          - step: create-daemon-service
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: restart-daemon-service
        description: >-
          Restart the daemon so it runs the newly installed binary. `enable
          --now` does not restart an already-active unit, so without this an
          upgrade would leave the old binary running. Skipped on uninstall, when
          the service is unmanaged, and when the install step was a no-op
          (already up to date).
        guard: >-
          ${{ inputs.uninstall == true || inputs.manageService == false
          || data.latest("tuios-installed", "install").?attributes.?skipped.orValue(true) == true }}
        task:
          type: model_method
          modelType: "@svendowideit/systemd-service"
          modelName: tuios-daemon
          methodName: restartService
          inputs:
            serviceName: ${{ inputs.serviceName }}
        dependsOn:
          - step: start-daemon-service
            condition:
              type: always
        weight: 0
        allowFailure: true
      - name: verify
        description: >-
          Print the final installed version, the binary path, and the exact
          `systemctl --user status` command for the daemon service, so the run
          log ends with what is now on the machine, where it is, and how to
          check the service.
        task:
          type: model_method
          modelType: "@svendowideit/tuios-installed"
          modelName: tuios-installed
          methodName: print
          inputs:
            serviceName: ${{ inputs.serviceName }}
        dependsOn:
          - step: install
            condition:
              type: always
          - step: uninstall
            condition:
              type: always
          - step: restart-daemon-service
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
