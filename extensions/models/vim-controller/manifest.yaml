manifestVersion: 1
name: "@svendowideit/vim-controller"
version: "2026.11.28.1"
description: >
  Control the Vim buffer a human is watching: read the buffer, replace exact
  text or line ranges atomically, move the cursor, draw a virtual agent cursor,
  and read quickfix — without spawning sed or cat.

  WHAT IT DOES

    Vim is already a programmable editor when it is started with
    `--servername`: `--remote-expr` can read lines, replace a buffer, move the
    cursor, draw text properties and read quickfix. This extension wraps that
    surface as swamp methods: `servers`, `open`, `status`, `read`, `edit`,
    `write`, `cursor`, `annotate`, `command`, `expr`, `keys`, `diagnostics`,
    `undo`, `openFile`, `focus` and `close`. `editFile` loads a path, edits and saves it through that same buffer, so
    every text write is visible where the person is looking; `openFile` loads any path into the
    editor the person is already watching, so an agent's file changes land in the
    same visible buffer every time. `open` places Vim in one visible editor tab per
    Herdr space, created the first time that space needs it and without taking
    focus from the person; `focus` shows that tab when asked. `edit` applies exact-text or
    line-range changes in one call, rejects an ambiguous match before touching
    the buffer, returns the undo sequence and a unified diff, and never leaves
    a half-applied edit. `annotate` uses Vim text properties for a virtual
    cursor, so the human keeps the real one. Prefer it to `sed -i` or a
    terminal-scraping wrapper when you want the change to happen in the editor
    the person is already looking at. Every method can emit one OTLP/HTTP span
    with `swamp.route=vim`, resolved from `@svendowideit/otel-settings` when
    that contract is configured, then from the standard OTEL environment. Each
    method also appends one JSONL event for the Herdr activity panel, which
    shows routed vs bypassed tool calls live.

  INSTALL

      swamp extension pull @svendowideit/vim-controller

  DEPENDENCIES

    Vim 9 with `+clientserver`, `+channel`, `+textprop` and `+quickfix`, and an
    X11 display (XWayland is fine). `open` also needs the `herdr-core` binary
    (or its `hc` alias) to host the terminal; an existing Vim started with
    `--servername` works without herdr-core. Optional:
    `@svendowideit/otel-settings` for automatic OTLP endpoint discovery.

  RUN

      # See which Vim servers exist, then open one in this space's editor tab.
      # The tab is created once per space, without taking focus, so the person
      # keeps looking at the tab they chose.
      swamp behavior run vim servers
      swamp behavior run vim open \
        --input file=src/index.ts --input cwd=$PWD

      # Every method reopens this space's editor tab when its Vim is gone, so a
      # tab the person closed comes back on the next read or edit. `focus` shows
      # it when they should watch, and `status` reports where it is.
      swamp behavior run vim focus \
        --input server=swamp-vim-swamp-project
      swamp behavior run vim status \
        --input server=swamp-vim-swamp-project

      # Read what the human sees, then replace one exact sentence. The edit
      # is rejected if the text is missing or occurs more than once.
      swamp behavior run vim read \
        --input server=swamp-demo --input mode=visible
      swamp behavior run vim edit \
        --input server=swamp-demo \
        --input 'edits:json=[{"old":"old sentence","new":"new sentence"}]'

      # Show where the agent is looking without moving the human's cursor.
      swamp behavior run vim annotate \
        --input server=swamp-demo \
        --input line=12 --input text="▶ agent"

      # Read Vim's quickfix list, or run one Ex command.
      swamp behavior run vim diagnostics \
        --input server=swamp-demo
      swamp behavior run vim command \
        --input server=swamp-demo --input command="set number"

      # Check whether tracing is live, then post one test span.
      swamp behavior run vim otel-status
      swamp behavior run vim otel-status \
        --input test=true

  CONFIGURE

    Global arguments, set on the model definition:

      vimBin                Vim binary                              (vim)
      herdrBin              herdr-core binary used by `open`        (herdr-core)
      herdrAppBin           herdr-app binary used to place the tab  (herdr-app)
      autoOpen              reopen the editor tab when a method    (true)
                            needs a Vim that is not running
      editorTab             name of the per-space editor tab         (Edit)
      serverPrefix          prefix for a space/cwd-derived server    (swamp-vim)
      defaultServer         server used when a method names none     (empty)
      open.place            tab (default) or background terminal     (tab)
      defaultCwd            cwd for `open` when the method gives none (empty)
      maxOutputBytes        retained buffer/command output          (200000)
      otelEnabled           export OTLP spans                       (true)
      otelModel             otel-settings model name                (otel)
      otelVaultName         vault holding the OTLP bearer token     (empty)
      otelTokenRef          vault/env key for the token             (OTEL_EXPORTER_OTLP_TOKEN)
      otelEndpoint          explicit OTLP/HTTP traces endpoint      (empty)
      otelMesh              preferred contract mesh                 (empty)
      otelServiceName       service.name for spans                  (swamp-vim)
      otelTimeoutMs         maximum time for one span POST          (2500)
      otelDebug             log the resolved endpoint and errors    (false)
      eventLogEnabled       append JSONL activity events             (true)
      eventLog              activity log for the Herdr panel        (~/.local/state/swamp-agent-ide/events.jsonl)

    Per-call arguments are documented by `swamp behavior type describe
    @svendowideit/vim --json`.

  WHAT IT INSTALLS

    No services, cron triggers, daemons or webhooks. It runs the existing `vim`,
    `herdr-core` and `herdr-app` binaries, sources the bundled `swamp_vim.vim`
    runtime into a Vim server, and writes swamp resources. In a Herdr window it
    also creates one tab per space named by `editorTab`, which is visible UI
    state the person can close; `close` closes that tab again when nothing else
    is in it. It never edits `.vimrc` or any other Vim configuration.

repository: 'https://github.com/svendowideit/swamp-extensions'

license: MIT

paths:
  base: manifest

models:
  - vim.ts

reports:
  - vim_report.ts

dependencies: []

optionalDependencies:
  - '@svendowideit/otel-settings'

binaries:
  - swamp_vim.vim

additionalFiles:
  - README.md
  - LICENSE.txt
  - vim_test.ts
  - vim_otel_test.ts
  - vim_report.ts
  - vim_report_test.ts

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64

labels:
  - vim
  - editor
  - agents
  - otel
