manifestVersion: 1
name: "@svendowideit/wikidata"
version: "2026.10.23.1"
description: |
  A Wikidata domain parser that reads cached responses from the shared cache
  owned by @svendowideit/web-cache. It fetches nothing itself — fetch, cache,
  pacing and rate-limit retry are web-cache's job.

  WHAT IT DOES

    Parses cached Wikidata responses into structured swamp data: search
    entities, fetch an entity's claims/labels/descriptions, resolve a
    Wikipedia title to a QID via its sitelink, and extract claims such as
    instance-of into simple key/value form.

  INSTALL

      swamp extension pull @svendowideit/web-cache
      swamp extension pull @svendowideit/wikidata

  DEPENDENCIES

    @svendowideit/web-cache (hard dependency, declared in this manifest). No
    host packages are installed.

  RUN

      # Fetch + cache a Wikidata entity.
      swamp model @svendowideit/web-cache method run get cache \
        --input url="https://www.wikidata.org/w/api.php?action=wbgetentities&ids=Q286116&format=json"

      # Parse the cached entity.
      swamp model @svendowideit/wikidata method run get-entity wd \
        --input id="Q286116"

      # Extract instance-of values from the cached entity.
      swamp model @svendowideit/wikidata method run get-instance-of wd \
        --input id="Q286116"

  CONFIGURE

    All optional global arguments: cacheDir (default ~/.swamp/web-cache), apiUrl
    (default www.wikidata.org), language (default en), site (default enwiki).
    See the README for the full argument tables.

  UPGRADE

    This extension installs nothing on the host, so an upgrade is:

        swamp extension update

    Model definitions record the version they were created with; the model's
    bundled upgrades entry migrates them on the next method run. Swamp data is
    preserved.

  WHAT IT INSTALLS

    Nothing on the host — no services, triggers, or webhooks. Only pulled
    extension files and swamp data resources.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - wikidata.ts

workflows:
  - wikidata-get-entity.yaml
  - wikidata-instance-of.yaml
  - wikidata-resolve-title.yaml

dependencies:
  - "@svendowideit/web-cache"

additionalFiles:
  - README.md
  - LICENSE.txt

platforms: []
