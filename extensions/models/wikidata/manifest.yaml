manifestVersion: 1
name: "@svendowideit/wikidata"
version: "2026.10.24.2"
description: |
  A fetch-free Wikidata domain client. It builds public Wikidata URLs and
  Wikimedia Enterprise request plans, reads the shared web cache, and parses
  whichever shape it finds. It never opens an HTTPS connection itself.

  WHAT IT DOES

    Parses Wikidata into structured swamp data: search entities, resolve a
    Wikipedia title to a QID via its sitelink, fetch an entity's
    claims/labels/descriptions, and extract claims such as instance-of. A QID
    or PID lookup is read from the public Wikidata URL first, then from the
    synthetic Enterprise Wikidata URL, so both cache locations are usable. When
    the `enterprise-wikimedia` vault holds credentials and the local monthly
    budget has room, the wikidata-get-entity and wikidata-instance-of workflows
    prefer Enterprise; curl performs the login/refresh POST and web-cache GETs
    the Enterprise entity URL with a 0600 bearer-token file. Title resolution
    and search stay public because Enterprise has no equivalent endpoint.

  INSTALL

      swamp extension pull @svendowideit/wikidata

  DEPENDENCIES

    @svendowideit/web-cache (declared; pulled automatically) for every public
    and Enterprise GET and the shared run-level fetch budget.
    @svendowideit/curl is used only for the Enterprise login/refresh POST.

  RUN

      # Fetch + parse an entity through the normal workflow. With no Enterprise
      # credentials the miss is fetched from the public Wikidata API.
      swamp workflow run @svendowideit/wikidata-get-entity \
        --input id="Q286116"

      # Resolve instance-of (P31) values; this also prefers Enterprise on a miss.
      swamp workflow run @svendowideit/wikidata-instance-of \
        --input id="Q286116"

      # Search and title resolution are public-only.
      swamp model @svendowideit/wikidata method run search wd \
        --input query="Alfred Bester"

      # Check whether Enterprise Wikidata is ready and how much local quota
      # remains. No request is made and no secret is printed.
      swamp model @svendowideit/wikidata method run enterprise-status wd

  CONFIGURE

    All arguments are optional global arguments:
      cacheDir                  Shared cache dir          (default ~/.swamp/web-cache)
      apiUrl                    Public Wikidata API       (default www.wikidata.org)
      language / site           Labels and sitelink language/site
      enterpriseVaultName       Vault checked for creds   (default enterprise-wikimedia)
      enterpriseMonthlyQuota    Local monthly budget      (default 50000; 0 = no local cap)
    The entity workflows also take maxFetches (0 = unlimited) and budgetId.

  WHAT IT INSTALLS

    Nothing on the host — no services, daemons, cron triggers, or webhooks. It
    reads the shared cache, writes swamp data resources (including the optional
    Enterprise session and usage counters), and uses curl/web-cache for HTTPS.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - wikidata.ts
  - wikidata_enterprise.ts

workflows:
  - wikidata-fetch-entity.yaml
  - wikidata-get-entity.yaml
  - wikidata-instance-of.yaml
  - wikidata-resolve-title.yaml

dependencies:
  - "@svendowideit/web-cache"
  - "@svendowideit/curl"

additionalFiles:
  - README.md
  - LICENSE.txt

platforms: []
