manifestVersion: 1
name: "@svendowideit/wikipedia"
version: "2026.09.20.2"
description: |
  A Wikipedia/Wikidata domain client that reads responses from the shared web
  cache owned by @svendowideit/web-cache. It does not fetch or cache anything
  itself — fetch, cache, pacing and rate-limit retry are web-cache's job.

  The seam is a workflow: a web-cache.get step fetches + caches a URL, then a
  wikipedia.get-page / search / get-infobox step reads that cached body and
  parses the domain content (wikitext, rendered HTML, Parsoid, REST summary,
  raw JSON, or the page's infobox as key/value pairs). Both models share the
  same cacheDir (default ~/.swamp/web-cache) and a URL-only cache-key scheme.

  WHAT'S INSIDE

    @svendowideit/wikipedia — the domain parser:
      search        Parse a cached opensearch response into titles/descriptions/URLs.
      get-page      Parse a cached page (wikitext | html | parsoid | summary | json).
      get-infobox   Extract an infobox as key/value pairs from cached wikitext.

  INSTALL

      swamp extension pull @svendowideit/web-cache
      swamp extension pull @svendowideit/wikipedia

  RUN (see README for the full workflow seam)

      # 1. fetch + cache (web-cache)
      swamp model @svendowideit/web-cache method run get cache \
        --input url="https://en.wikipedia.org/w/api.php?action=parse&page=Alfred+Bester&prop=wikitext&format=json"

      # 2. parse (wikipedia reads the cache)
      swamp model @svendowideit/wikipedia method run get-page wiki \
        --input title="Alfred Bester" --input format=wikitext

  CONFIGURE (all optional global arguments)

      cacheDir         Shared cache dir to read from  (default ~/.swamp/web-cache)
      apiUrl           MediaWiki action API base      (default en.wikipedia.org)
      restUrl          Wikipedia REST v1 base         (default en.wikipedia.org)

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - wikipedia.ts

additionalFiles:
  - README.md
  - LICENSE.txt

platforms: []
