manifestVersion: 1
name: "@svendowideit/wikipedia"
version: "2026.10.23.1"
description: |
  A Wikipedia domain parser that reads cached responses from the shared cache
  owned by @svendowideit/web-cache. It fetches nothing itself — fetch, cache,
  pacing and rate-limit retry are web-cache's job.

  WHAT IT DOES

    Parses cached MediaWiki responses into structured swamp data: opensearch
    search, a page's wikitext/HTML/Parsoid/summary/JSON, and an infobox
    extracted as key/value pairs. Markdown output extensions and URL-only
    cache-key scheme make it composable with the fetch seam.

  INSTALL

      swamp extension pull @svendowideit/web-cache
      swamp extension pull @svendowideit/wikipedia

  DEPENDENCIES

    @svendowideit/web-cache (hard dependency, declared in this manifest). No
    host packages are installed.

  RUN

      # Fetch + cache a page.
      swamp model @svendowideit/web-cache method run get cache \
        --input url="https://en.wikipedia.org/w/api.php?action=parse&page=Alfred+Bester&prop=wikitext&format=json"

      # Parse the cached page's wikitext.
      swamp model @svendowideit/wikipedia method run get-page wiki \
        --input title="Alfred Bester" --input format=wikitext

      # Search cached opensearch results.
      swamp model @svendowideit/wikipedia method run search wiki \
        --input query="Alfred Bester"

  CONFIGURE

    All optional global arguments: cacheDir (default ~/.swamp/web-cache), apiUrl
    (default en.wikipedia.org), restUrl
    (default en.wikipedia.org). See the README for the full argument tables.

  UPGRADE

    This extension installs nothing on the host, so an upgrade is:

        swamp extension update

    Model definitions record the version they were created with; the model's
    bundled upgrades entry migrates them on the next method run. Swamp data is
    preserved.

  WHAT IT INSTALLS

    Nothing on the host — no services, triggers, or webhooks. Only pulled
    extension files and swamp data resources.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - wikipedia.ts

workflows:
  - wikipedia-search.yaml
  - wikipedia-page.yaml
  - wikipedia-infobox.yaml
  - wikipedia-page-props.yaml

dependencies:
  - "@svendowideit/web-cache"

additionalFiles:
  - README.md
  - LICENSE.txt

platforms: []
