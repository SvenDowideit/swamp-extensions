id: 624cd7eb-0e2d-4c8a-83b3-1f9975220a9e
name: "@svendowideit/wikipedia-infobox"
description: |
  Extract a page's infobox as key/value pairs, transparently. The fetch step
  chooses Wikimedia Enterprise when the `enterprise-wikimedia` vault and local
  quota allow it, otherwise the public API; `get-infobox` reads whichever cache
  entry exists.

  Inputs:
    title      — page title
    template   — optional infobox template name to restrict to
    key        — optional data name for the result
    cacheDir   — shared cache dir (default ~/.swamp/web-cache)
    maxFetches — run-level origin-fetch budget (shared via web-cache)
    budgetId   — workflow run id that shares that budget
    runId      — namespaces private Enterprise plan/token files
tags: {}
inputs:
  properties:
    title:
      type: string
      description: Page title
    template:
      type: string
      default: ""
      description: Optional infobox template name to restrict to
    key:
      type: string
      default: ""
      description: Optional data name for the result
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
    maxFetches:
      type: number
      default: 0
      description: Run-level origin-fetch budget (0 = unlimited)
    budgetId:
      type: string
      default: ""
      description: Run id that shares the fetch budget across fetch steps
    runId:
      type: string
      default: ""
      description: Run id used to namespace private Enterprise plan files
  required:
    - title
jobs:
  - name: main
    description: Fetch the wikitext and extract an infobox.
    steps:
      - name: fetch-page
        guard: ${{ inputs.title == null || inputs.title == "" }}
        description: Populate the public or Enterprise wikitext cache entry.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikipedia-fetch-page"
          inputs:
            title: ${{ inputs.title }}
            format: wikitext
            cacheDir: ${{ inputs.cacheDir }}
            maxFetches: ${{ inputs.maxFetches }}
            budgetId: ${{ inputs.budgetId }}
            runId: ${{ inputs.runId }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: parse
        guard: ${{ inputs.title == null || inputs.title == "" }}
        description: Extract the infobox from whichever cache entry exists.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: get-infobox
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
            template: ${{ inputs.template }}
            key: ${{ inputs.key }}
        dependsOn:
          - step: fetch-page
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
