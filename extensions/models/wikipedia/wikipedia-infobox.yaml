id: 624cd7eb-0e2d-4c8a-83b3-1f9975220a9e
name: "@svendowideit/wikipedia-infobox"
description: |
  Extract a page's infobox as key/value pairs through the shared cache,
  transparently. The caller does not care whether a fetch happened or a cache
  hit was used.

  Steps: build the wikitext page URL → web-cache-fetch → parse + extract the
  infobox.

  Inputs:
    title    — page title
    template — optional infobox template name to restrict to (e.g. writer, book)
    key      — optional data name for the result (defaults to title)
    cacheDir — shared cache dir (default ~/.swamp/web-cache)
tags: {}
inputs:
  properties:
    title:
      type: string
      description: Page title
    template:
      type: string
      default: ""
      description: Optional infobox template name to restrict to
    key:
      type: string
      default: ""
      description: Optional data name for the result
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
  required:
    - title
jobs:
  - name: main
    description: Extract an infobox from a page.
    steps:
      - name: build-url
        description: Build the wikitext page URL.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: page-url
          inputs:
            title: ${{ inputs.title }}
            format: wikitext
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: fetch
        description: Fetch + cache the wikitext URL.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/web-cache-fetch"
          inputs:
            urls: ${{ data.latest("wiki", "page-url").attributes.urls }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn:
          - step: build-url
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: parse
        description: Extract the infobox from the cached wikitext.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: get-infobox
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
            template: ${{ inputs.template }}
            key: ${{ inputs.key }}
        dependsOn:
          - step: fetch
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
