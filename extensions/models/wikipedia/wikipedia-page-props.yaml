id: 2ccc92c6-546a-417d-8c47-50a1b6ac3508
name: "@svendowideit/wikipedia-page-props"
description: |
  Resolve candidate page titles to canonical title, URL, short description and
  Wikidata QID via a batched page-props query, through the shared cache. The
  caller does not care whether a fetch happened or a cache hit was used.

  Steps: build the page-props URL → web-cache-fetch → parse the cached body.

  Inputs:
    titles   — array of candidate page titles
    key      — optional data name for the result (defaults to joined titles)
    cacheDir — shared cache dir (default ~/.swamp/web-cache)
tags: {}
inputs:
  properties:
    titles:
      type: array
      items:
        type: string
      description: Candidate page titles
    key:
      type: string
      default: ""
      description: Optional data name for the result
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
  required:
    - titles
jobs:
  - name: main
    description: Resolve candidate titles via page-props.
    steps:
      - name: build-url
        description: Build the batched page-props query URL.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: page-props-url
          inputs:
            titles: ${{ inputs.titles }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: fetch
        description: Fetch + cache the page-props URL.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/web-cache-fetch"
          inputs:
            urls: ${{ data.latest("wiki", "page-props-url").attributes.urls }}
            cacheDir: ${{ inputs.cacheDir }}
        dependsOn:
          - step: build-url
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: parse
        description: Parse the cached page-props body.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: get-page-props
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            titles: ${{ inputs.titles }}
            key: ${{ inputs.key }}
        dependsOn:
          - step: fetch
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
