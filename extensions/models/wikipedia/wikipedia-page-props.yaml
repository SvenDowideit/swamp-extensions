id: 2ccc92c6-546a-417d-8c47-50a1b6ac3508
name: "@svendowideit/wikipedia-page-props"
description: |
  Resolve candidate page titles to canonical title, URL, short description and
  Wikidata QID. Several titles use one public batch request through
  @svendowideit/web-cache. A single title uses the page fetch plan, which
  prefers the Enterprise article (and that article is then reused by the
  infobox step). `get-page-props` reads the public batch cache or the
  single-title Enterprise cache.

  Inputs:
    titles     — array of candidate page titles
    key        — optional data name for the result (defaults to joined titles)
    cacheDir   — shared cache dir (default ~/.swamp/web-cache)
    maxFetches — run-level origin-fetch budget (shared via web-cache)
    budgetId   — workflow run id that shares that budget
tags: {}
inputs:
  properties:
    titles:
      type: array
      items:
        type: string
      description: Candidate page titles
    key:
      type: string
      default: ""
      description: Optional data name for the result
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
    maxFetches:
      type: number
      default: 0
      description: Run-level origin-fetch budget (0 = unlimited)
    budgetId:
      type: string
      default: ""
      description: Run id that shares the fetch budget across fetch steps
  required:
    - titles
jobs:
  - name: main
    description: Fetch the batched page-props response and parse it.
    steps:
      - name: build-url
        description: Build the batched page-props query URL.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: page-props-url
          inputs:
            titles: ${{ inputs.titles }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: fetch-single
        description: >-
          For one title, let the page fetch plan choose Enterprise (reusing the
          article the infobox step needs) or the public page-props URL.
        guard: ${{ size(inputs.titles) != 1 }}
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikipedia-fetch-page"
          inputs:
            title: ${{ inputs.titles[0] }}
            format: json
            publicUrl: ${{ data.latest("wiki", "page-props-url").attributes.url }}
            cacheDir: ${{ inputs.cacheDir }}
            maxFetches: ${{ inputs.maxFetches }}
            budgetId: ${{ inputs.budgetId }}
        dependsOn:
          - step: build-url
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: fetch-batch
        description: For several titles, fetch the public batch page-props URL.
        guard: ${{ size(inputs.titles) == 1 }}
        task:
          type: model_method
          modelType: "@svendowideit/web-cache"
          modelName: cache
          methodName: get
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            url: ${{ data.latest("wiki", "page-props-url").attributes.url }}
            maxFetches: ${{ inputs.maxFetches }}
            budgetId: ${{ inputs.budgetId }}
            resultName: page-props-fetch
        dependsOn:
          - step: build-url
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: parse
        description: Parse the public or single-title Enterprise cache entry.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: get-page-props
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            titles: ${{ inputs.titles }}
            key: ${{ inputs.key }}
            url: ${{ data.latest("wiki", "page-props-url").attributes.url }}
        dependsOn:
          - step: fetch-single
            condition:
              type: always
          - step: fetch-batch
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
