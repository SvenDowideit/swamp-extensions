id: 99bfa21c-c791-46c3-9799-20a3404e9146
name: "@svendowideit/wikipedia-page"
description: |
  Fetch + parse a Wikipedia page, transparently. The fetch step chooses
  Wikimedia Enterprise when the `enterprise-wikimedia` vault and local quota
  allow it, otherwise the public API. Both land in the shared cache under
  different URLs; `get-page` reads whichever entry exists.

  All HTTPS goes through @svendowideit/web-cache (and @svendowideit/curl for the
  Enterprise login/refresh POST).

  Inputs:
    title      — page title
    format     — wikitext | html | parsoid | summary | json (default wikitext)
    cacheDir   — shared cache dir (default ~/.swamp/web-cache)
    maxFetches — run-level origin-fetch budget (shared via web-cache)
    budgetId   — workflow run id that shares that budget
    runId      — namespaces private Enterprise plan/token files
tags: {}
inputs:
  properties:
    title:
      type: string
      description: Page title
    format:
      type: string
      default: "wikitext"
      description: Content format (wikitext | html | parsoid | summary | json)
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
    maxFetches:
      type: number
      default: 0
      description: Run-level origin-fetch budget (0 = unlimited)
    budgetId:
      type: string
      default: ""
      description: Run id that shares the fetch budget across fetch steps
    runId:
      type: string
      default: ""
      description: Run id used to namespace private Enterprise plan files
  required:
    - title
jobs:
  - name: main
    description: Fetch (Enterprise or public) and parse a Wikipedia page.
    steps:
      - name: fetch-page
        guard: ${{ inputs.title == null || inputs.title == "" }}
        description: Populate the public or Enterprise cache entry.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/wikipedia-fetch-page"
          inputs:
            title: ${{ inputs.title }}
            format: ${{ inputs.format }}
            cacheDir: ${{ inputs.cacheDir }}
            maxFetches: ${{ inputs.maxFetches }}
            budgetId: ${{ inputs.budgetId }}
            runId: ${{ inputs.runId }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: parse
        guard: ${{ inputs.title == null || inputs.title == "" }}
        description: Parse whichever cache entry exists (public first, then Enterprise).
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: get-page
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            title: ${{ inputs.title }}
            format: ${{ inputs.format }}
        dependsOn:
          - step: fetch-page
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
