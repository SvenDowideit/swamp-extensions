id: afa7d34c-dd6b-43d7-8f5b-f0f2a2d35637
name: "@svendowideit/wikipedia-search"
description: |
  Search Wikipedia (opensearch) through the shared cache. Enterprise On-demand
  has no search endpoint, so a miss always fetches the public API through
  @svendowideit/web-cache.

  Inputs:
    query      — search term
    limit      — max results (default 5)
    key        — optional data name for the result (defaults to query)
    cacheDir   — shared cache dir (default ~/.swamp/web-cache)
    maxFetches — run-level origin-fetch budget (shared via web-cache)
    budgetId   — workflow run id that shares that budget
tags: {}
inputs:
  properties:
    query:
      type: string
      description: Search term
    limit:
      type: number
      default: 5
      description: Maximum number of results
    key:
      type: string
      default: ""
      description: Optional data name for the result
    cacheDir:
      type: string
      default: "~/.swamp/web-cache"
      description: Shared cache directory
    maxFetches:
      type: number
      default: 20
      description: Run-level origin-fetch budget
    budgetId:
      type: string
      default: ""
      description: Run id that shares the fetch budget across fetch steps
  required:
    - query
jobs:
  - name: main
    description: Fetch the opensearch response and parse it.
    steps:
      - name: build-url
        description: Build the opensearch URL for the query.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: search-url
          inputs:
            query: ${{ inputs.query }}
            limit: ${{ inputs.limit }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: fetch
        description: Fetch + cache the opensearch URL through web-cache.
        task:
          type: model_method
          modelType: "@svendowideit/web-cache"
          modelName: cache
          methodName: get
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            url: ${{ data.latest("wiki", "search-url").attributes.url }}
            maxFetches: ${{ inputs.maxFetches }}
            budgetId: ${{ inputs.budgetId }}
        dependsOn:
          - step: build-url
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: parse
        description: Parse the cached opensearch body.
        task:
          type: model_method
          modelType: "@svendowideit/wikipedia"
          modelName: wiki
          methodName: search
          globalArgs:
            cacheDir: ${{ inputs.cacheDir }}
          inputs:
            query: ${{ inputs.query }}
            limit: ${{ inputs.limit }}
            key: ${{ inputs.key }}
            url: ${{ data.latest("wiki", "search-url").attributes.url }}
        dependsOn:
          - step: fetch
            condition:
              type: always
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
