manifestVersion: 1
name: "@svendowideit/zwift-coach"
version: "2026.11.06.1"
description: >
  Turn your own Zwift and Garmin history into a periodised training plan and
  `.zwo` workouts, then deliver the workouts to Zwift.

  WHAT IT DOES

    Most plans ask you to guess your available days and hours. This one derives
    them from the history you already have: every Zwift ride, FIT normalised
    power and as much Garmin history as exists, then infers the days, hours,
    start times and session length you actually ride. It computes
    TSS/CTL/ATL/TSB, weight and readiness, and builds a periodised plan that
    fits that capacity. Every session has a title, a hook and a "why"; each
    week includes one fun session from your own ride mix. It renders
    conservative `.zwo` XML, validates it, and delivers it over SSH, a local
    folder, a sync folder or a bundle. Custom goals come from the rider's words
    or a validated agent-authored PlanSpec; the agent never writes ZWO. A
    weekly review measures adherence, enjoyment and weight/readiness, then
    adapts future weeks.

  INSTALL

      swamp extension pull @svendowideit/zwift-coach

  DEPENDENCIES

    `@svendowideit/zwift`, declared in `dependencies:` and pulled automatically.
    It owns the Zwift login and history; this extension reads the resources it
    writes. `@swamp/ssh` is used only for remote delivery and is pulled
    automatically. Garmin data is optional: install `@svendowideit/garmin` if
    you want outdoor history, weight/body composition, wellness/readiness and
    performance. Nothing is installed on the Zwift host.

  RUN

      # One-time: verify the Zwift credentials and see what the coach expects.
      swamp model @svendowideit/zwift-rider method run setup zwift-rider

      # Backfill every available Zwift ride, parse FITs and merge Garmin.
      # Incremental: detail/FIT already cached in training-history is reused.
      swamp workflow run @svendowideit/zwift-coach-backfill \
        --input backfillDays=3650 --input includeFit=true

      # Analyse, plan 12 weeks, render 14 days and auto-deliver. With no
      # delivery input the fallback chain ends at a portable bundle.
      swamp workflow run @svendowideit/zwift-coach-plan \
        --input goal=improve --input targetFtpPct=0.05

      # Custom sprint/weight goal in the rider's own words. This is the
      # deterministic path; no agent is required.
      swamp workflow run @svendowideit/zwift-coach-custom \
        --input description="In 3 months, hold >=700W for 60s, raise max wattage above 1300W, and move toward 65kg"

      # Agent-authored plan: run opencode (or another agent) with
      # scaffold-current, then pass its JSON back. Validation is fail-closed.
      swamp workflow run @svendowideit/zwift-coach-custom \
        --input description="In 3 months, hold >=700W for 60s..." \
        --input planSpecJson="$(cat plan-spec.json)"

      # Record how a session felt. This feeds the weekly review.
      swamp model @svendowideit/zwift-coach method run feedback zwift-coach \
        --input date=2026-11-18 --input enjoyment=3 --input bored=false

      # Weekly review: compare planned vs actual, adapt future weeks, render
      # and deliver. The trigger runs it Monday 06:00 host-local under serve.
      swamp workflow run @svendowideit/zwift-coach-review

      # Power targets use the rider's own curve, not FTP multiples. The coach
      # reads power-curve-current (5s/15s/60s/300s/1200s) and writes
      # FreeRide/MaxEffort blocks with the absolute watts in the text. If the
      # curve is missing, it inserts a week-0 test instead of guessing. Weight
      # is a separate lever: Z2 volume and weekly trend, not sprint intervals.
      # Sprint days use a 5-6 min rotating primer, separate torque/cadence
      # efforts, a 3 s lead-in, a 10-20 s ramp-down and 2-3 min easy recovery.
      # Delivery writes one folder per program, uses short names like
      # "W1 Torq 80rpm", prunes old coach files, and removes workouts.files so
      # Zwift reindexes on restart.

      # Deliver explicitly to a local Zwift workouts folder. riderId is the
      # numeric folder Zwift uses under Workouts/; replace 123456 with yours.
      swamp workflow run @svendowideit/zwift-coach-deliver-local \
        --input workoutsDir=$HOME/Documents/Zwift/Workouts \
        --input riderId=123456

      # Deliver over SSH through @swamp/ssh when Zwift runs on another host.
      # Only the address is required; user/key default to your ssh config.
      swamp workflow run @svendowideit/zwift-coach-deliver-ssh \
        --input sshAddress=macmini

      # Read the plan and check where delivery put the files.
      swamp data query 'behavior("zwift-coach") && name == "preview-current"' \
        --single --json --select content | jq -r '.markdown'
      swamp data query 'behavior("zwift-coach") && name == "delivery-current"' \
        --single --json --select content | jq '{winner,destination,warnings}'

  CONFIGURE

    Plan workflow inputs (`@svendowideit/zwift-coach-plan`):

      goal                 regain | improve | event (default improve)
      targetDate           YYYY-MM-DD for an event goal
      targetFtpPct         FTP improvement fraction (default 0.05)
      targetWeightKg       optional secondary weight target (default 65)
      daysPerWeek          override; 0 = infer from merged history
      hoursPerWeek         override; 0 = infer from merged history
      overrideAvailability use explicit values even above the historical p80
      backfillDays         Zwift window for backfill (default 3650)
      backfillMaxActivities max Zwift activities (default 2000)
      includeFit           parse Zwift FIT session NP only when not cached
      refreshDays          refresh detail for rides newer than this (7)
      force                ignore the cache and re-fetch every ride (repair)
      fitConcurrency       parallel FIT downloads during backfill (4)
      horizonDays          render this many days from the plan start (14)
      weeks                override plan length; 0 = goal default
      age                  override; 0 = Garmin/profile
      startDate            plan start (Monday); empty = next Monday
      autoDeliver          deliver after rendering (default true)
      dryRun               stage and report, write nothing (default false)

    Custom workflow inputs (`@svendowideit/zwift-coach-custom`):

      description          the rider's own goal words (required)
      planSpecJson         optional agent-authored PlanSpec JSON
      equipment            trainer, power_meter, erg, resistance, gym
      availableDays        ISO weekdays (1=Mon); empty = history
      indoorOnly           plan indoor sessions only
      injuries             injuries or constraints to respect
      targetWeightKg       0 = parse from the description
      weeks                0 = parse the horizon from the description
      style                optional pyramidal | polarised | sprint override

    Review workflow inputs (`@svendowideit/zwift-coach-review`):

      asOf                 review cutoff; empty = today
      autoAdapt            rewrite future weeks (default true)
      refreshDays          refresh recent ride detail (default 14)
      includeFit           parse FIT only when missing (default false)
      autoDeliver          deliver the adapted workouts (default true)

    Delivery inputs (all workflows):

      riderId              Zwift numeric ID; empty = profile-current.id
      workoutsDir          local/mounted Zwift workouts folder
      syncDir              folder replicated to the Zwift host
      bundleDir            bundle output (default .swamp/zwift-coach/bundles)
      subfolder            isolated folder name (default zwift-coach)
      prune                remove only our marked files not in this render
      sshModel             @swamp/ssh fleet name (default zwift-hosts)
      sshAddress           SSH address of the Zwift host
      sshUser              SSH user override (empty = current user/ssh config)
      sshPort              SSH port (default 22)
      sshKey               identity file override (empty = ssh config/agent)
      sshHostKeyChecking   yes | accept-new | no | off (default accept-new)
      hosts                @swamp/ssh host selector (default macmini)
      remoteWorkoutsDir    remote folder; empty = $HOME/Documents/Zwift/Workouts

    The plan uses the p80 of the merged Zwift+Garmin days/hours, the preferred
    weekdays/hours, and the p90 session length. It warns when an override is
    above that capacity. Weight is tracked from Garmin body data when present;
    ramp/recovery defaults use Garmin age when available, otherwise the
    explicit age, otherwise a conservative default.

  UPGRADE

    Run the INSTALL command again to replace the installed model and workflows
    with the current published version. Existing plan, render and delivery
    resources are kept; re-run the plan workflow to render and deliver with the
    new version.

  WHAT IT INSTALLS

    Nothing on the host by default — no services, daemons, or webhooks. It
    writes swamp resources, `.zwo` documents and, when you run a delivery
    workflow, files in the folder you choose. SSH delivery runs `ssh`/`scp`
    through `@swamp/ssh`; it does not install anything on the remote host. No
    credentials are stored by this extension; the Zwift session lives with
    `@svendowideit/zwift` in the `zwift-secrets` vault.

