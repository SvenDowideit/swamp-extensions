id: 4d0b6a5e-2f8c-4a71-9e15-6c9d2f0a1b34
name: "@svendowideit/zwift-coach-deliver"
description: |
  Deliver the rendered coach workouts, trying each channel in order:

    SSH (through @swamp/ssh) → local workouts folder → sync folder → bundle

  A failed check or clean delivery failure falls through to the next channel.
  Marker conflicts, changed host keys and invalid ZWO are hard errors and do
  not fall through. The winning channel writes delivery-current.

tags:
  domain: fitness
inputs:
  properties:
    riderName:
      type: string
      default: zwift-rider
      description: Zwift rider model instance name.
    coachName:
      type: string
      default: zwift-coach
      description: Coach model instance name.
    riderId:
      type: string
      default: ""
      description: Zwift numeric ID; empty = profile-current.id.
    sshModel:
      type: string
      default: zwift-hosts
      description: The @swamp/ssh fleet model instance name.
    sshAddress:
      type: string
      default: ""
      description: SSH address of the Zwift host; empty = skip SSH and fall back.
    sshUser:
      type: string
      default: ""
      description: SSH user; empty = your ssh config / agent default.
    sshPort:
      type: integer
      default: 22
      description: SSH port.
    sshKey:
      type: string
      default: ""
      description: Identity file; empty = your ssh config / agent default.
    sshHostKeyChecking:
      type: string
      enum: [yes, accept-new, no, off]
      default: accept-new
      description: OpenSSH StrictHostKeyChecking policy.
    hosts:
      type: string
      default: macmini
      description: Host name/selector in the @swamp/ssh fleet.
    remoteWorkoutsDir:
      type: string
      default: ""
      description: Base Zwift workouts folder on the remote host; empty = $HOME/Documents/Zwift/Workouts.
    workoutsDir:
      type: string
      default: ""
      description: Local/base Zwift workouts folder (same host or mounted).
    syncDir:
      type: string
      default: ""
      description: Folder replicated to the Zwift host.
    bundleDir:
      type: string
      default: ".swamp/zwift-coach/bundles"
      description: Portable bundle output directory (universal fallback).
    subfolder:
      type: string
      default: zwift-coach
      description: Isolated root folder under the rider ID / sync folder.
    horizonDays:
      type: integer
      default: 0
      description: Render this many days before delivery; 0 = the whole plan.
    prune:
      type: boolean
      default: true
      description: Remove only our marked files in this program folder not in this render.
    dryRun:
      type: boolean
      default: false
      description: Check/stage only; no copy or install.
  required: []
jobs:
  - name: deliver
    steps:
      - name: assert-plan
        description: Fail when there is no plan to render.
        task:
          type: assert
          expr: >-
            data.latest(inputs.coachName, "plan-current") != null
          message: >-
            No plan-current exists. Run @svendowideit/zwift-coach-plan or
            @svendowideit/zwift-coach-custom first.
          severity: high
        weight: 0
        allowFailure: false
      - name: render
        description: Render the current plan once for every delivery channel.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: render
          inputs:
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            horizonDays: ${{ inputs.horizonDays }}
        dependsOn:
          - step: assert-plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: ssh
        description: Try SSH/SCP through @swamp/ssh.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/zwift-coach-deliver-ssh"
          inputs:
            riderName: ${{ inputs.riderName }}
            coachName: ${{ inputs.coachName }}
            sshName: ${{ inputs.sshModel }}
            sshHost: ${{ inputs.hosts }}
            sshAddress: ${{ inputs.sshAddress }}
            sshUser: ${{ inputs.sshUser }}
            sshPort: ${{ inputs.sshPort }}
            sshKey: ${{ inputs.sshKey }}
            sshHostKeyChecking: ${{ inputs.sshHostKeyChecking }}
            hosts: ${{ inputs.hosts }}
            riderId: ${{ inputs.riderId }}
            remoteWorkoutsDir: ${{ inputs.remoteWorkoutsDir }}
            subfolder: ${{ inputs.subfolder }}
            horizonDays: ${{ inputs.horizonDays }}
            bundleDir: ${{ inputs.bundleDir }}
            prune: ${{ inputs.prune }}
            dryRun: ${{ inputs.dryRun }}
        dependsOn:
          - step: render
            condition:
              type: succeeded
        guard: ${{ inputs.sshAddress == "" }}
        weight: 0
        allowFailure: true
      - name: local
        description: Fall back to a local/mounted workouts folder.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: deliver
          inputs:
            render: ${{ data.latest(inputs.coachName, "render-current").attributes }}
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            mode: local
            workoutsDir: ${{ inputs.workoutsDir }}
            riderId: '${{ inputs.riderId != "" ? inputs.riderId : data.latest(inputs.riderName, "profile-current").attributes.id }}'
            subfolder: ${{ inputs.subfolder }}
            prune: ${{ inputs.prune }}
            dryRun: ${{ inputs.dryRun }}
        dependsOn:
          - step: ssh
            condition:
              type: always
        guard: ${{ has(steps.ssh) && steps.ssh.status == "succeeded" }}
        weight: 0
        allowFailure: true
      - name: sync
        description: Fall back to a synced folder.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: deliver
          inputs:
            render: ${{ data.latest(inputs.coachName, "render-current").attributes }}
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            mode: sync
            syncDir: ${{ inputs.syncDir }}
            subfolder: ${{ inputs.subfolder }}
            prune: ${{ inputs.prune }}
            dryRun: ${{ inputs.dryRun }}
        dependsOn:
          - step: local
            condition:
              type: always
        guard: ${{ (has(steps.ssh) && steps.ssh.status == "succeeded") || (has(steps.local) && steps.local.status == "succeeded") }}
        weight: 0
        allowFailure: true
      - name: bundle
        description: Write a portable bundle as the universal fallback.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: deliver
          inputs:
            render: ${{ data.latest(inputs.coachName, "render-current").attributes }}
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            mode: bundle
            bundleDir: ${{ inputs.bundleDir }}
            subfolder: ${{ inputs.subfolder }}
            dryRun: ${{ inputs.dryRun }}
        dependsOn:
          - step: sync
            condition:
              type: always
        guard: ${{ (has(steps.ssh) && steps.ssh.status == "succeeded") || (has(steps.local) && steps.local.status == "succeeded") || (has(steps.sync) && steps.sync.status == "succeeded") }}
        weight: 0
        allowFailure: false
