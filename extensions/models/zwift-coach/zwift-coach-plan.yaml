id: 6f2a1c7e-3b0d-4f5a-9c21-8d7e6b5a4c31
name: "@svendowideit/zwift-coach-plan"
description: |
  Full coach run: backfill Zwift (and optional Garmin) history, derive
  load/availability, compile a built-in goal, generate a 12-week plan, render
  the next two weeks of ZWO workouts, write a human-readable preview, then
  deliver the workouts.

  Delivery tries SSH (through @swamp/ssh), then a local workouts folder, then a
  sync folder, then a portable bundle. Set autoDeliver=false to render only.

  Manual run:
    swamp workflow run @svendowideit/zwift-coach-plan
    swamp workflow run @svendowideit/zwift-coach-plan --input goal=regain
    swamp workflow run @svendowideit/zwift-coach-plan --input goal=improve --input targetFtpPct=0.05
    swamp workflow run @svendowideit/zwift-coach-plan --input workoutsDir=/path/to/Zwift/Workouts
    swamp workflow run @svendowideit/zwift-coach-plan --input sshAddress=macmini.local --input sshUser=you
tags:
  domain: fitness
inputs:
  properties:
    riderName:
      type: string
      default: zwift-rider
      description: Zwift rider model instance name.
    coachName:
      type: string
      default: zwift-coach
      description: Coach model instance name.
    garminName:
      type: string
      default: garmin-activities
      description: Garmin activities model instance name (optional).
    bodyName:
      type: string
      default: garmin-body
      description: Garmin body model instance name (optional).
    healthName:
      type: string
      default: garmin-health
      description: Garmin health model instance name (optional).
    performanceName:
      type: string
      default: garmin-performance
      description: Garmin performance model instance name (optional).
    goal:
      type: string
      default: improve
      description: regain, improve or event.
    targetDate:
      type: string
      default: ""
      description: YYYY-MM-DD for an event goal.
    targetFtpPct:
      type: number
      default: 0.05
      description: FTP improvement fraction for the improve goal.
    targetWeightKg:
      type: number
      default: 65
      description: Optional secondary weight target.
    daysPerWeek:
      type: number
      default: 0
      description: Override days/week; 0 = infer from history.
    hoursPerWeek:
      type: number
      default: 0
      description: Override hours/week; 0 = infer from history.
    overrideAvailability:
      type: boolean
      default: false
      description: Use explicit days/hours even if above the historical p80.
    backfillDays:
      type: integer
      default: 3650
      description: Zwift history window in days for backfill.
    backfillMaxActivities:
      type: integer
      default: 2000
      description: Maximum Zwift activities to request (page cap is 2000).
    includeFit:
      type: boolean
      default: true
      description: Parse Zwift FIT session NP only when it is not cached.
    refreshDays:
      type: integer
      default: 7
      description: Refresh detail for rides newer than this many days.
    force:
      type: boolean
      default: false
      description: Ignore the cache and re-fetch every ride (one-off repair).
    fitConcurrency:
      type: integer
      default: 4
      description: Parallel FIT downloads during a backfill (1-8).
    horizonDays:
      type: integer
      default: 14
      description: Render this many days from the plan start.
    weeks:
      type: integer
      default: 0
      description: Override plan length; 0 = goal default.
    age:
      type: number
      default: 0
      description: Override age; 0 = Garmin/profile.
    startDate:
      type: string
      default: ""
      description: Plan start (Monday); empty = next Monday.
    autoDeliver:
      type: boolean
      default: true
      description: Deliver automatically when the plan validates.
    riderId:
      type: string
      default: ""
      description: Zwift numeric ID for local delivery; empty = profile-current.id.
    sshModel:
      type: string
      default: zwift-hosts
      description: The @swamp/ssh fleet model for SSH delivery.
    sshAddress:
      type: string
      default: ""
      description: SSH address of the Zwift host; empty = no SSH, use local/sync/bundle.
    sshUser:
      type: string
      default: ""
      description: SSH user; empty = your ssh config / agent default.
    sshPort:
      type: integer
      default: 22
      description: SSH port.
    sshKey:
      type: string
      default: ""
      description: Identity file; empty = your ssh config / agent default.
    sshHostKeyChecking:
      type: string
      enum: [yes, accept-new, no, off]
      default: accept-new
      description: OpenSSH StrictHostKeyChecking policy.
    hosts:
      type: string
      default: macmini
      description: Host selector in the @swamp/ssh fleet.
    remoteWorkoutsDir:
      type: string
      default: ""
      description: Base Zwift workouts folder on the remote host; empty = $HOME/Documents/Zwift/Workouts.
    workoutsDir:
      type: string
      default: ""
      description: Local/mounted Zwift workouts folder, if available.
    syncDir:
      type: string
      default: ""
      description: Folder replicated to the Zwift host, if available.
    bundleDir:
      type: string
      default: ".swamp/zwift-coach/bundles"
      description: Portable bundle output directory.
    subfolder:
      type: string
      default: zwift-coach
      description: Isolated folder under the rider ID / sync folder.
    prune:
      type: boolean
      default: false
      description: Remove only our marked files not in this render.
    dryRun:
      type: boolean
      default: false
      description: Check/stage only; no copy or install.
  required: []
jobs:
  - name: plan
    description: Backfill, analyse, compile the goal, plan, render and preview.
    steps:
      - name: backfill
        description: >
          Fetch every available Zwift ride, enrich it, parse FIT for NP, and
          merge the Garmin activity list when that model exists.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-rider"
          modelName: ${{ inputs.riderName }}
          methodName: backfill
          inputs:
            backfillDays: ${{ inputs.backfillDays }}
            backfillMaxActivities: ${{ inputs.backfillMaxActivities }}
            includeDetail: true
            includeFit: ${{ inputs.includeFit }}
            refreshDays: ${{ inputs.refreshDays }}
            force: ${{ inputs.force }}
            fitConcurrency: ${{ inputs.fitConcurrency }}
            includeGarmin: true
            garminActivities: ${{ data.latest(inputs.garminName, "activity-list").?attributes.?activities.orValue([]) }}
        weight: 0
        allowFailure: false
      - name: analyze
        description: Build the fitness snapshot from the data-owner resources.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: analyze
          inputs:
            profile: ${{ data.latest(inputs.riderName, "profile-current").attributes }}
            ability: ${{ data.latest(inputs.riderName, "ability-current").attributes }}
            loadDaily: ${{ data.latest(inputs.riderName, "load-daily").attributes }}
            historyYears: ${{ data.latest(inputs.riderName, "history-years").attributes }}
            availability: ${{ data.latest(inputs.riderName, "availability-current").attributes }}
            trainingHistory: ${{ data.latest(inputs.riderName, "training-history").attributes }}
            bodyRange: ${{ data.latest(inputs.bodyName, "body-range").?attributes.orValue(null) }}
            healthRange: ${{ data.latest(inputs.healthName, "health-range").?attributes.orValue(null) }}
            performanceRange: ${{ data.latest(inputs.performanceName, "performance-range").?attributes.orValue(null) }}
            age: ${{ inputs.age }}
        dependsOn:
          - step: backfill
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: goal
        description: Compile the built-in goal using history-derived availability.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: goal
          inputs:
            fitness: ${{ data.latest(inputs.coachName, "fitness-current").attributes }}
            mode: ${{ inputs.goal }}
            targetDate: ${{ inputs.targetDate }}
            targetFtpPct: ${{ inputs.targetFtpPct }}
            targetWeightKg: ${{ inputs.targetWeightKg }}
            daysPerWeek: ${{ inputs.daysPerWeek }}
            hoursPerWeek: ${{ inputs.hoursPerWeek }}
            overrideAvailability: ${{ inputs.overrideAvailability }}
            age: ${{ inputs.age }}
        dependsOn:
          - step: analyze
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: plan
        description: Generate the periodised weeks and sessions.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: plan
          inputs:
            fitness: ${{ data.latest(inputs.coachName, "fitness-current").attributes }}
            goal: ${{ data.latest(inputs.coachName, "goal-current").attributes }}
            startDate: ${{ inputs.startDate }}
            weeks: ${{ inputs.weeks }}
        dependsOn:
          - step: goal
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: render
        description: Render the next horizon of sessions as ZWO workouts.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: render
          inputs:
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            horizonDays: ${{ inputs.horizonDays }}
        dependsOn:
          - step: plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: preview
        description: Write the human-readable week-by-week preview.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: preview
          inputs:
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            render: ${{ data.latest(inputs.coachName, "render-current").attributes }}
        dependsOn:
          - step: render
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: has-plan
        description: Fail with a clear message if no sessions were rendered.
        task:
          type: assert
          expr: >-
            size(data.latest(inputs.coachName, "render-current").attributes.workouts) > 0
          message: >-
            No workouts were rendered. Check the backfill/analyze/plan logs and
            that the rider has enough history.
          severity: high
        dependsOn:
          - step: preview
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: deliver
        description: Deliver the rendered workouts through the fallback chain.
        task:
          type: workflow
          workflowIdOrName: "@svendowideit/zwift-coach-deliver"
          inputs:
            riderName: ${{ inputs.riderName }}
            coachName: ${{ inputs.coachName }}
            riderId: ${{ inputs.riderId }}
            sshModel: ${{ inputs.sshModel }}
            sshAddress: ${{ inputs.sshAddress }}
            sshUser: ${{ inputs.sshUser }}
            sshPort: ${{ inputs.sshPort }}
            sshKey: ${{ inputs.sshKey }}
            sshHostKeyChecking: ${{ inputs.sshHostKeyChecking }}
            hosts: ${{ inputs.hosts }}
            remoteWorkoutsDir: ${{ inputs.remoteWorkoutsDir }}
            workoutsDir: ${{ inputs.workoutsDir }}
            syncDir: ${{ inputs.syncDir }}
            bundleDir: ${{ inputs.bundleDir }}
            subfolder: ${{ inputs.subfolder }}
            prune: ${{ inputs.prune }}
            dryRun: ${{ inputs.dryRun }}
        guard: ${{ inputs.autoDeliver == false }}
        dependsOn:
          - step: has-plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: howto
        description: Print the commands for inspecting the plan and workouts.
        task:
          type: model_method
          modelType: "@svendowideit/zwift-coach"
          modelName: ${{ inputs.coachName }}
          methodName: howto
          inputs:
            coachName: ${{ inputs.coachName }}
            plan: ${{ data.latest(inputs.coachName, "plan-current").attributes }}
            render: ${{ data.latest(inputs.coachName, "render-current").attributes }}
        dependsOn:
          - step: has-plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
