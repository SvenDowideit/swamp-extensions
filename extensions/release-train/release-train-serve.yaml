id: a668ded9-f69a-420c-b27d-495ee14cfac2
name: '@svendowideit/release-train-serve'
description: |
  Draw the dependency graph of every extension *installed on (available to)
  this swamp serve* — the pulled extensions cache — plus the extensions they
  use, annotated with on-disk and published (stable / rc / beta) versions,
  publish state, hygiene compliance, and test depth, and print an ordered
  publish plan.

  Unlike `@svendowideit/release-train`, this variant does not scan the worktree
  (`extensions/`) for git-tracked manifests; it scans the installed extension
  cache, with gitOnly disabled, so it reflects what this serve can actually
  run. It carries the pulled-version/channel, registry pull counts and the
  triggers declared in `.swamp/serve.yaml` alongside the relationship diagram
  and tables.

  Analyze every installed extension and render the diagram, matrix and plan:
    swamp workflow run @svendowideit/release-train-serve

  Skip the slower hygiene checks:
    swamp workflow run @svendowideit/release-train-serve --input runChecks=false

  Run offline (published versions come from the lockfile):
    swamp workflow run @svendowideit/release-train-serve --input offline=true
tags: {}
inputs:
  properties:
    offline:
      type: boolean
      default: false
      description: Skip registry lookups and network checks; published versions come from the lockfile.
    runChecks:
      type: boolean
      default: true
      description: Run the quality/fmt/deno/workflow-validate/push-dry-run hygiene checks.
    concurrency:
      type: integer
      default: 4
      description: How many extensions to check in parallel.
    threshold:
      type: integer
      default: 75
      description: Documentation score below which an extension is advised to stay on beta.
    includeExternal:
      type: boolean
      default: true
      description: Show and query dependencies that are not in this repo as external nodes.
    metaModel:
      type: string
      default: meta-factory
      description: Meta-factory model whose score/summary resources are read for docs and coverage.
    markdownFile:
      type: string
      default: release-train-serve.md
      description: Path for the one-file dashboard. Empty disables the write.
  required: []
jobs:
  - name: analyze
    description: Analyze every installed extension and render the release dashboard.
    steps:
      - name: analyze
        description: Discover installed manifests, graph them, gather status, write the diagram and plan.
        task:
          type: model_method
          modelType: "@svendowideit/release-train"
          modelName: release-train
          methodName: analyze
          inputs: {}
          globalArgs:
            root: .swamp/pulled-extensions
            gitOnly: false
            offline: ${{ inputs.offline }}
            runChecks: ${{ inputs.runChecks }}
            concurrency: ${{ inputs.concurrency }}
            threshold: ${{ inputs.threshold }}
            includeExternal: ${{ inputs.includeExternal }}
            metaModel: ${{ inputs.metaModel }}
            markdownFile: ${{ inputs.markdownFile }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
reports:
  require:
    - "@svendowideit/release-train-report"
version: 1