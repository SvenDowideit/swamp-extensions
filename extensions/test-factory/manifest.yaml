manifestVersion: 1
name: "@svendowideit/test-factory"
version: "2026.10.02.1"
description: >
  Run a swamp extension inside containers on different Linux distributions and
  swamp deployment topologies, and report exactly where it breaks. Prefer it
  over testing by hand: the scenarios are repeatable, each layer of failure
  (install, load, definitions, method runs) is reported separately, and the same
  command covers Alpine, Debian, Ubuntu, Fedora, Rocky, systemd and non-systemd
  hosts, a standalone node, a `swamp serve` orchestrator, and a fleet of
  enrolled workers.

  WHAT IT DOES

    An extension can document perfectly and still fail to install, register,
    define or run on a given host. This extension closes that gap: it boots the
    candidate in a fresh container of a chosen distro, installs swamp, registers
    the extension, and checks each layer in turn — swamp installs and
    `swamp doctor extensions` passes, every declared type registers,
    `swamp model create` works, each declared workflow validates, and any
    fixtures execute. A candidate may ship a `test-factory.yaml` declaring the
    user-facing outcomes it promises as prose plus runnable, asserting steps;
    the `tests` phase runs them and reports each with its full logs. That same
    file can declare a container test system (`networks:`, `harness:`,
    `services:`) so outcomes that need sibling services — an authoritative DNS
    server to write records into, a database, a peer node — are testable too:
    it creates the networks, builds and health-checks the services, joins the
    swamp container to several networks (so one name can resolve to several
    endpoints), and exports each address to the steps as a shell variable.
    Every run records an audit trail, not just a pass/fail: the candidate name
    and version, a one-line intent, and per phase the assertion a PASS stands
    for plus the literal commands that proved it — so you can judge adequacy and
    whether the test did what it claims. Alpine (musl-only) is expected to
    fail, proving the harness diagnoses not hangs.

  INSTALL

      swamp extension pull @svendowideit/test-factory

  DEPENDENCIES

    A local container runtime — Docker by default (set `dockerBinary` for
    podman) — able to build images and run privileged containers for the systemd
    scenarios. The only network access is the swamp release download, plus any
    images a candidate's declared services pull or build. No swamp-club account
    is required by default, because `serve`/`fleet` run `swamp serve` on
    loopback with `--auth-mode none`; a host where that team feature is gated
    reads a token from the `test-factory-vault` vault, below. The systemd-creds
    vault used in the example needs systemd v256+.

  RUN

      # Test one extension on one distro before you call it done — the fast,
      # dependency-free smoke + load + definitions path.
      swamp model @svendowideit/test-factory method run test tf \
        --input manifest=extensions/models/systemd-service/manifest.yaml \
        --input scenario=ubuntu-systemd-standalone

      # Fan out across the default matrix — every runnable standalone distro —
      # when you want to know which distros a change broke.
      swamp model @svendowideit/test-factory method run test tf \
        --input manifest=extensions/models/caddy/manifest.yaml \
        --input distro=ubuntu,fedora,rocky

      # Run an extension's own documented acceptance tests. When the candidate
      # ships a `test-factory.yaml` (listed in its manifest `additionalFiles:`),
      # the `tests` phase is added automatically and each test is reported with
      # its prose and full logs. This runs test-factory's own tests, which ship
      # in `extensions/test-factory/acceptance/test-factory.yaml`.
      swamp model @svendowideit/test-factory method run test tf \
        --input manifest=extensions/test-factory/manifest.yaml \
        --input scenario=debian-standalone

      # Test an outcome that needs sibling containers. The candidate's
      # `test-factory.yaml` declares a container test system, so the factory
      # brings up its services and networks before running the steps. This is
      # @svendowideit/caddy's DNS suite: a BIND container Caddy writes records
      # into over RFC2136, verified with dig and curl (200/418/404) from the
      # two-network swamp container. The caddy model drives a systemd *user*
      # service, so run it on a systemd distro.
      swamp model @svendowideit/test-factory method run test tf \
        --input manifest=extensions/models/caddy/manifest.yaml \
        --input scenario=ubuntu-systemd-standalone

      # Exercise remote execution: a serve orchestrator plus two workers that
      # run the dispatched probe step.
      swamp model @svendowideit/test-factory method run test tf \
        --input manifest=extensions/models/github-release-install/manifest.yaml \
        --input topology=fleet --input workers=2

      # Run a workflow that gates on the result — fails the run when any
      # scenario does not behave as expected (use it in CI).
      swamp workflow run @svendowideit/test-factory \
        --input manifest=extensions/test-factory/manifest.yaml \
        --input scenario=debian-standalone

      # On a host where `swamp serve` is gated, give every container a
      # collective API token. The factory reads it from the vault named
      # `test-factory-vault` under the key `SWAMP_API_KEY` (override with the
      # `vault`/`vaultEntry` globals), so create that vault, mint a token, and
      # store it — every run then picks it up with no extra arguments.
      swamp auth token create --collective my-collective --scopes 'serve:*'
      swamp vault create @svendowideit/systemd-creds test-factory-vault
      swamp vault put test-factory-vault SWAMP_API_KEY   # paste the token
      swamp model @svendowideit/test-factory method run test tf \
        --input manifest=extensions/models/caddy/manifest.yaml \
        --input topology=fleet --input workers=2

      # Read the per-scenario breakdown from the last run.
      swamp report get @svendowideit/test-factory-report \
        --model tf --markdown

  CONFIGURE

    Global arguments (set at creation with `--global-arg`, or per call):

      dockerBinary     container CLI to drive              (default docker)
      swampVersion     swamp release tag under test        (default latest)
      releaseBaseUrl   release download base URL           (default GitHub)
      defaultPhases    phases when a run does not override (default
                       smoke,load,definitions)
      workers          worker count for `fleet` scenarios  (default 2)
      keepOnFailure    leave containers up on failure      (default false)
      probe            run the serve/fleet dispatch probe  (default true)
      vault            vault the API key is read from
                                              (default test-factory-vault)
      vaultEntry         secret key read from that vault
                                              (default SWAMP_API_KEY)
      swampApiKey      collective API token, exported as SWAMP_API_KEY in every
                       container. Leave empty (the default) and it is read from
                       `vault`/`vaultEntry`; a literal is rejected because the
                       field is sensitive, so an override must be a vault
                       expression: 'swampApiKey=${{ vault.get(<vault>, <key>) }}'

    Per-run overrides: `manifest` (required), `scenario`, `distro`, `topology`,
    `systemd`, `workers`, `phases`, `fixturesFile`, `scenarioFile`, `expected`
    on `test`; `root` and `gitOnly` additionally on `testAll`; `prefix` on
    `cleanup`; `distro` on `listScenarios`.

  WHAT IT INSTALLS

    Nothing on the host — no services, daemons, cron triggers, or webhooks. It
    builds local container images named `swamp-test-factory/<distro>` (and
    `swamp-test-factory/svc-<name>` for a candidate's `build:` services) and runs
    short-lived containers and networks prefixed `tf-`, all removed at the end of
    a scenario unless `keepOnFailure` is set. It writes swamp resources (`result`
    per scenario, `summary` per fan-out) and never modifies the extension it
    tests.

repository: https://github.com/svendowideit/swamp-extensions

