manifestVersion: 1
name: "@svendowideit/systemd-creds"
version: "2026.08.12.1"
description: "Vault backend that stores secrets encrypted at rest using systemd-creds --user (AES256-GCM, bound to UID + machine-id). Requires systemd v256+."

