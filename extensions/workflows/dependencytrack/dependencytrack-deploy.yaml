id: c9763f1f-f6ca-4ebb-8313-eee9c3007ea2
name: '@svendowideit/dependencytrack-deploy'
description: |
  Deploy Dependency-Track v5 end to end: PostgreSQL, the API server and
  frontend, an agent API key, and (when Caddy is present) TLS proxying plus a
  verification assert.

  Order: postgres → dependencytrack install → bootstrap the agent key → Caddy
  proxies → verify.

  The database is provided by the `postgres` workflow (idempotent). The
  Dependency-Track model is fed that database's non-secret connection facts with
  CEL and its password from the vault. bootstrapAgentKey rotates the forced
  first-login admin password, creates the `automation` team, mints an API key,
  and stores it in the vault — so a later SBOM model can read it with
  vault.get(...).

  Caddy: if you pass caddyModel and caddyBaseDomain, this workflow proxies
  dependencytrack.<domain> → the frontend and backend.dependencytrack.<domain>
  → the API server over TLS. Adding a route in @svendowideit/caddy automatically
  adds the hostname to that Caddy's TLS subjects and (when a DNS provider is
  configured) its dnsRecords, so the two hostnames get a certificate and an A
  record without hand-listing them; the workflow then applies the records. If no
  Caddy model is named the Caddy steps are skipped and the stack still deploys.

  Run (local, no TLS):
    swamp workflow run dependencytrack-deploy \
      --input dbVaultName=postgres-secrets \
      --input vaultName=dependencytrack-secrets

  Run (with Caddy TLS; the caddy model must already have configureTls run so it
  has a DNS provider and ACME email):
    swamp workflow run dependencytrack-deploy \
      --input caddyModel=my-caddy --input caddyBaseDomain=example.com \
      --input publicBackendUrl=https://backend.dependencytrack.example.com \
      --input publicFrontendUrl=https://dependencytrack.example.com
tags: {}
inputs:
  properties:
    postgresModel:
      type: string
      default: postgres
      description: Name of the @svendowideit/postgres model instance to drive.
    dbVaultName:
      type: string
      description: Vault holding the database password (used by the postgres workflow).
    dbPasswordKey:
      type: string
      default: POSTGRES_PASSWORD
      description: Vault key holding the database password.
    dtModel:
      type: string
      default: dependencytrack
      description: Name of the @svendowideit/dependencytrack model instance to drive.
    vaultName:
      type: string
      description: Vault for the DT admin password and agent API key.
    network:
      type: string
      default: swamp-postgres
      description: Container network shared by the database and the DT services.
    apiPort:
      type: integer
      default: 8080
      description: Host port for the DT API server.
    uiPort:
      type: integer
      default: 8081
      description: Host port for the DT frontend.
    publicBackendUrl:
      type: string
      default: ""
      description: Public API base URL (baked into the frontend). Empty = localhost.
    publicFrontendUrl:
      type: string
      default: ""
      description: Public frontend URL (CORS allow-origin). Empty = localhost.
    caddyModel:
      type: string
      default: ""
      description: >-
        Name of a @svendowideit/caddy model to proxy through. Empty disables the
        Caddy steps.
    caddyBaseDomain:
      type: string
      default: ""
      description: >-
        The base domain your caddy model uses (its baseDomain global, e.g.
        fi.gy). Required when caddyModel is set. The proxy hostnames become
        dependencytrack.<caddyBaseDomain> and backend.dependencytrack.<caddyBaseDomain>.
  required:
    - dbVaultName
    - vaultName
jobs:
  - name: main
    description: Database, Dependency-Track, agent key, Caddy, verify.
    steps:
      - name: database
        description: Ensure PostgreSQL is provisioned (idempotent).
        task:
          type: workflow
          workflowIdOrName: '@svendowideit/postgres-provision'
          inputs:
            modelName: ${{ inputs.postgresModel }}
            vaultName: ${{ inputs.dbVaultName }}
            network: ${{ inputs.network }}
        dependsOn: []
        weight: 0
        allowFailure: false

      - name: install
        description: Deploy the DT API server and frontend against the database.
        task:
          type: model_method
          modelType: "@svendowideit/dependencytrack"
          modelName: ${{ inputs.dtModel }}
          methodName: install
          globalArgs:
            vaultName: ${{ inputs.vaultName }}
            network: ${{ inputs.network }}
            apiPort: ${{ inputs.apiPort }}
            uiPort: ${{ inputs.uiPort }}
            publicBackendUrl: ${{ inputs.publicBackendUrl }}
            publicFrontendUrl: ${{ inputs.publicFrontendUrl }}
          inputs:
            dbHost: ${{ data.latest(inputs.postgresModel, "connection").attributes.host }}
            dbPort: ${{ data.latest(inputs.postgresModel, "connection").attributes.port }}
            dbDatabase: ${{ data.latest(inputs.postgresModel, "connection").attributes.database }}
            dbUsername: ${{ data.latest(inputs.postgresModel, "connection").attributes.username }}
            dbPassword: ${{ vault.get(inputs.dbVaultName, inputs.dbPasswordKey) }}
        dependsOn:
          - step: database
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: bootstrap-agent-key
        description: >-
          Rotate the forced admin password, create the agent team, mint an API
          key, and store it in the vault.
        task:
          type: model_method
          modelType: "@svendowideit/dependencytrack"
          modelName: ${{ inputs.dtModel }}
          methodName: bootstrapAgentKey
          globalArgs:
            vaultName: ${{ inputs.vaultName }}
            network: ${{ inputs.network }}
            publicBackendUrl: ${{ inputs.publicBackendUrl }}
          inputs: {}
        dependsOn:
          - step: install
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: caddy-frontend
        description: Proxy dependencytrack.<baseDomain> → the DT frontend over TLS.
        task:
          type: model_method
          modelType: "@svendowideit/caddy"
          modelName: ${{ inputs.caddyModel }}
          methodName: ensureDnsProxy
          inputs:
            hostname: ${{ "dependencytrack." + inputs.caddyBaseDomain }}
            upstream: ${{ "127.0.0.1:" + string(inputs.uiPort) }}
        dependsOn:
          - step: bootstrap-agent-key
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
        guard: ${{ inputs.caddyModel == "" }}

      - name: caddy-backend
        description: Proxy backend.dependencytrack.<baseDomain> → the DT API server over TLS.
        task:
          type: model_method
          modelType: "@svendowideit/caddy"
          modelName: ${{ inputs.caddyModel }}
          methodName: ensureDnsProxy
          inputs:
            hostname: >-
              ${{ "backend.dependencytrack." + inputs.caddyBaseDomain }}
            upstream: ${{ "127.0.0.1:" + string(inputs.apiPort) }}
        dependsOn:
          - step: bootstrap-agent-key
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
        guard: ${{ inputs.caddyModel == "" }}

      - name: caddy-apply-dns
        description: >-
          Apply the A records the two hostnames implied — @svendowideit/caddy
          derives them from the routes, but writing them is its own step. Fails
          only if the caddy model has no DNS provider configured.
        task:
          type: model_method
          modelType: "@svendowideit/caddy"
          modelName: ${{ inputs.caddyModel }}
          methodName: applyDnsRecords
          inputs: {}
        dependsOn:
          - step: caddy-backend
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: ${{ inputs.caddyModel == "" }}

      - name: status
        description: Confirm the DT API server and frontend are up.
        task:
          type: model_method
          modelType: "@svendowideit/dependencytrack"
          modelName: ${{ inputs.dtModel }}
          methodName: status
          globalArgs:
            vaultName: ${{ inputs.vaultName }}
            network: ${{ inputs.network }}
            apiPort: ${{ inputs.apiPort }}
            uiPort: ${{ inputs.uiPort }}
        dependsOn:
          - step: bootstrap-agent-key
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: verify-api-ready
        description: Assert the Dependency-Track API server is answering.
        task:
          type: assert
          expr: >-
            data.latest(inputs.dtModel, "status").attributes.apiReady == true
          message: >-
            Dependency-Track API is not ready: state=${{ data.latest(inputs.dtModel, "status").attributes.apiState }}
          severity: high
        dependsOn:
          - step: status
            condition:
              type: succeeded
        weight: 0
        allowFailure: false

      - name: verify-frontend-running
        description: Assert the Dependency-Track frontend container is running.
        task:
          type: assert
          expr: >-
            data.latest(inputs.dtModel, "status").attributes.frontendRunning == true
          message: >-
            Dependency-Track frontend is not running: state=${{ data.latest(inputs.dtModel, "status").attributes.frontendState }}
          severity: high
        dependsOn:
          - step: status
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
