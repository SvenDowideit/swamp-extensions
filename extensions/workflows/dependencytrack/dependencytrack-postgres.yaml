id: 0172080d-ed5b-473f-b275-958760ab4e1b
name: '@svendowideit/dependencytrack-postgres'
description: |
  Provision and configure the PostgreSQL database Dependency-Track uses.

  This is a thin, named wrapper around the reusable `postgres` workflow, kept so
  a Dependency-Track deployment reads as its component steps. Idempotent — safe
  to re-run. It writes the database's non-secret `connection` resource and stores
  the generated password in the vault; the dependencytrack-deploy workflow then
  feeds both into @svendowideit/dependencytrack.

  Run:
    swamp workflow run dependencytrack-postgres --input vaultName=postgres-secrets
tags: {}
inputs:
  properties:
    modelName:
      type: string
      default: postgres
      description: Name of the @svendowideit/postgres model instance to drive.
    vaultName:
      type: string
      description: Vault that holds the generated database password (required).
    database:
      type: string
      default: dtrack
      description: Application database for Dependency-Track.
    username:
      type: string
      default: dtrack
      description: Application role that owns the database.
    network:
      type: string
      default: swamp-postgres
      description: Container network the database and DT services share.
    dataDir:
      type: string
      default: ~/.local/share/swamp-postgres
      description: Host directory persisted as the data volume.
  required:
    - vaultName
jobs:
  - name: main
    description: Delegate to the reusable postgres workflow.
    steps:
      - name: database
        description: Provision and configure Postgres.
        task:
          type: workflow
          workflowIdOrName: '@svendowideit/postgres-provision'
          inputs:
            modelName: ${{ inputs.modelName }}
            vaultName: ${{ inputs.vaultName }}
            database: ${{ inputs.database }}
            username: ${{ inputs.username }}
            network: ${{ inputs.network }}
            dataDir: ${{ inputs.dataDir }}
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
