id: f04794eb-33d9-443f-a582-3f12699c54e1
name: "@svendowideit/news"
description: |
  Full news feedback loop — gathers feedback from the queue server, fetches
  feeds from the catalog, generates an HTML summary ranked by your
  preferences, then discovers new RSS feeds from the article URLs and
  upserts them into the catalog for the next run, finally rendering
  feeds.html (a duplicate-grouped catalog listing).

  Loop: gather-feedback → dedupe (flag duplicate catalog feeds) → fetch → dedupe-articles (merge duplicate articles by URL) → filter by age (default: last 3 days) → generate HTML → discover new feeds → upsert into catalog → generate feeds.html listing

  Setup (one-time): add feeds to the catalog:
    swamp model create @svendowideit/feed-catalog feed-catalog
    swamp model method run feed-catalog add --input url="https://hnrss.org/frontpage" --input category=tech
    swamp model method run feed-catalog add --input url="https://feeds.bbci.co.uk/news/rss.xml" --input category=news

  Run the workflow (fetches catalog feeds, generates news.html and feeds.html):
    swamp workflow run news

  Then view the results (served by scripts/feedback-server.ts):
    open http://localhost:8765            # news.html
    open http://localhost:8765/feeds.html  # feeds listing

tags: {}
trigger:
  schedule: 0 */4 * * *
  inputs:
    feeds: []
    discoverNewFeeds: true
inputs:
  properties:
    feeds:
      type: array
      items:
        type: string
      default: []
      description: RSS/Atom feed URLs to fetch (overrides catalog if non-empty).
    action:
      type: string
      enum:
      - fetch_generate
      - feedback
      default: fetch_generate
      description: Whether to fetch+generate+discover, or record feedback.
    articleId:
      type: string
      default: ''
      description: Article ID for feedback (from the HTML page).
    feedbackAction:
      type: string
      enum:
      - interested
      - ignored
      default: interested
      description: Whether the user found the article interesting or ignored it.
    source:
      type: string
      default: ''
      description: Feed source name (for feedback).
    title:
      type: string
      default: ''
      description: Article title (for feedback).
    topN:
      type: integer
      default: 0
      description: Number of articles in the HTML report (0 = all).
    discoverNewFeeds:
      type: boolean
      default: true
      description: Whether to discover new feeds from article URLs after generating
        the report.
    maxSitesToCrawl:
      type: integer
      default: 10
      description: Maximum new domains to crawl for feed discovery.
    dryRun:
      type: boolean
      default: false
      description: If true, discover feeds but don't add them to the catalog.
    category:
      type: string
      default: discovered
      description: Category tag for discovered feeds in the catalog.
    newsAge:
      type: string
      default: 3d
      description: Time range of news to show (e.g., 2h, 7d, 4w, 1m). Supports h (hours),
        d (days), w (weeks), m (months). Defaults to 3 days.
    feedbackServerUrl:
      type: string
      default: http://localhost:8765
      description: URL of the feedback queue HTTP server.
    feedbackBatchSize:
      type: integer
      default: 100
      description: Number of feedback entries to process per batch.
    feedbackMaxBatches:
      type: integer
      default: 20
      description: Maximum number of batches to process in one run.
    pagesServerUrl:
      type: string
      default: http://localhost:8765
      description: URL of the pages queue HTTP server.
    pagesBatchSize:
      type: integer
      default: 100
      description: Number of queued pages to process per batch.
    pagesMaxBatches:
      type: integer
      default: 20
      description: Maximum number of batches to process in one run.
    pagesCategory:
      type: string
      default: discovered
      description: Category tag for queued pages when added to the catalog.
    maxPagesPerRun:
      type: integer
      default: 50
      description: Maximum number of gathered pages to analyze for feed discovery
        per run.
    probeCommonPaths:
      type: boolean
      default: true
      description: When no feed link is advertised, probe common feed paths on the
        page's site root.
    outputPath:
      type: string
      default: news.html
      description: If set, write the generated HTML to this local file path (e.g.,
        news.html).
  required: []
reports:
  require:
  - '@svendowideit/news-html-report'
jobs:
- name: main
  description: Gather feedback, fetch feeds, filter by age, generate HTML, discover
    new feeds for next run.
  steps:
  - name: gather-feedback
    description: Poll the feedback queue server and import any pending feedback entries
      into preferences.
    task:
      type: model_method
      modelType: '@svendowideit/news-reader'
      modelName: news-reader
      methodName: gatherFeedback
      inputs:
        serverUrl: ${{ inputs.feedbackServerUrl }}
        batchSize: ${{ inputs.feedbackBatchSize }}
        maxBatches: ${{ inputs.feedbackMaxBatches }}
    dependsOn: []
    weight: 0
    allowFailure: true
  - name: dedupe
    description: Fetch each catalog feed, group by content identity, and mark duplicate
      feeds so fetch skips them.
    task:
      type: model_method
      modelType: '@svendowideit/feed-catalog'
      modelName: feed-catalog
      methodName: dedupe
      inputs: {}
    dependsOn: []
    weight: 0
    allowFailure: true
  - name: gather-feed-state
    description: Poll the feedback server's /api/feed endpoint, apply enabled/disabled
      state to the catalog, and delete processed entries.
    task:
      type: model_method
      modelType: '@svendowideit/feed-catalog'
      modelName: feed-catalog
      methodName: gatherFeedState
      inputs:
        serverUrl: ${{ inputs.feedbackServerUrl }}
        batchSize: ${{ inputs.feedbackBatchSize }}
        maxBatches: ${{ inputs.feedbackMaxBatches }}
    dependsOn:
    - step: dedupe
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: failed
    weight: 0
    allowFailure: true
  - name: fetch
    description: Fetch RSS feeds from the feed-catalog (or from --input feeds if provided),
      skipping feeds marked duplicate by the dedupe step.
    #guard: ${{ data.latest("news-reader", "feed-snapshot") != null && timestamp(run.startedAt)
    #  - timestamp(data.latest("news-reader", "feed-snapshot").attributes.fetchedAt)
    #  < duration("1h") }}
    task:
      type: model_method
      modelType: '@svendowideit/news-reader'
      modelName: news-reader
      methodName: fetch
      inputs:
        feeds: '${{ inputs.feeds.size() > 0 ? inputs.feeds : data.latest("feed-catalog",
          "current").?attributes.?feeds.orValue([]) }}'
    dependsOn:
    - step: dedupe
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: failed
    - step: gather-feed-state
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: failed
    weight: 0
    allowFailure: false
  - name: dedupe-articles
    description: Group articles by URL, mark duplicates, and annotate primary articles
      with duplicate source info so the filter step skips them and the HTML shows
      cross-feed indicators.
    task:
      type: model_method
      modelType: '@svendowideit/news-reader'
      modelName: news-reader
      methodName: dedupeArticles
      inputs: {}
    dependsOn:
    - step: fetch
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: filter
    description: 'Filter articles by age (default: last 3 days).'
    task:
      type: model_method
      modelType: '@svendowideit/news-reader'
      modelName: news-reader
      methodName: filterByAge
      inputs:
        newsAge: ${{ inputs.newsAge }}
    dependsOn:
    - step: dedupe-articles
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: generate
    description: Generate HTML report from filtered articles, ranked by preferences.
    task:
      type: model_method
      modelType: '@svendowideit/news-reader'
      modelName: news-reader
      methodName: generate
      inputs:
        topN: ${{ inputs.topN }}
        outputPath: ${{ inputs.outputPath }}
    dependsOn:
    - step: filter
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: generate-feeds-html
    description: Render a static feeds.html listing all catalog feeds, grouped by
      duplicates, with per-feed seen/read/interested/ignored article counts and a
      cross-link back to the news summary.
    task:
      type: model_method
      modelType: '@svendowideit/feed-catalog'
      modelName: feed-catalog
      methodName: generateFeedsHtml
      inputs:
        outputPath: feeds.html
        prefs: ${{ data.latest("news-reader", "prefs-current").?attributes.orValue({}) }}
        snapshot: ${{ data.latest("news-reader", "feed-snapshot").?attributes.orValue({}) }}
    dependsOn:
    - step: filter
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: discover
    description: Discover new RSS feeds from article URLs.
    task:
      type: model_method
      modelType: '@svendowideit/feed-discovery'
      modelName: feed-discovery
      methodName: discover
      inputs:
        maxSitesToCrawl: ${{ inputs.maxSitesToCrawl }}
        dryRun: ${{ inputs.dryRun }}
    dependsOn:
    - step: generate
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: upsert-feed #[${{ self.feed.title }}]
    description: Add each discovered feed to the feed-catalog.
    forEach:
      item: feed
      in: ${{ data.latest("feed-discovery", "discovery-result").?attributes.?discoveredFeeds.orValue([])
        }}
    concurrency: 3
    task:
      type: model_method
      modelType: '@svendowideit/feed-catalog'
      modelName: feed-catalog
      methodName: add
      inputs:
        url: ${{ self.feed.url }}
        category: ${{ inputs.category }}
        name: ${{ self.feed.title }}
    dependsOn:
    - step: discover
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: gather-pages
    description: Poll the pages queue server and collect queued page URLs into a data
      resource.
    task:
      type: model_method
      modelType: '@svendowideit/news-reader'
      modelName: news-reader
      methodName: gatherPages
      inputs:
        serverUrl: ${{ inputs.pagesServerUrl }}
        batchSize: ${{ inputs.pagesBatchSize }}
        maxBatches: ${{ inputs.pagesMaxBatches }}
        category: ${{ inputs.pagesCategory }}
    dependsOn: []
    weight: 0
    allowFailure: true
  - name: analyze-pages
    description: Analyze each gathered page and discover RSS/Atom feeds, writing a
      page-discovery-result resource.
    task:
      type: model_method
      modelType: '@svendowideit/feed-analysis'
      modelName: feed-analysis
      methodName: analyzePages
      inputs:
        maxPagesPerRun: ${{ inputs.maxPagesPerRun }}
        probeCommonPaths: ${{ inputs.probeCommonPaths }}
    dependsOn:
    - step: gather-pages
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  - name: upsert-page[${{ self.feed.title }}]
    description: Add each discovered page feed to the feed-catalog.
    forEach:
      item: feed
      in: ${{ data.latest("feed-analysis", "page-discovery-result").?attributes.?discoveredFeeds.orValue([])
        }}
    concurrency: 3
    task:
      type: model_method
      modelType: '@svendowideit/feed-catalog'
      modelName: feed-catalog
      methodName: add
      inputs:
        url: ${{ self.feed.url }}
        category: ${{ self.feed.category }}
        name: ${{ self.feed.title }}
    dependsOn:
    - step: analyze-pages
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
  dependsOn: []
  weight: 0
version: 1
