manifestVersion: 1
name: "@svendowideit/news"
version: "2026.08.22.1"
description: >
  The full news stack — feed discovery, catalog management, preference-aware
  fetching, LLM story fusion, and static HTML rendering. Ships four model
  extensions (news-feed-discovery, news-feed-catalog, news-reader, news-feed-analysis), one
  report extension (news_html_report), the four news workflows (news-fetch, news-fusion,
  news-curation, news-full), and the decoupled feedback server that closes the
  👍/👎 loop between the generated HTML page and the workflows.

  Install: swamp extension pull @svendowideit/news. Model instances
  (local-news, feed-catalog, feed-discovery, feed-analysis) are auto-registered
  by the workflows on first run — no manual swamp model create needed.
  Setup: swamp model @svendowideit/news-reader method run setup local-news
  (set llmModel + llmBaseUrl to enable LLM fusion).
  Run: swamp workflow run @svendowideit/news-fetch | @svendowideit/news-fusion | @svendowideit/news-curation | @svendowideit/news-full.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - news_reader.ts
  - feed_catalog.ts
  - feed_discovery.ts
  - feed_analysis.ts

reports:
  - news_html_report.ts

workflows:
  - news.yaml
  - news-fusion.yaml
  - news-curation.yaml
  - news-full.yaml

additionalFiles:
  - README.md
  - LICENSE.txt
  - scripts/feedback-server.ts
  - scripts/README.md
  - docs/news-fusing.md
  - docs/PLAN.md
  - docs/LLM-FUSION.md

platforms: []
