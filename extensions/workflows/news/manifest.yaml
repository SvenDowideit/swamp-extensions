manifestVersion: 1
name: "@svendowideit/news"
version: "2026.10.18.1"
description: >
  The full news stack: feed discovery, catalog management, preference-aware
  fetching, LLM story fusion, and static HTML rendering — plus a decoupled
  feedback server that closes the 👍/👎 loop between the rendered page and the
  workflows.

  WHAT IT DOES

    Turns a pile of RSS/Atom feeds into a ranked, deduplicated, optionally
    LLM-fused news digest, rendered as a static HTML page you can read or host.
    It discovers feeds, keeps a catalog of them, fetches and deduplicates
    articles, learns your preferences from interested/ignored feedback, and
    remembers what you have read and seen so those articles are hidden on the
    next render. Clusters related articles into one story, and — if you point
    it at an OpenAI-compatible LLM — fuses each cluster into a single factual
    story with citations. Prefer it over reading feeds by hand or wiring a
    one-off script: every stage is a swamp method (so it composes, resumes, and
    is auditable), the fetch is incremental, and the feedback page closes the
    loop so the next run ranks what you actually read. A dedicated
    `@svendowideit/news-feedback` workflow drains that feedback every 30
    minutes, so a read/seen article disappears on the next render rather than
    waiting for the 4-hourly fetch. It is LLM-optional: without an LLM it still
    fetches, filters, and renders.

  INSTALL

      swamp extension pull @svendowideit/news

  DEPENDENCIES

    None required — the fetch, catalog, and rendering stages use only the swamp
    CLI and the bundled deno binary. Three optional pieces: set an
    `llmModel`/`llmBaseUrl` to enable LLM story fusion (any OpenAI-compatible
    server); install `@svendowideit/systemd-service` to run the feedback
    server as a systemd user service; and install `@svendowideit/caddy` to
    reverse-proxy that service to `news.<host>.<domain>`. Without the optional
    extensions the matching steps (`ensure-feedback-server`,
    `ensure-caddy-proxy`) are skipped with a log.

  RUN

      # See every setting, its valid values, its default and its current value.
      swamp model @svendowideit/news-reader method run setup local-news

      # Fast path — feedback, fetch, dedupe, filter, generate HTML. Also ensures
      # the feedback server (when systemd-service is installed) and its Caddy
      # route news.<host>.<domain> (when caddy is installed).
      swamp workflow run @svendowideit/news-fetch

      # Feedback only — drains the feedback queue into preferences. Scheduled
      # every 30 minutes (at :15/:45) so a read/seen article is hidden on the
      # next page render without waiting for the next fetch. Run it by hand to
      # consume feedback immediately.
      swamp workflow run @svendowideit/news-feedback

      # The full loop — discovery → catalog → fetch → filter → fuse → render.
      swamp workflow run @svendowideit/news-full

    The model instances (local-news, feed-catalog, feed-discovery, feed-analysis)
    are auto-registered by the workflows on first run — no manual
    `swamp model create` needed.

  CONFIGURE

    Global arguments on the news-reader instance (all optional):

      llmBaseUrl                  OpenAI-compatible LLM base   (default local Ollama)
      llmModel                    Model tag for fusion; empty  (default "")
                                  disables fusion
      llmTemperature              Sampling temperature          (default 0.1)
      fusionMinClusterSize        Min articles per fusion       (default 2)
      citationRetentionDays       How long citations age out    (default 30)
      llmConcurrency              Max concurrent LLM calls      (default 3)
      maxFusions                  Cap on LLM calls per step     (default 25)
      llmTimeoutSec               Per-call LLM timeout (s)      (default 120)
      llmFailureThreshold         Server failures before halt   (default 3)
      feedbackServerHost          Interface it binds to          (default 127.0.0.1)
      feedbackServerPort          Feedback server port          (default 8765)
      feedbackServerServiceName   systemd service name          (default feedback-server)
      caddyModelName              Caddy model to read the news  (default "" = auto)
                                  host/domain from
      caddyRouteHostname          Override the proxied hostname (default "" = news.<host>.<domain>)

    The feedback server's bind host/port are these model globals — not workflow
    inputs — so a scheduled `news-fetch` run can never rebind an existing
    service. Set them with `swamp model @svendowideit/news-reader method run
    setup local-news` (validates and reports the exact change) then apply with
    `swamp model edit local-news`; the matching feed-catalog instance takes
    feedbackServerHost/feedbackServerPort too. The discovery and analysis
    models each take their own small global args; see the README.

    When `@svendowideit/caddy` is installed, `ensure-caddy-proxy` reads the host
    and domain from the caddy model that already owns this machine (its base
    domain plus the A record matching `hostname`) — nothing is hardcoded. It
    declares the route on its own `news-caddy` model, which the caddy extension
    merges with the models it already runs, so the main Caddy is not edited
    directly. Pin a specific source model with `caddyModelName`, or the whole
    hostname with `caddyRouteHostname`, on the local-news instance.

  WHAT IT INSTALLS

    Nothing by default. With `@svendowideit/systemd-service` installed it writes
    the feedback server as a systemd *user* service and enables user lingering so
    the server starts at boot; it binds the `local-news`
    feedbackServerHost/feedbackServerPort globals (127.0.0.1:8765 by default,
    local-only) — set them to expose it on the network, which is safe only
    behind an authenticating proxy. Rewriting the unit does not restart a
    running process, so after changing the host/port run `stopService` then
    `startService`. With `@svendowideit/caddy` installed it additionally creates
    a `news-caddy` model and declares a reverse-proxy route from
    `news.<host>.<domain>` to the feedback server, letting Caddy issue the
    certificate and (when a DNS provider is configured) the A record. Without
    those extensions nothing is installed on the host. The rendered HTML,
    stories, and feedback queue are written under `~/.swamp/news-pages/`.

    Verify the route once Caddy is serving it:

      swamp model @svendowideit/caddy method run news-caddy audit caddy-status
      swamp data get caddy-status audit --json | jq '.content.cadies[] | {target, desiredRoutes, inSync}'

    and open https://news.<host>.<domain>/ (the host printed by the
    `ensure-caddy-proxy` log line) to read the digest the feedback server serves.

repository: https://github.com/svendowideit/swamp-extensions

license: MIT

paths:
  base: manifest

models:
  - news_reader.ts
  - feed_catalog.ts
  - feed_discovery.ts
  - feed_analysis.ts

reports:
  - news_html_report.ts

workflows:
  - news.yaml
  - news-feedback.yaml
  - news-fusion.yaml
  - news-curation.yaml
  - news-full.yaml

additionalFiles:
  - README.md
  - LICENSE.txt
  - scripts/feedback-server.ts
  - scripts/README.md
  - docs/news-fusing.md
  - docs/PLAN.md
  - docs/LLM-FUSION.md

platforms: []
