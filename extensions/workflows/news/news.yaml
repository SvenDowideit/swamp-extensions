id: 22d55bc4-a25e-48af-a0ba-6c2cef52f761
name: "@svendowideit/news-fetch"
description: |
  Fast-path news workflow — gathers feedback, fetches feeds from the catalog,
  deduplicates articles, filters by age, and generates the HTML report.
  Runs every 4 hours. No LLM calls, no catalog maintenance, no feed discovery.

  Fusion (LLM story clustering) runs separately via the @svendowideit/news-fusion workflow.
  Curation (feed dedupe, discovery, page analysis) runs separately via the
  @svendowideit/news-curation workflow.

  Loop: gather-feedback → fetch → dedupe-articles → filter → generate → generate-feeds-html
tags: {}
trigger:
  schedule: 0 */4 * * *
  inputs:
    feeds: []
    discoverNewFeeds: false
inputs:
  properties:
    feeds:
      type: array
      items:
        type: string
      default: []
      description: RSS/Atom feed URLs to fetch (overrides catalog if non-empty).
    action:
      type: string
      enum:
      - fetch_generate
      - feedback
      default: fetch_generate
      description: Whether to fetch+generate, or record feedback.
    articleId:
      type: string
      default: ''
      description: Article ID for feedback (from the HTML page).
    feedbackAction:
      type: string
      enum:
      - interested
      - ignored
      default: interested
      description: Whether the user found the article interesting or ignored it.
    source:
      type: string
      default: ''
      description: Feed source name (for feedback).
    title:
      type: string
      default: ''
      description: Article title (for feedback).
    topN:
      type: integer
      default: 0
      description: Number of articles in the HTML report (0 = all).
    newsAge:
      type: string
      default: 3d
      description: Time range of news to show (e.g., 2h, 7d, 4w, 1m). Supports h (hours),
        d (days), w (weeks), m (months). Defaults to 3 days.
    feedbackServerUrl:
      type: string
      default: http://localhost:8765
      description: URL of the feedback queue HTTP server.
    feedbackBatchSize:
      type: integer
      default: 100
      description: Number of feedback entries to process per batch.
    feedbackMaxBatches:
      type: integer
      default: 20
      description: Maximum number of batches to process in one run.
    outputPath:
      type: string
      default: ""
      description: If set, write the generated HTML to this local file path.
        Defaults to `~/.swamp/news-pages/news.html` when empty.
  required: []
reports:
  require:
  - '@svendowideit/news-html-report'
jobs:
- name: main
  description: Gather feedback, fetch feeds, filter by age, generate HTML.
  steps:
  - name: gather-feedback
    description: Poll the feedback queue server and import any pending feedback entries
      into preferences.
    task:
      type: model_method
      modelType: "@svendowideit/news-reader"
      modelName: local-news
      methodName: gatherFeedback
      inputs:
        serverUrl: ${{ inputs.feedbackServerUrl }}
        batchSize: ${{ inputs.feedbackBatchSize }}
        maxBatches: ${{ inputs.feedbackMaxBatches }}
    dependsOn: []
    weight: 0
    allowFailure: true
  - name: fetch
    description: Fetch RSS feeds from the news-feed-catalog (or from --input feeds if provided).
    guard: ${{ data.latest("local-news", "feed-snapshot") != null && timestamp(run.startedAt)
      - timestamp(data.latest("local-news", "feed-snapshot").attributes.fetchedAt)
      < duration("1h") }}
    task:
      type: model_method
      modelType: "@svendowideit/news-reader"
      modelName: local-news
      methodName: fetch
      inputs:
        feeds: '${{ inputs.feeds.size() > 0 ? inputs.feeds : data.latest("feed-catalog",
          "current").?attributes.?feeds.orValue([]) }}'
    dependsOn:
    - step: gather-feedback
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: failed
    weight: 0
    allowFailure: false
  - name: dedupe-articles
    description: Group articles by URL, mark duplicates, and annotate primary articles
      with duplicate source info so the filter step skips them and the HTML shows
      cross-feed indicators.
    task:
      type: model_method
      modelType: "@svendowideit/news-reader"
      modelName: local-news
      methodName: dedupeArticles
      inputs: {}
    dependsOn:
    - step: fetch
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: filter
    description: 'Filter articles by age (default: last 3 days).'
    task:
      type: model_method
      modelType: "@svendowideit/news-reader"
      modelName: local-news
      methodName: filterByAge
      inputs:
        newsAge: ${{ inputs.newsAge }}
    dependsOn:
    - step: dedupe-articles
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: generate
    description: Generate HTML report from filtered articles, ranked by preferences,
      with fused stories rendered inline (from fusion workflow).
    task:
      type: model_method
      modelType: "@svendowideit/news-reader"
      modelName: local-news
      methodName: generate
      inputs:
        topN: ${{ inputs.topN }}
        outputPath: ${{ inputs.outputPath }}
    dependsOn:
    - step: filter
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    weight: 0
    allowFailure: false
  - name: generate-feeds-html
    description: Render a static feeds.html listing all catalog feeds, grouped by
      duplicates, with per-feed seen/read/interested/ignored article counts and a
      cross-link back to the news summary.
    task:
      type: model_method
      modelType: "@svendowideit/news-feed-catalog"
      modelName: feed-catalog
      methodName: generateFeedsHtml
      inputs:
        prefs: ${{ data.latest("local-news", "prefs-current").?attributes.orValue({}) }}
        snapshot: ${{ data.latest("local-news", "feed-snapshot").?attributes.orValue({}) }}
    dependsOn:
    - step: filter
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    weight: 0
    allowFailure: true
  dependsOn: []
  weight: 0
version: 1
