# Read-only; regenerate via 'swamp extension pull'
manifestVersion: 1
name: "@svendowideit/swamp-pulse"
version: "2026.09.19.1"
description: |
  A leaderboard-style activity dashboard for the swamp project itself. Tracks
  swamp-club Lab issues, GitHub commits and GitHub releases across
  swamp-club/swamp and swamp-club/swamp-extensions, joins each release, its
  commit and its pull request into a single merged item, ranks items by a
  synthesized significance hierarchy (tier first, recency as tie-break), and
  renders six linked static HTML pages — a documentation summary, an activity
  leaderboard, an extension-registry page (new / updated / most-pulled, linked
  to source repos) and changes, releases and issues detail pages with
  24h / 7d / current-month windows.

  INSTALL (required)

      swamp extension pull @svendowideit/swamp-pulse
      swamp extension pull @webframp/github
      swamp extension trust add webframp

  RUN (required)

      swamp workflow run @svendowideit/swamp-pulse

  Scheduled hourly by default. Output lands in ~/.swamp/swamp-pulse/:
  index.html (documentation summary, current month), leaderboard.html
  (activity for 24h / 7d / month), extensions.html (registry changes),
  changes.html, releases.html, issues.html.

  Publishing is opt-in and never runs by default. Serve locally as a systemd
  user service with @svendowideit/systemd-service; or publish to GitHub Pages
  with @svendowideit/github-pages (requires pagesRepo and pagesBranch).

  CONFIGURE (all optional — public data, no secrets required)

  See every setting, its valid values, its default and its current value:

      swamp model @svendowideit/swamp-pulse method run setup pulse

  Pass any of them to have the value validated and see the exact change to
  make (this does not persist anything):

      swamp model @svendowideit/swamp-pulse method run setup pulse \
        --input publishMode=github-pages \
        --input pagesRepo=owner/repo --input pagesBranch=gh-pages

  The setup method works before the "pulse" instance exists — running any
  method creates it with defaults. Note that auto-created instances live in
  .swamp/auto-definitions/ and are deliberately NOT listed by
  "swamp model search"/"model list", so those can look empty even while
  workflows run. "swamp model get pulse" shows it. This is also why
  "swamp model edit pulse" can report "Model not found" on a fresh install:
  run setup first, or create the instance explicitly (below).

  Publishing is driven by the "pulse" model instance, not by the trigger, so
  configuring it once makes every scheduled run honour it.

  Settings:  publishMode (false | caddy | github-pages), pagesRepo,
             pagesBranch, pagesPath (/ or /docs), pagesCname,
             caddyHostname, caddyUpstream.
  Also:      outputDir, windows, serverPort, serverServiceName.
  Note:      "repos" is a WORKFLOW input, not a model global.

  Set them when creating the instance:

      swamp model create @svendowideit/swamp-pulse pulse \
        --global-arg publishMode=github-pages \
        --global-arg pagesRepo=owner/repo \
        --global-arg pagesBranch=gh-pages

  That writes models/@svendowideit/swamp-pulse/pulse.yaml — a normal,
  committable file listing every setting, safe to edit directly. To change it
  afterwards, edit that file or run:

      swamp model edit pulse          # opens $EDITOR, save and quit
      cat models/@svendowideit/swamp-pulse/pulse.yaml | swamp model edit pulse --json

  If the instance does not exist yet, the first run auto-creates it with all
  defaults (publishing off). Auto-created instances live in
  .swamp/auto-definitions/ and are not listed by "swamp model search".

  Precedence:  per-run --input  >  model global argument  >  schema default.
  So an individual run can override the model:

      swamp workflow run @svendowideit/swamp-pulse \
        --input publish=github-pages \
        --input pagesRepo=owner/repo --input pagesBranch=gh-pages

  An empty --input publish defers to the model (its default is ""), so a bare
  "swamp workflow run" never overrides a configured instance.

  Inspect what a run resolved:

      swamp data get pulse publish-config --json

  Serve the pages over HTTP

  The workflow runs the pulse static server as a systemd user service, and
  needs this extension for that:

      swamp extension pull @svendowideit/systemd-service

  With it installed, the ensure-server step starts the service at boot (via
  lingering) and keeps it running. Without it, the step is skipped and you run
  the server by hand:

      ~/.swamp/deno/deno run --allow-net --allow-read --allow-env \
        scripts/pulse-server.ts --port 8899 --dir ~/.swamp/swamp-pulse

  Tune the service:  --input serverPort=8899 --input serviceName=swamp-pulse-server

  PUBLISH TARGETS (all opt-in; nothing publishes by default)

  GitHub Pages — commits the rendered pages to a repository's Pages site:

      swamp extension pull @svendowideit/github-pages

  Caddy — serves them on a hostname through a reverse proxy:

      swamp extension pull @svendowideit/caddy
      swamp workflow run @svendowideit/swamp-pulse \
        --input publish=caddy --input hostname=pulse.example.com

  Both need their target set (pagesRepo/pagesBranch, or caddyHostname) either
  on the pulse model or per run; see CONFIGURE above. A run that selects a mode
  without a target fails fast with an actionable error.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - swamp_pulse.ts
  - swamp_club.ts
  - github_commits.ts
  - swamp_ext_registry.ts

reports:
  - swamp_pulse_report.ts

workflows:
  - swamp-pulse.yaml

additionalFiles:
  - README.md
  - LICENSE.txt
  - NOTICE
  - swamp_pulse_test.ts
  - swamp_club_test.ts
  - github_commits_test.ts
  - swamp_pulse_report_test.ts
  - swamp_ext_registry_test.ts
  - scripts/pulse-server.ts

dependencies:
  - "@webframp/github"
  - "@svendowideit/github-pages"

platforms: []
