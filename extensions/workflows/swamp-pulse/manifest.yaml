# Read-only; regenerate via 'swamp extension pull'
manifestVersion: 1
name: "@svendowideit/swamp-pulse"
version: "2026.09.18.1"
description: |
  A leaderboard-style activity dashboard for the swamp project itself. Tracks
  swamp-club Lab issues, GitHub commits and GitHub releases across
  swamp-club/swamp and swamp-club/swamp-extensions, joins each release, its
  commit and its pull request into a single merged item, ranks items by a
  synthesized significance hierarchy (tier first, recency as tie-break), and
  renders four linked static HTML pages — a leaderboard-style summary plus
  changes, releases and issues detail pages with 24h / 7d / current-month
  windows.

  INSTALL (required)

      swamp extension pull @svendowideit/swamp-pulse
      swamp extension pull @webframp/github
      swamp extension trust add webframp

  RUN (required)

      swamp workflow run @svendowideit/swamp-pulse

  Scheduled hourly by default. Output lands in ~/.swamp/swamp-pulse/:
  index.html (summary), changes.html, releases.html, issues.html.

  CONFIGURE (all optional — public data, no secrets required)

    apiKey           swamp-club API key, supplied from a vault. Unset runs
                     anonymously against the public Lab API.
    outputDir        Where the HTML pages are written.
    windows          Activity windows to render (24h, 7d, month).
    repos            Repositories to track.

  Serve the pages over HTTP

  The workflow runs the pulse static server as a systemd user service, and
  needs this extension for that:

      swamp extension pull @svendowideit/systemd-service

  With it installed, the ensure-server step starts the service at boot (via
  lingering) and keeps it running. Without it, the step is skipped and you run
  the server by hand:

      ~/.swamp/deno/deno run --allow-net --allow-read --allow-env \
        scripts/pulse-server.ts --port 8899 --dir ~/.swamp/swamp-pulse

  Tune the service:  --input serverPort=8899 --input serviceName=swamp-pulse-server

  Publish on a hostname via Caddy (optional)

  Requires the Caddy extension and a configured my-caddy model instance:

      swamp extension pull @svendowideit/caddy
      swamp workflow run @svendowideit/swamp-pulse \
        --input publish=caddy --input hostname=pulse.example.com

  The ensure-server step supplies the upstream the proxy points at.

repository: https://github.com/svendowideit/swamp-extensions

paths:
  base: manifest

models:
  - swamp_pulse.ts
  - swamp_club.ts
  - github_commits.ts

reports:
  - swamp_pulse_report.ts

workflows:
  - swamp-pulse.yaml

additionalFiles:
  - README.md
  - LICENSE.txt
  - NOTICE
  - swamp_pulse_test.ts
  - swamp_club_test.ts
  - github_commits_test.ts
  - swamp_pulse_report_test.ts
  - scripts/pulse-server.ts

dependencies:
  - "@webframp/github"

platforms: []
