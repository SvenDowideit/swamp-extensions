id: 7c2f9a10-5b4d-4e8f-9a1c-2d3e4f5a6b7c
name: "@svendowideit/swamp-pulse"
description: |
  Swamp Pulse — collect swamp activity and render the dashboard.

  Every hour: cache the manual index, collect Lab issues, commits, releases and
  changed docs (fanning out over every configured repo), join each release with
  its commit and pull request into one merged item, rank by significance
  (tier first, recency as tie-break), then render five linked HTML pages —
  a documentation summary, an activity leaderboard, and changes, releases and
  issues tour pages.

  Usage:
    swamp workflow run @svendowideit/swamp-pulse
    swamp workflow run @svendowideit/swamp-pulse --input publish=caddy

  Output: ~/.swamp/swamp-pulse/{index,changes,releases,issues}.html
inputs:
  properties:
    repos:
      type: array
      items:
        type: string
      default:
        - swamp-club/swamp
        - swamp-club/swamp-extensions
      description: Repositories to track (owner/name).
    since:
      type: string
      default: ""
      description: Collection window start (ISO-8601); empty means 30 days ago.
    outputDir:
      type: string
      default: ""
      description: Override the HTML output directory.
    publish:
      type: string
      enum:
        - "false"
        - caddy
      default: "false"
      description: Publishing mode — local files are always written; caddy additionally serves them.
    hostname:
      type: string
      default: ""
      description: Public hostname to serve the pages on (caddy publish mode).
    upstream:
      type: string
      default: "127.0.0.1:8899"
      description: host:port the pulse static server listens on (caddy publish mode).
    serverPort:
      type: integer
      default: 8899
      description: Port the pulse static server listens on (systemd user service).
    serviceName:
      type: string
      default: swamp-pulse-server
      description: systemd user service name for the pulse static server.
  required: []
tags: {}
trigger:
  schedule: 0 * * * *
jobs:
  - name: main
    description: Collect → rank → render → (optional) publish.
    steps:
      - name: manual-index
        description: Cache the swamp-club manual page index so doc changes can link to their published page.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: sync_manual_index
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-issues
        description: Collect swamp-club Lab issues (anonymous unless an apiKey is configured).
        task:
          type: model_method
          modelType: "@svendowideit/swamp-club"
          modelName: swamp-club
          methodName: search_lab_issues
          inputs:
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-commits
        description: Collect commits for every configured repository in one fan-out call.
        task:
          type: model_method
          modelType: "@webframp/github"
          modelName: github
          methodName: collect_commits
          inputs:
            repos: ${{ inputs.repos }}
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-releases
        description: Collect body-inclusive releases for every configured repository.
        task:
          type: model_method
          modelType: "@webframp/github"
          modelName: github
          methodName: collect_releases
          inputs:
            repos: ${{ inputs.repos }}
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-docs
        description: Find changed documentation files in the window (doc-suspect commits only).
        task:
          type: model_method
          modelType: "@webframp/github"
          modelName: github
          methodName: collect_doc_changes
          inputs:
            repos: ${{ inputs.repos }}
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-extensions
        description: Read the public extension registry and report new / updated extensions plus the most pulled.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-ext-registry"
          modelName: ext-registry
          methodName: collect_extensions
          inputs:
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: rank
        description: Join releases↔commits↔PRs into merged items, merge into the rolling store, and rank by window.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: rank
          inputs:
            commits: ${{ data.latest("github", "commits").?attributes.orValue({}) }}
            releases: ${{ data.latest("github", "releases").?attributes.orValue({}) }}
            docChanges: ${{ data.latest("github", "docs").?attributes.orValue({}) }}
            labIssues: ${{ data.latest("swamp-club", "issues").?attributes.orValue({}) }}
            extensions: ${{ data.latest("ext-registry", "registry").?attributes.orValue({}) }}
        dependsOn:
          - step: collect-issues
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-commits
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-releases
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-docs
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-extensions
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: manual-index
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: false
      - name: render
        description: Render the five linked HTML pages from the ranked data.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: render
          inputs:
            outputDir: ${{ inputs.outputDir }}
        dependsOn:
          - step: rank
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: ensure-server
        description: >-
          Idempotently ensure the pulse static server runs as a systemd user
          service (via @svendowideit/systemd-service) so the rendered pages are
          always served. Skips gracefully with a log if that extension is not
          installed.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: ensureServer
          inputs:
            port: ${{ inputs.serverPort }}
            serviceName: ${{ inputs.serviceName }}
        dependsOn:
          - step: render
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: publish-caddy
        description: >-
          Point a Caddy reverse proxy at the pulse server (requires
          @svendowideit/caddy and a configured my-caddy model). Guarded to
          publish=caddy and allowFailure, so an absent Caddy degrades to
          local-only.
        guard: ${{ inputs.publish == "caddy" && inputs.hostname != "" }}
        task:
          type: model_method
          modelType: "@svendowideit/caddy"
          modelName: my-caddy
          methodName: ensureDnsProxy
          inputs:
            hostname: ${{ inputs.hostname }}
            upstream: ${{ inputs.upstream }}
        dependsOn:
          - step: ensure-server
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: true
    dependsOn: []
    weight: 0
version: 1
