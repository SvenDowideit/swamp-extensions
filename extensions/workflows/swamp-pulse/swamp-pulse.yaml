id: 7c2f9a10-5b4d-4e8f-9a1c-2d3e4f5a6b7c
name: "@svendowideit/swamp-pulse"
description: |
  Swamp Pulse — collect swamp activity and render the dashboard.

  Every hour: cache the manual index, collect Lab issues, commits, releases and
  changed docs (fanning out over every configured repo), join each release with
  its commit and pull request into one merged item, rank by significance
  (tier first, recency as tie-break), then render five linked HTML pages —
  a documentation summary, an activity leaderboard, and changes, releases and
  issues tour pages.

  Usage:
    swamp workflow run @svendowideit/swamp-pulse
    swamp workflow run @svendowideit/swamp-pulse --input publish=caddy

  Output: ~/.swamp/swamp-pulse/{index,changes,releases,issues}.html
inputs:
  properties:
    repos:
      type: array
      items:
        type: string
      default:
        - swamp-club/swamp
        - swamp-club/swamp-extensions
      description: Repositories to track (owner/name).
    since:
      type: string
      default: ""
      description: Collection window start (ISO-8601); empty means 30 days ago.
    outputDir:
      type: string
      default: ""
      description: Override the HTML output directory.
    publish:
      type: string
      enum:
        - "false"
        - caddy
        - github-pages
      default: "false"
      description: >-
        Publishing mode — local files are always written. caddy additionally
        serves them locally; github-pages commits them to a repository
    hostname:
      type: string
      default: ""
      description: Public hostname to serve the pages on (caddy publish mode).
    upstream:
      type: string
      default: "127.0.0.1:8899"
      description: host:port the pulse static server listens on (caddy publish mode).
    serverPort:
      type: integer
      default: 8899
      description: Port the pulse static server listens on (systemd user service).
    serviceName:
      type: string
      default: swamp-pulse-server
      description: systemd user service name for the pulse static server.
    pagesRepo:
      type: string
      default: ""
      description: >-
        Target repository for github-pages publishing, as owner/name. Required
        (with pagesBranch) when publish=github-pages.
    pagesBranch:
      type: string
      default: ""
      description: >-
        Branch to publish the Pages site to (e.g. gh-pages). Required when
        publish=github-pages.
    pagesPath:
      type: string
      enum:
        - /
        - /docs
      default: /
      description: Directory within the repository Pages serves from.
    pagesCname:
      type: string
      default: ""
      description: Optional custom domain to configure for the Pages site.
  required: []
tags: {}
trigger:
  schedule: 0 * * * *
jobs:
  - name: main
    description: Collect → rank → render → (optional) publish.
    steps:
      - name: configure
        description: >-
          Resolve the model's publishing globals into the publishConfig
          resource. Publishes nothing; every publish guard reads this. Set the
          mode and targets once on the pulse model and scheduled runs honour it.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: publishConfig
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: manual-index
        description: Cache the swamp-club manual page index so doc changes can link to their published page.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: sync_manual_index
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-issues
        description: Collect swamp-club Lab issues (anonymous unless an apiKey is configured).
        task:
          type: model_method
          modelType: "@svendowideit/swamp-club"
          modelName: swamp-club
          methodName: search_lab_issues
          inputs:
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-commits
        description: Collect commits for every configured repository in one fan-out call.
        task:
          type: model_method
          modelType: "@webframp/github"
          modelName: github
          methodName: collect_commits
          inputs:
            repos: ${{ inputs.repos }}
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-releases
        description: Collect body-inclusive releases for every configured repository.
        task:
          type: model_method
          modelType: "@webframp/github"
          modelName: github
          methodName: collect_releases
          inputs:
            repos: ${{ inputs.repos }}
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-docs
        description: Find changed documentation files in the window (doc-suspect commits only).
        task:
          type: model_method
          modelType: "@webframp/github"
          modelName: github
          methodName: collect_doc_changes
          inputs:
            repos: ${{ inputs.repos }}
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-extensions
        description: Read the public extension registry and report new / updated extensions plus the most pulled.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-ext-registry"
          modelName: ext-registry
          methodName: collect_extensions
          inputs:
            since: ${{ inputs.since }}
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: rank
        description: Join releases↔commits↔PRs into merged items, merge into the rolling store, and rank by window.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: rank
          inputs:
            commits: ${{ data.latest("github", "commits").?attributes.orValue({}) }}
            releases: ${{ data.latest("github", "releases").?attributes.orValue({}) }}
            docChanges: ${{ data.latest("github", "docs").?attributes.orValue({}) }}
            labIssues: ${{ data.latest("swamp-club", "issues").?attributes.orValue({}) }}
            extensions: ${{ data.latest("ext-registry", "registry").?attributes.orValue({}) }}
        dependsOn:
          - step: collect-issues
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-commits
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-releases
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-docs
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: collect-extensions
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: manual-index
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: false
      - name: render
        description: Render the five linked HTML pages from the ranked data.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: render
          inputs:
            outputDir: ${{ inputs.outputDir }}
        dependsOn:
          - step: rank
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: ensure-server
        description: >-
          Idempotently ensure the pulse static server runs as a systemd user
          service (via @svendowideit/systemd-service) so the rendered pages are
          always served. Skips gracefully with a log if that extension is not
          installed.
        task:
          type: model_method
          modelType: "@svendowideit/swamp-pulse"
          modelName: pulse
          methodName: ensureServer
          inputs:
            port: ${{ inputs.serverPort }}
            serviceName: ${{ inputs.serviceName }}
        dependsOn:
          - step: render
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: publish-caddy
        description: >-
          Point a Caddy reverse proxy at the pulse server (requires
          @svendowideit/caddy and a configured my-caddy model). Guarded to
          publish=caddy and allowFailure, so an absent Caddy degrades to
          local-only.
        guard: >-
          ${{ data.latest("pulse", "publish-config").?attributes.?mode.orValue("false")
          != "caddy" ||
          data.latest("pulse", "publish-config").?attributes.?caddyHostname.orValue("")
          == "" }}
        task:
          type: model_method
          modelType: "@svendowideit/caddy"
          modelName: my-caddy
          methodName: ensureDnsProxy
          inputs:
            hostname: ${{ data.latest("pulse", "publish-config").attributes.caddyHostname }}
            upstream: ${{ data.latest("pulse", "publish-config").attributes.caddyUpstream }}
        dependsOn:
          - step: ensure-server
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
          - step: configure
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: true
      - name: require-pages-config
        description: >-
          Fail fast when the github-pages publish mode is configured without a
          target repository and branch, rather than silently doing nothing.
        guard: >-
          ${{ data.latest("pulse", "publish-config").?attributes.?mode.orValue("false")
          != "github-pages" }}
        task:
          type: assert
          expr: >-
            data.latest("pulse", "publish-config").attributes.reason == ""
          message: >-
            ${{ data.latest("pulse", "publish-config").?attributes.?reason.orValue("publishing configuration is incomplete") }}
          severity: high
        dependsOn:
          - step: render
            condition:
              type: succeeded
          - step: configure
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: false
      - name: publish-github-pages
        description: >-
          Commit the rendered pages to a GitHub repository's Pages site
          (requires @svendowideit/github-pages and gh authentication). Guarded
          to publish=github-pages so nothing is published by default.
        guard: >-
          ${{ data.latest("pulse", "publish-config").?attributes.?mode.orValue("false")
          != "github-pages" ||
          data.latest("pulse", "publish-config").?attributes.?configured.orValue(false)
          == false }}
        task:
          type: model_method
          modelType: "@svendowideit/github-pages"
          modelName: pulse-pages
          methodName: publishDir
          inputs:
            dir: >-
              ${{ data.latest("pulse", "publish-config").?attributes.?outputDir.orValue(inputs.outputDir != "" ? inputs.outputDir : "~/.swamp/swamp-pulse") }}
            repo: ${{ data.latest("pulse", "publish-config").attributes.pagesRepo }}
            branch: ${{ data.latest("pulse", "publish-config").attributes.pagesBranch }}
            message: ${{ "Publish Swamp Pulse " + run.startedAt }}
            prune: true
        dependsOn:
          - step: require-pages-config
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: configure
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: failed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
