id: 15344c45-bb8f-42ad-bdde-fae90ec1c83d
name: caddy-ensure-proxy
description: |
  Idempotently ensure Caddy is set up AND a full hostname proxies to a backend
  host:port.

  First runs the caddy-setup workflow (install/create/start — all idempotent),
  then ensures the reverse-proxy route: adds it if missing, updates it if the
  upstream changed, and is a no-op if already correct. Safe to run repeatedly
  (desired-state), so it can be called by a user or another extension/workflow.

  Prerequisite — the Caddy model "my-caddy" must exist:
    swamp model create @svendowideit/caddy my-caddy \
      --global-arg baseDomain=example.com --global-arg letsEncryptEmail=admin@example.com

  Run:
    swamp workflow run caddy-ensure-proxy \
      --input hostname=foo.example.com --input upstream=127.0.0.1:8080
tags: {}
inputs:
  properties:
    hostname:
      type: string
      description: Full hostname to proxy (e.g. foo.example.com).
    upstream:
      type: string
      description: Backend host:port to proxy to (e.g. 127.0.0.1:8080 or https://10.0.0.5:8443).
  required:
    - hostname
    - upstream
jobs:
  - name: main
    description: Ensure Caddy is set up, then ensure the reverse-proxy route.
    steps:
      - name: setup
        description: Ensure Caddy is installed and running (idempotent).
        task:
          type: workflow
          workflowIdOrName: caddy-setup
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: ensure
        description: Ensure the hostname proxies to the upstream (add/update/no-op).
        task:
          type: model_method
          modelType: "@svendowideit/caddy"
          modelName: my-caddy
          methodName: ensureDnsProxy
          inputs:
            hostname: ${{ inputs.hostname }}
            upstream: ${{ inputs.upstream }}
        dependsOn:
          - step: setup
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
